# Managed by doco-cd from git. Do not edit on the host.
#
# db_engine = sqlite, NOT the default lmdb: garage's docs warn LMDB "files have a
# tendency of becoming corrupted after an unclean shutdown", which is elizabeth's
# demonstrated failure mode (2026-07-29 and 2026-08-19).
#
# metadata_dir is bind-mounted from /mnt/cache/appdata/garage (btrfs on NVMe).
# Garage issue #1200: the maintainer attributes malformed databases to "unclean
# shutdown + non-resilient filesystem", counting BTRFS/ZFS resilient and
# ext4/XFS non-resilient. So sqlite alone is not enough - the filesystem matters
# too, and /mnt/user/... would additionally put SQLite on FUSE.
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

# Garage takes its own application-consistent metadata snapshots on this
# interval, into <metadata_dir>/snapshots/. It caps itself at the TWO most recent
# (hardcoded, no retention setting), so this cannot grow unbounded.
#
# Kept because it costs nothing: one declarative line, done internally by garage,
# with no cron, no script and no job to monitor. What it buys is the metadata
# index - lose that and the data blocks survive but are unreferenced, so the
# record of every past backup is gone and garage has to be rebuilt from scratch.
#
# Worth it specifically on THIS host: garage's docs warn its metadata engine
# "can become corrupted after an unclean shutdown", and elizabeth has had two
# unclean shutdowns in three weeks.
#
# ⚠️ Do NOT rebuild the discarded companion to this - a host cron copying
# snapshots out for 7-day retention. That was tried and removed: a script on a
# vfat filesystem that cannot carry an execute bit, a cron in a RAM filesystem
# needing /boot/config/go to survive reboots, and an unmonitored job. Four
# fragilities for a marginal gain, and all on the same NVMe pool, so no defence
# against the disk loss that actually threatens this.
metadata_auto_snapshot_interval = "24h"

# Single node. Stated explicitly rather than left implicit: this is NOT
# redundancy, and the backup-of-backups problem is tracked separately.
replication_factor = 1

# Required by garage v2.3.0 even for a single node - it refuses to start with
# "missing field `rpc_bind_addr`". Only cluster-internal RPC listens here; it is
# deliberately NOT published in docker-compose.yaml, so nothing outside the host
# can reach it. rpc_public_addr is omitted because there are no peers to
# advertise to.
rpc_bind_addr = "[::]:3901"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
