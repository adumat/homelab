# Managed by doco-cd from git. Do not edit on the host.
#
# db_engine = sqlite, NOT the default lmdb: garage's docs warn LMDB "files have a
# tendency of becoming corrupted after an unclean shutdown", which is elizabeth's
# demonstrated failure mode (2026-07-29 and 2026-08-19).
#
# metadata_dir is bind-mounted from /mnt/cache/appdata/garage (btrfs on NVMe).
# Garage issue #1200: the maintainer attributes malformed databases to "unclean
# shutdown + non-resilient filesystem", counting BTRFS/ZFS resilient and
# ext4/XFS non-resilient. So sqlite alone is not enough - the filesystem matters
# too, and /mnt/user/... would additionally put SQLite on FUSE.
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

# No metadata snapshots, deliberately. metadata_auto_snapshot_interval was tried
# and removed: garage keeps only the TWO most recent snapshots (hardcoded, no
# retention setting), so it buys at most ~2 days, and the accepted consequence of
# losing the metadata DB is to recreate garage - new layout, buckets and key -
# and take fresh backups. The databases themselves are the source of truth and
# are unaffected; what is lost is the record of past backups.
#
# An attempt at longer retention via a host cron copying snapshots out was also
# removed: it added a script on a vfat filesystem that cannot hold an execute
# bit, a cron in a RAM filesystem needing /boot/config/go to survive reboots, and
# an unmonitored job - four fragilities for a narrow case, all on the same NVMe
# pool, so useless against the disk loss that actually threatens this.
#
# sqlite (not the default lmdb) remains the real mitigation here: garage's docs
# warn LMDB "files have a tendency of becoming corrupted after an unclean
# shutdown", which is this host's demonstrated failure mode.

# Single node. Stated explicitly rather than left implicit: this is NOT
# redundancy, and the backup-of-backups problem is tracked separately.
replication_factor = 1

# Required by garage v2.3.0 even for a single node - it refuses to start with
# "missing field `rpc_bind_addr`". Only cluster-internal RPC listens here; it is
# deliberately NOT published in docker-compose.yaml, so nothing outside the host
# can reach it. rpc_public_addr is omitted because there are no peers to
# advertise to.
rpc_bind_addr = "[::]:3901"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
