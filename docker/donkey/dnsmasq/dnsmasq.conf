dhcp-host=1c:69:7a:a5:93:fc,kube-nuc.lan,192.168.1.30
host-record=kube-hp.lan,192.168.1.32
dhcp-host=f8:b4:6a:a5:87:ed,kube-hp.lan,192.168.1.32
host-record=kube-ceph-01.lan,192.168.1.33
dhcp-host=e8:6a:64:a4:89:ca,kube-ceph-01.lan,192.168.1.33
host-record=kube-ceph-02.lan,192.168.1.34
