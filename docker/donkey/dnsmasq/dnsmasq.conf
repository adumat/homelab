# dhcp-host=d8:b3:70:e9:e0:82,U6-EXT.lan,192.168.1.52
# address=/U6-EXT.lan/192.168.1.52

# Extra address
host-record=k8s.clusterone.lan,192.168.1.40
host-record=k8s-gateway.clusterone.lan,192.168.1.41
host-record=internal.clusterone.lan,192.168.1.42
host-record=external.clusterone.lan,192.168.1.43
host-record=nut-server-room.lan,192.168.1.2

# gateway
dhcp-option=3,192.168.1.1

#dns
dhcp-option=6,192.168.1.3
dhcp-option=tag:nodns,6,8.8.8.8,8.8.4.4

dhcp-option=42,192.168.1.3
# unifi discover
dhcp-option=43,192.168.1.44

dhcp-mac=set:nodns,84:d6:c5:58:d9:b0

# Legacy PXE
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe

# UEFI 32-bit
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=tag:efi32,ipxe.efi
# UEFI 64-bit
dhcp-match=set:efibc,option:client-arch,7
dhcp-boot=tag:efibc,ipxe.efi
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,ipxe.efi

# iPXE - chainload to matchbox ipxe boot script
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,http://192.168.1.3:8085/boot.ipxe,192.168.1.3,192.168.1.3
# dhcp-boot=tag:ipxe,http://donkey.lan:8085/boot.ipxe,donkey.lan,donkey.lan
