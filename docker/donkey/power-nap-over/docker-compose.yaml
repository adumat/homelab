services:
  power-nap-over-init:
    build: ./init
    container_name: power-nap-over-init
    command: /scripts/generate-config.sh
    volumes:
      - power-nap-over-config:/work/power-nap-over
      - ../../../infra/data:/work/infra/data:ro
      - ../../../kubernetes/talos:/work/talos:ro
      - ./scripts:/scripts:ro

  power-nap-over:
    build: ./app
    container_name: power-nap-over
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      power-nap-over-init:
        condition: service_completed_successfully
    environment:
      - TZ=Europe/Rome
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
      - NUT_MONITOR_PASSWORD=${NUT_MONITOR_PASSWORD}
      - TALOSCONFIG=${TALOSCONFIG}
    volumes:
      - power-nap-over-config:/app/config:ro
      - ./logs:/app/logs
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  power-nap-over-config:
