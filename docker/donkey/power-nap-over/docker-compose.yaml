services:
  power-nap-over-init:
    build: ./init
    container_name: power-nap-over-init
    command: /scripts/generate-config.sh
    volumes:
      - ./:/work/power-nap-over
      - ../dnsmasq:/work/dnsmasq:ro
      - ../../../kubernetes/talos:/work/talos:ro
      - ./scripts:/scripts:ro

  power-nap-over:
    build: ./app
    container_name: power-nap-over
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
