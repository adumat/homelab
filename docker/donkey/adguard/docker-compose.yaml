services:
  adguard-init:
    image: mikefarah/yq:latest
    container_name: adguard-init
    user: '0:0'
    entrypoint: sh
    command:
      - -c
      - |
        yq '
          .users = [{"name": env(ADGUARD_USERNAME), "password": env(ADGUARD_PASSWORD_HASH)}]
        ' /input/AdGuardHome.yaml > /output/AdGuardHome.yaml
    environment:
      - ADGUARD_USERNAME=${ADGUARD_USERNAME}
      - ADGUARD_PASSWORD_HASH=${ADGUARD_PASSWORD_HASH}
    volumes:
      - ./conf/AdGuardHome.yaml:/input/AdGuardHome.yaml:ro
      - adguard_conf:/output

  adguard:
    image: adguard/adguardhome:v0.107.71
    container_name: adguard
    restart: unless-stopped
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    ports:
      - '53:53/udp'
      - '53:53/tcp'
      - '853:853/udp'
      - '853:853/tcp'
      - '5443:5443/udp'
      - '5443:5443/tcp'
      - '6060:6060/tcp'
      - '8080:80/tcp'
    depends_on:
      adguard-init:
        condition: service_completed_successfully

volumes:
  adguard_work:
    name: adguard_volume
    external: true
  adguard_conf:
