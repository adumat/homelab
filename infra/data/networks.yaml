---
# Single source of truth for all network definitions.
# The playbook derives interfaces, DHCP, firewall, and DNS config from this.

# Virtual interfaces (OPNsense VM on Proxmox)
lan_interface: vtnet0
lan_mac: 'bc:24:11:e1:a7:5d'
wan_interface: vtnet1
wan_mac: 'bc:24:11:19:e7:39'

# WAN — FritzBox exposed host (double NAT)
# FritzBox handles PPPoE, glados is DMZ/exposed host
wan_address: 192.168.1.200/24
wan_gateway: 192.168.1.1

# Cilium LoadBalancer pool (BGP-advertised VIPs, no L2 segment).
# Separate from any host VLAN so same-subnet ARP doesn't shadow BGP routes.
# k8s_gateway_ip is pinned; allocator range skips it.
k8s_lb_subnet: 10.1.11.0/24
k8s_gateway_ip: 10.1.11.1
k8s_lb_range_start: 10.1.11.2
k8s_lb_range_stop: 10.1.11.254

# Supernet covering every internal zone (10.1.x.0/24) + the LB pool. Used to scope
# the per-zone "allow internet" rule to NON-internal destinations, so inter-zone
# traffic falls through to the access-matrix rules instead of being passed wholesale.
internal_supernet: 10.1.0.0/16

# Network zones
# Each zone defines its VLAN, subnet, firewall policy, and DHCP config.
#
# Zone properties:
#   internet: true/false              — allow/block internet access
#   client_isolation: true            — block intra-VLAN traffic (devices can't see each other)
#
# access.<target> values:
#   full                                — accept all new connections
#   none                                — drop all new (established/related still allowed)
#   list of {port, description, proto}  — accept only listed ports (proto defaults to tcp)
#   list of {range, description}        — accept only to specific IP range (CIDR)
zones:
  untrusted:
    vlan_id: 1
    subnet: 10.1.1.0/24
    gateway: 10.1.1.1
    internet: true
    pxe: true
    client_isolation: true
    dhcp:
      range_start: 10.1.1.100
      range_stop: 10.1.1.199
      lease: 43200
    access:
      servers: none
      clients: none
      iot: none
      iot_local: none
      guest: none

  servers:
    vlan_id: 10
    subnet: 10.1.10.0/24
    gateway: 10.1.10.1
    internet: true
    pxe: true
    dhcp:
      range_start: 10.1.10.100
      range_stop: 10.1.10.199
      lease: 86400
    static_hosts:
      - name: elizabeth
        mac: '14:da:e9:4d:e7:65'
        ip: 10.1.10.2
      - name: donkey
        mac: 'ee:33:32:65:7e:84'
        ip: 10.1.10.3
      - name: switch-main
        mac: '04:09:73:36:1b:a0'
        ip: 10.1.10.4
      - name: navi
        mac: 'bc:24:11:7d:21:95'
        ip: 10.1.10.5
      - name: bulbasaur
        mac: '1c:69:7a:a5:93:fc'
        ip: 10.1.10.10
      - name: charmander
        mac: 'f8:b4:6a:a5:87:ed'
        ip: 10.1.10.11
      - name: magikarp
        mac: 'e8:6a:64:a4:89:ca'
        ip: 10.1.10.21
      - name: squirtle
        mac: 'e8:6a:64:f6:ff:af'
        ip: 10.1.10.12
      - name: snorlax
        mac: 'e8:6a:64:76:2a:18'
        ip: 10.1.10.23
      - name: u6-pt
        mac: '0c:ea:14:7c:1d:01'
        ip: 10.1.10.50
      - name: u6-p1
        mac: '0c:ea:14:7c:1f:51'
        ip: 10.1.10.51
      - name: u6-ext
        mac: 'd8:b3:70:e9:e0:82'
        ip: 10.1.10.52
    access:
      clients: full
      iot: full
      iot_local: full
      untrusted: none
      guest: none

  clients:
    vlan_id: 20
    subnet: 10.1.20.0/24
    gateway: 10.1.20.1
    internet: true
    pxe: true
    dhcp:
      range_start: 10.1.20.100
      range_stop: 10.1.20.199
      lease: 43200
    static_hosts:
      - name: switch-living
        mac: 'd8:07:b6:d7:94:67'
        ip: 10.1.20.11
      # Shared devices (10.1.20.20-29) — accessible from Guest VLAN
      - name: lg-tv
        mac: 'c0:d7:aa:8e:ca:18'
        ip: 10.1.20.20
      - name: samsung-tv
        mac: 'b0:f2:f6:77:40:24'
        ip: 10.1.20.21
      - name: epson-printer
        mac: 'dc:cd:2f:6f:1b:07'
        ip: 10.1.20.22
      - name: ps5-wifi
        mac: '80:60:b7:10:03:3e'
        ip: 10.1.20.30
      - name: ps5-lan
        mac: '78:c8:81:cf:4a:27'
        ip: 10.1.20.31
    access:
      servers: full
      iot: full
      iot_local: full
      untrusted: none
      guest: none

  iot:
    vlan_id: 30
    subnet: 10.1.30.0/24
    gateway: 10.1.30.1
    internet: true
    pxe: true
    dhcp:
      range_start: 10.1.30.100
      range_stop: 10.1.30.199
      lease: 86400
    static_hosts:
      # Shared devices (10.1.30.20-29) — accessible from Guest VLAN
      - name: google-home
        mac: '00:f6:20:dc:f9:9b'
        ip: 10.1.30.20
      # ESPHome devices (10.1.30.30-39)
      - name: power-outlet
        mac: 'b4:e6:2d:5d:62:9b'
        ip: 10.1.30.30
      - name: iron-outlet
        mac: 'b4:e6:2d:5d:73:88'
        ip: 10.1.30.31
      - name: hvac-controller
        mac: 'f0:9e:9e:54:c1:a4'
        ip: 10.1.30.32
      - name: intercom-controller
        mac: '48:9d:31:c7:4f:c0'
        ip: 10.1.30.33
      # ps5-wake: wakes the PS5 over Bluetooth Classic after a UPS cut leaves it
      # fully off, which the network WAKEUP datagram cannot recover from. MAC read
      # from the silicon with esptool (ESP32-D0WD-V3), not from a lease table.
      - name: ps5-wake
        mac: '68:09:47:79:1d:f0'
        ip: 10.1.30.34
      # Cameras (10.1.30.40-49)
      - name: sofia-camera
        mac: '34:60:f9:4b:b2:8d'
        ip: 10.1.30.40
      - name: nicolo-camera
        mac: 'ec:75:0c:11:61:1c'
        ip: 10.1.30.41
      # Energy (10.1.30.50-59)
      - name: solaredge-inverter
        mac: '84:d6:c5:58:d9:b0'
        ip: 10.1.30.50
    access:
      servers:
        - port: 1883
          description: MQTT
        - port: 8123
          description: Home Assistant
      clients: none
      iot_local: none
      untrusted: none
      guest: none

  iot_local:
    vlan_id: 40
    subnet: 10.1.40.0/24
    gateway: 10.1.40.1
    internet: false
    pxe: true
    dhcp:
      range_start: 10.1.40.100
      range_stop: 10.1.40.199
      lease: 86400
    access:
      servers:
        - port: 1883
          description: MQTT
        - port: 8123
          description: Home Assistant
      clients: none
      iot: none
      untrusted: none
      guest: none

  guest:
    vlan_id: 50
    subnet: 10.1.50.0/24
    gateway: 10.1.50.1
    internet: true
    pxe: true
    client_isolation: true
    dhcp:
      range_start: 10.1.50.100
      range_stop: 10.1.50.199
      lease: 3600
    access:
      # Deliberately allowed: guests reach internal web apps + go2rtc video via the
      # Envoy gateway VIP (in the SERVERS alias), but nothing else on the servers.
      servers:
        - port: 443
          proto: TCP/UDP
          description: 'Internal web apps via gateway (HTTPS/HTTP3)'
        - port: 8555
          proto: UDP
          description: 'go2rtc WebRTC'
      clients:
        - range: 10.1.20.16/28
          description: 'Shared devices (TVs, printer)'
      iot:
        - range: 10.1.30.16/28
          description: 'Shared devices (Google Home)'
      iot_local: none
      untrusted: none

  vpn:
    vlan_id: null # WireGuard interface, not a VLAN
    subnet: 10.1.100.0/24
    gateway: 10.1.100.1
    internet: true
    access:
      servers: full
      clients: full
      iot: full
      iot_local: full
      untrusted: none
      guest: none

# Extra DNS records — served via VyOS authoritative-domain.
# DHCP static hosts are auto-registered under the 'lan' zone by the playbook.
# BGP-advertised LB IPs (k8s-gateway, envoy) don't need records here —
# they're resolved via k8s-gateway + AdGuard once the cluster is up.
dns_records:
  lan:
    - name: nut-server-room
      ip: 10.1.10.3
    # UniFi controller inform endpoint (stable thanks to lbipam pin).
    - name: unifi
      ip: 10.1.11.5
  clusterone.lan:
    - name: k8s
      ip: 10.1.10.40
