# PS5 wake over Bluetooth. Impersonates a paired DualSense to wake the console,
# which the network WAKEUP datagram cannot do once the console is fully off — that
# path requires Rest Mode, and a UPS output cut leaves the PS5 fully off.
#
# Hardware: ORIGINAL ESP32 only (variant: esp32). Bluetooth Classic (BR/EDR) does
# not exist on S2/S3/C3/C6/H2, and this technique needs BR/EDR L2CAP.
#
# Power this from a NON-UPS outlet, so a UPS cycle cannot take out the device whose
# whole purpose is recovering from a UPS cycle.
#
# The two MAC addresses are runtime values, set from the web page at
# http://<device>/ and persisted in flash — deliberately NOT compile-time, so the
# console or the pad can be replaced without a rebuild.

substitutions:
  # The console's LAN address. Its Wi-Fi NIC (10.1.20.30) is down — the PS5 is
  # wired. NOTE this is unrelated to the Bluetooth address used for the wake,
  # which is the Wi-Fi MAC + 1.
  ps5_ip: "10.1.20.31"

esphome:
  name: ps5-wake
  friendly_name: ps5-wake

esp32:
  variant: esp32
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/adumat/homelab
      ref: main
    components: [ps5_wake, ps5_status]
    refresh: 0s

logger:
  # Serial kept as a fallback path: if wifi or the API ever break, this is the only
  # way to see anything. Costs little compared to api:, which is deliberately kept.
  baud_rate: 115200
  # INFO. Note there is NO 'CONFIG' logger level despite ESP_LOGCONFIG existing as a
  # macro — valid values are NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE,
  # and 'CONFIG' is a hard validation error. Consequence: at INFO the ESP_LOGCONFIG
  # boot dump is hidden, so anything worth keeping must be logged at INFO or above.
  # The heap-at-setup figure was promoted to ESP_LOGI for exactly that reason, and
  # current heap is always readable from the free_heap sensor over REST anyway.
  #
  # Note per-component `logs:` entries can only make a component QUIETER than the
  # global level, never louder — raising one above global is a hard config error,
  # not a no-op. The old damping block existed solely to offset a global DEBUG.
  level: INFO

# api: RE-ADDED 2026-08-25 after bring-up proved the no-api decision impractical.
#
# Design §3.4 said "no api:", for two reasons: standalone operation, and freeing the
# RAM the §5 heap gate needs. The first reason is satisfied either way — this API is
# an endpoint, not a dependency, and the device still wakes the console via REST and
# the web page with no Home Assistant present. Requirement 1 was "no dependency on
# Home Assistant", not "no API".
#
# The second reason still stands and is the real cost, so this is reversible: set
# `level: INFO` and delete this block to reclaim RAM once bring-up is finished.
#
# What forced it: without api:, `esphome logs` refuses outright, which is what the
# dashboard's Logs button runs. baud_rate does not help there — serial needs a USB
# link to the machine READING the logs, and that machine is a Kubernetes pod with no
# connection to the device. So the only log paths were the device's own web page or
# WebSerial from a laptop, neither of which is the dashboard.
api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}
    id: ps5_wake_ota

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  domain: ".lan"
  ap:
    ssid: "${fallback_ssid}"
    password: ${fallback_password}

captive_portal:

# Boot-loop insurance. Cannot protect the OTA that installs it, but every OTA
# after that becomes recoverable over the air rather than over USB.
safe_mode:

# The config page. local: true inlines assets so there is no CDN dependency.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: ${web_user}
    password: ${web_password}

text:
  - platform: template
    name: pad_mac
    id: pad_mac
    optimistic: true
    restore_value: true
    max_length: 17
    mode: text
  - platform: template
    name: ps5_mac
    id: ps5_mac
    optimistic: true
    restore_value: true
    max_length: 17
    mode: text

text_sensor:
  - platform: template
    name: last_result
    id: last_result

sensor:
  - platform: template
    name: free_heap
    id: free_heap
    lambda: 'return esp_get_free_heap_size();'
    unit_of_measurement: B
    accuracy_decimals: 0
    update_interval: 60s

ps5_wake:
  id: waker
  pad_mac: pad_mac
  ps5_mac: ps5_mac
  last_result: last_result
  bt_mode: always_on
  retries: 5
  # PROVISIONAL. Calibrate from what free_heap actually reports on the assembled
  # board with web_server running, then change this. The component degrades to
  # on-demand rather than OOM-looping if the gate is not met.
  min_heap_for_always_on: 120000


# Reads console state over the discovery protocol: 200 -> on, 620 -> rest,
# no answer -> silent. Requires the iot->clients UDP 9302 pinhole in
# infra/data/networks.yaml; without it every observation is "silent".
ps5_status:
  id: ps5s
  host: ${ps5_ip}
  update_interval: 60s
  timeout: 2s
  state:
    name: PS5 state raw
    entity_category: diagnostic

button:
  - platform: template
    name: wake        # -> POST /button/wake/press
    on_press:
      - ps5_wake.wake: waker
  # Capture the console's Bluetooth address. Press this, then on the PS5 open
  # Settings > Accessories > Bluetooth Accessories and select "PS5-Wake". The
  # pairing is EXPECTED TO FAIL - that does not matter, because the console reveals
  # its address when the link opens, before any pairing outcome. The captured
  # address is written straight into ps5_mac.
  #
  # Needed because the PS5 never shows its Bluetooth address in its own UI (System
  # Information lists only the LAN and Wi-Fi MACs), and on that screen the console
  # is scanning rather than advertising, so we cannot find it by inquiry either.
  - platform: template
    name: capture_ps5_mac   # -> POST /button/capture_ps5_mac/press
    on_press:
      - ps5_wake.capture: waker
