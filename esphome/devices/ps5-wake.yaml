# PS5 wake over Bluetooth. Impersonates a paired DualSense to wake the console,
# which the network WAKEUP datagram cannot do once the console is fully off — that
# path requires Rest Mode, and a UPS output cut leaves the PS5 fully off.
#
# Hardware: ORIGINAL ESP32 only (variant: esp32). Bluetooth Classic (BR/EDR) does
# not exist on S2/S3/C3/C6/H2, and this technique needs BR/EDR L2CAP.
#
# Power this from a NON-UPS outlet, so a UPS cycle cannot take out the device whose
# whole purpose is recovering from a UPS cycle.
#
# The two MAC addresses are runtime values, set from the web page at
# http://<device>/ and persisted in flash — deliberately NOT compile-time, so the
# console or the pad can be replaced without a rebuild.

substitutions:
  # The console's LAN address. Its Wi-Fi NIC (10.1.20.30) is down — the PS5 is
  # wired. NOTE this is unrelated to the Bluetooth address used for the wake,
  # which is the Wi-Fi MAC + 1.
  ps5_ip: "10.1.20.31"

  # Known-good addresses, committed so a wiped device boots working. NVS still
  # wins at runtime; these are only the fallback. Without them a template text
  # restores to "" — which is exactly why ps5_mac came up blank after the
  # esptool flash.
  pad_mac_default: "A0:AB:51:B1:23:7B"
  ps5_mac_default: "80:60:B7:10:03:3F"

  # Keepalive tuning. Every number MUST carry an initial_value: a template
  # number with none restores to min_value, which would mean debounce 2 and
  # cooldown 5m on a wiped device — maximally trigger-happy.
  ka_debounce_default: "3"
  ka_grace_min_default: "15"
  ka_settle_s_default: "180"
  ka_max_attempts_default: "3"
  ka_cooldown_min_default: "60"

esphome:
  name: ps5-wake
  friendly_name: ps5-wake

esp32:
  variant: esp32
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/adumat/homelab
      ref: main
    components: [ps5_wake, ps5_status]
    refresh: 0s

logger:
  # Serial kept as a fallback path: if wifi or the API ever break, this is the only
  # way to see anything. Costs little compared to api:, which is deliberately kept.
  baud_rate: 115200
  # INFO. Note there is NO 'CONFIG' logger level despite ESP_LOGCONFIG existing as a
  # macro — valid values are NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE,
  # and 'CONFIG' is a hard validation error. Consequence: at INFO the ESP_LOGCONFIG
  # boot dump is hidden, so anything worth keeping must be logged at INFO or above.
  # The heap-at-setup figure was promoted to ESP_LOGI for exactly that reason, and
  # current heap is always readable from the free_heap sensor over REST anyway.
  #
  # Note per-component `logs:` entries can only make a component QUIETER than the
  # global level, never louder — raising one above global is a hard config error,
  # not a no-op. The old damping block existed solely to offset a global DEBUG.
  level: INFO

# api: RE-ADDED 2026-08-25 after bring-up proved the no-api decision impractical.
#
# Design §3.4 said "no api:", for two reasons: standalone operation, and freeing the
# RAM the §5 heap gate needs. The first reason is satisfied either way — this API is
# an endpoint, not a dependency, and the device still wakes the console via REST and
# the web page with no Home Assistant present. Requirement 1 was "no dependency on
# Home Assistant", not "no API".
#
# The second reason still stands and is the real cost, so this is reversible: set
# `level: INFO` and delete this block to reclaim RAM once bring-up is finished.
#
# What forced it: without api:, `esphome logs` refuses outright, which is what the
# dashboard's Logs button runs. baud_rate does not help there — serial needs a USB
# link to the machine READING the logs, and that machine is a Kubernetes pod with no
# connection to the device. So the only log paths were the device's own web page or
# WebSerial from a laptop, neither of which is the dashboard.
api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}
    id: ps5_wake_ota

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  domain: ".lan"
  ap:
    ssid: "${fallback_ssid}"
    password: ${fallback_password}

captive_portal:

# Boot-loop insurance. Cannot protect the OTA that installs it, but every OTA
# after that becomes recoverable over the air rather than over USB.
safe_mode:

# The config page. local: true inlines assets so there is no CDN dependency.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: ${web_user}
    password: ${web_password}

text:
  - platform: template
    name: pad_mac
    id: pad_mac
    optimistic: true
    restore_value: true
    initial_value: ${pad_mac_default}
    max_length: 17
    mode: text
  - platform: template
    name: ps5_mac
    id: ps5_mac
    optimistic: true
    restore_value: true
    initial_value: ${ps5_mac_default}
    max_length: 17
    mode: text

text_sensor:
  - platform: template
    name: last_result
    id: last_result
  # The debounced conclusion, as opposed to ps5_status's raw observation.
  - platform: template
    name: PS5 state
    id: ps5_state
    lambda: 'return {id(conclusion)};'
    update_interval: 10s

sensor:
  - platform: template
    name: free_heap
    id: free_heap
    lambda: 'return esp_get_free_heap_size();'
    unit_of_measurement: B
    accuracy_decimals: 0
    update_interval: 60s
  # silent_streak is what acceptance test 2 inspects: it must never reach the
  # debounce threshold while the console is resting normally.
  - platform: template
    name: keepalive wake attempts
    lambda: 'return id(wake_attempts);'
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
  - platform: template
    name: keepalive silent streak
    lambda: 'return id(silent_streak);'
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic

# Keepalive runtime state. All restore_value: false on purpose — these are
# millis()-relative, and millis() restarts at 0 on reboot, so a restored
# cooldown deadline would be meaningless.
globals:
  - id: silent_streak
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_solid          # 0 none, 1 on, 2 rest
    type: int
    restore_value: false
    initial_value: '0'
  - id: witnessed_off_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: wake_attempts
    type: int
    restore_value: false
    initial_value: '0'
  - id: cooldown_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: settle_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: conclusion
    type: std::string
    restore_value: false
    initial_value: '"unknown"'

# Defaults OFF, and RESTORE_DEFAULT_OFF means a wiped device also comes up OFF.
# Template switches have no initial_value; this is the equivalent. OFF is the
# right post-wipe default because the failure mode is "does nothing" rather than
# "surprise console boot".
switch:
  - platform: template
    name: keepalive
    id: keepalive
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: keepalive debounce polls
    id: ka_debounce
    optimistic: true
    restore_value: true
    initial_value: ${ka_debounce_default}
    min_value: 2
    max_value: 10
    step: 1
    entity_category: config
  - platform: template
    name: keepalive grace minutes
    id: ka_grace_min
    optimistic: true
    restore_value: true
    initial_value: ${ka_grace_min_default}
    min_value: 0
    max_value: 120
    step: 1
    entity_category: config
  - platform: template
    name: keepalive settle seconds
    id: ka_settle_s
    optimistic: true
    restore_value: true
    initial_value: ${ka_settle_s_default}
    min_value: 60
    max_value: 600
    step: 10
    entity_category: config
  - platform: template
    name: keepalive max attempts
    id: ka_max_attempts
    optimistic: true
    restore_value: true
    initial_value: ${ka_max_attempts_default}
    min_value: 1
    max_value: 10
    step: 1
    entity_category: config
  - platform: template
    name: keepalive cooldown minutes
    id: ka_cooldown_min
    optimistic: true
    restore_value: true
    initial_value: ${ka_cooldown_min_default}
    min_value: 5
    max_value: 720
    step: 5
    entity_category: config

ps5_wake:
  id: waker
  pad_mac: pad_mac
  ps5_mac: ps5_mac
  last_result: last_result
  bt_mode: always_on
  retries: 5
  # Calibrated 2026-08-27 against the assembled board with web_server AND
  # ps5_status resident: boot heap is ~112 kB, so the old provisional 120000
  # tripped on every boot and its "always_on declined" message overwrote
  # last_result, which is the wake-outcome field. The gate is advisory only —
  # setup() does nothing but log, and bt_up_ runs from the wake/capture tasks
  # regardless — so this changes no behaviour, it just stops a false warning.
  min_heap_for_always_on: 105000


# Reads console state over the discovery protocol: 200 -> on, 620 -> rest,
# no answer -> silent. Requires the iot->clients UDP 9302 pinhole in
# infra/data/networks.yaml; without it every observation is "silent".
ps5_status:
  id: ps5s
  host: ${ps5_ip}
  update_interval: 60s
  timeout: 2s
  state:
    name: PS5 state raw
    entity_category: diagnostic
  on_state:
    - lambda: |-
        const uint32_t now = millis();

        // Strictly neutral. A resting console emits malformed datagrams — one
        // was observed at an ON->REST transition — and treating that as a state
        // change would mean spurious wakes.
        if (x == "unknown") return;

        if (x == "on" || x == "rest") {
          id(silent_streak) = 0;
          id(last_solid) = (x == "on") ? 1 : 2;
          id(witnessed_off_ms) = 0;
          id(wake_attempts) = 0;
          id(conclusion) = (x == "on") ? "on" : "rest";
          return;
        }

        // x == "silent" from here down.

        // Our own link being down must not read as "the console is off".
        if (!wifi::global_wifi_component->is_connected() || now < 120000) return;

        id(silent_streak)++;
        const int debounce = (int) id(ka_debounce).state;
        if (id(silent_streak) < debounce) return;

        if (id(silent_streak) == debounce) {
          // Witnessed means we saw on/rest immediately before the silence, so
          // the shutdown was probably deliberate and gets a stay of execution.
          // Unwitnessed (we just booted) is recovered promptly — which is the
          // power-cut case, since a blackout reboots us too.
          id(witnessed_off_ms) = (id(last_solid) != 0) ? now : 0;
          id(conclusion) = "off";
        }

        if (!id(keepalive).state) return;

        // Subtraction everywhere: millis() wraps at 49.7 days. A deadline of 0
        // means "no deadline" and is correctly treated as already past.
        if ((int32_t) (now - id(settle_until_ms)) < 0) return;
        if ((int32_t) (now - id(cooldown_until_ms)) < 0) return;
        if (id(witnessed_off_ms) != 0 &&
            (int32_t) (now - (id(witnessed_off_ms) +
                              (uint32_t) (id(ka_grace_min).state * 60000.0f))) < 0)
          return;

        if (id(wake_attempts) >= (int) id(ka_max_attempts).state) {
          id(cooldown_until_ms) = now + (uint32_t) (id(ka_cooldown_min).state * 60000.0f);
          id(wake_attempts) = 0;
          id(conclusion) = "failed";
          ESP_LOGW("keepalive", "giving up after %d attempts, cooling down %.0f min",
                   (int) id(ka_max_attempts).state, id(ka_cooldown_min).state);
          return;
        }

        id(wake_attempts)++;
        id(settle_until_ms) = now + (uint32_t) (id(ka_settle_s).state * 1000.0f);
        id(conclusion) = "waking";
        ESP_LOGI("keepalive", "console appears off, paging (attempt %d)",
                 id(wake_attempts));
        id(waker).wake();

button:
  - platform: template
    name: wake        # -> POST /button/wake/press
    on_press:
      - ps5_wake.wake: waker
  # Capture the console's Bluetooth address. Press this, then on the PS5 open
  # Settings > Accessories > Bluetooth Accessories and select "PS5-Wake". The
  # pairing is EXPECTED TO FAIL - that does not matter, because the console reveals
  # its address when the link opens, before any pairing outcome. The captured
  # address is written straight into ps5_mac.
  #
  # Needed because the PS5 never shows its Bluetooth address in its own UI (System
  # Information lists only the LAN and Wi-Fi MACs), and on that screen the console
  # is scanning rather than advertising, so we cannot find it by inquiry either.
  - platform: template
    name: capture_ps5_mac   # -> POST /button/capture_ps5_mac/press
    on_press:
      - ps5_wake.capture: waker
