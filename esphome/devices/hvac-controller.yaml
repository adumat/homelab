esphome:
  name: hvac-controller
  friendly_name: hvac-controller

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}
    id: hvac_controller_ota

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  domain: ".lan"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Hvac-Controller Fallback Hotspot"
    password: ${fallback_password}

captive_portal:

# Boot-loop insurance. Without this, a device that boot-loops after an OTA needs
# USB recovery; with it the device counts rapid reboots and comes up with wifi +
# OTA so it can be re-flashed remotely. It cannot protect the OTA that installs it.
safe_mode:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

binary_sensor:
  - platform: status
    name: "Status"

  - platform: gpio
    name: "Boot Button"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    disabled_by_default: true
    on_press:
      then:
        - button.press: restart_button


switch:
  - platform: gpio
    pin:
      number: GPIO46 # PCB relay 6
      ignore_strapping_warning: true
    id: commandHeatCool
    name: Command HeatCool
  - platform: gpio
    pin:
      number: GPIO45 # PCB relay 5
      ignore_strapping_warning: true
    id: fancoilGF
    name: Fancoil GF
  - platform: gpio
    pin: GPIO42 # PCB relay 4
    id: fancoil1F
    name: Fancoil 1F
  - platform: gpio
    pin: GPIO41 # PCB relay 3
    id: pumpRadiator # quadro relay 1
    name: Pump Radiator
  - platform: gpio
    pin: GPIO2 # PCB relay 2
    id: pumpGF # quadro relay 2
    name: Pump GF
  - platform: gpio
    pin: GPIO1 # PCB relay 1
    id: pump1F # quadro relay 3
    name: Pump 1F

select:
  - platform: template
    id: hvac_mode
    name: Pdc modalita stagione
    optimistic: true
    options:
      - heat
      - cool
    initial_option: heat

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1
  parity: EVEN
  data_bits: 8

modbus:
  - uart_id: modbus_uart
    id: modbus_client

modbus_controller:
  - id: modbus_hvac
    modbus_id: modbus_client
    address: 0x1
    update_interval: 15s

# buzzer
output:
  - platform: ledc
    pin: GPIO21
    id: buzzer

rtttl:
  output: buzzer
  id: rtttl_buzzer
  gain: 30%

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    pin: GPIO38
    num_leds: 1
    rgb_order: RGB
    name: "RGB LED"
    id: rgb_led

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  # Switch per avviare la lettura manualmente
  # - platform: template
  #   name: "Trigger lettura registro"
  #   id: trigger_read_registry
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: |-
  #         uint16_t reg = (uint16_t) id(modbus_register_number).state;
  #         auto *controller = id(modbus_hvac);
  #         auto modbus_value_target = id(modbus_value);
  #         auto handler =
  #           [modbus_value_target](
  #             esphome::modbus::ModbusRegisterType register_type,
  #             uint16_t start_address,
  #             const std::vector<uint8_t> &data) {
  #             if (data.size() >= 2) {
  #               uint16_t value = ((uint16_t)data[0] << 8) | data[1];
  #               modbus_value_target->publish_state(value);
  #             }
  #           };
  #         auto read_registry_command =
  #           esphome::modbus_controller::ModbusCommandItem::create_read_command(
