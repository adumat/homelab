esphome:
  name: hvac-controller
  friendly_name: hvac-controller

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}
    id: hvac_controller_ota

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  domain: ".lan"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Hvac-Controller Fallback Hotspot"
    password: ${fallback_password}

captive_portal:

# Boot-loop insurance. Without this, a device that boot-loops after an OTA needs
# USB recovery; with it the device counts rapid reboots and comes up with wifi +
# OTA so it can be re-flashed remotely. It cannot protect the OTA that installs it.
safe_mode:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

binary_sensor:
  - platform: status
    name: "Status"

  - platform: gpio
    name: "Boot Button"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    disabled_by_default: true
    on_press:
      then:
        - button.press: restart_button

  - platform: template
    name: "Compressore in funzione"
    device_class: running
    lambda: |-
      if (!id(compressor_frequency).has_state()) return {};
      return id(compressor_frequency).state > 0;

  - platform: template
    name: "Allarme attivo"
    device_class: problem
    lambda: |-
      if (!id(alarm_codes).has_state()) return {};
      return id(alarm_codes).state != "Nessuno";

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Sbrinamento richiesto"
    register_type: holding
    address: 7214
    bitmask: 0x2000
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Sbrinamento in corso"
    register_type: holding
    address: 7214
    bitmask: 0x4000
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Antilegionella in corso"
    register_type: holding
    address: 7216
    bitmask: 0x0020
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Antilegionella fallita"
    device_class: problem
    register_type: holding
    address: 7216
    bitmask: 0x0040
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Secondo setpoint attivo"
    register_type: holding
    address: 7217
    bitmask: 0x0001
  # Undocumented bits, identified by watching a DHW cycle and the return to plant heating.
  # 481 bit 12 rises r12 (1 min) after heating starts and drops in DHW, so it is the likely
  # boiler call (DO3, H81=29), not yet confirmed against the boiler itself.
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Valvola sanitario"
    entity_category: diagnostic
    register_type: holding
    address: 480
    bitmask: 0x0020
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Sanitario in corso"
    entity_category: diagnostic
    register_type: holding
    address: 7216
    bitmask: 0x0080
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Riscaldamento impianto"
    entity_category: diagnostic
    register_type: holding
    address: 483
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Chiamata caldaia (da confermare)"
    entity_category: diagnostic
    register_type: holding
    address: 481
    bitmask: 0x1000


switch:
  - platform: gpio
    pin:
      number: GPIO46 # PCB relay 6
      ignore_strapping_warning: true
    id: commandHeatCool
    name: Command HeatCool
  - platform: gpio
    pin:
      number: GPIO45 # PCB relay 5
      ignore_strapping_warning: true
    id: fancoilGF
    name: Fancoil GF
  - platform: gpio
    pin: GPIO42 # PCB relay 4
    id: fancoil1F
    name: Fancoil 1F
  - platform: gpio
    pin: GPIO41 # PCB relay 3
    id: pumpRadiator # quadro relay 1
    name: Pump Radiator
  - platform: gpio
    pin: GPIO2 # PCB relay 2
    id: pumpGF # quadro relay 2
    name: Pump GF
  - platform: gpio
    pin: GPIO1 # PCB relay 1
    id: pump1F # quadro relay 3
    name: Pump 1F

select:
  - platform: template
    id: hvac_mode
    name: Pdc modalita stagione
    optimistic: true
    options:
      - heat
      - cool
    initial_option: heat

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1
  parity: EVEN
  data_bits: 8

modbus:
  - uart_id: modbus_uart
    id: modbus_bus

modbus_controller:
  - id: modbus_hvac
    modbus_id: modbus_bus
    address: 0x1
    update_interval: 15s
  # Parameters and setpoints rarely change: polling them with the sensors would only load the bus.
  - id: modbus_hvac_params
    modbus_id: modbus_bus
    address: 0x1
    update_interval: 15h

# buzzer
output:
  - platform: ledc
    pin: GPIO21
    id: buzzer

rtttl:
  output: buzzer
  id: rtttl_buzzer
  gain: 30%

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    pin: GPIO38
    num_leds: 1
    channel_colors: RGB
    name: "RGB LED"
    id: rgb_led

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  - platform: template
    name: "Modbus scan start"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          if (id(scan_active)) return;
          uint16_t from = (uint16_t) id(scan_from).state;
          uint16_t to = (uint16_t) id(scan_to).state;
          if (to < from) {
            ESP_LOGW("scan", "range %u-%u is empty", from, to);
            return;
          }
          id(scan_addr) = from;
          id(scan_end) = (uint32_t) to + 1;
          id(scan_count) = 0;
          id(scan_single) = false;
          id(scan_result) = 0;
          id(scan_found) = 0;
          id(scan_inflight) = false;
          id(scan_active) = true;
          ESP_LOGI("scan", "started %u-%u", from, to);

  - platform: template
    name: "Modbus scan stop"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(scan_active) = false;
          ESP_LOGI("scan", "stopped at %u", (unsigned) id(scan_addr));

  # Switch per avviare la lettura manualmente
  # - platform: template
  #   name: "Trigger lettura registro"
  #   id: trigger_read_registry
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: |-
  #         uint16_t reg = (uint16_t) id(modbus_register_number).state;
  #         auto *controller = id(modbus_hvac);
  #         auto modbus_value_target = id(modbus_value);
  #         auto handler =
  #           [modbus_value_target](
  #             esphome::modbus::ModbusRegisterType register_type,
  #             uint16_t start_address,
  #             const std::vector<uint8_t> &data) {
  #             if (data.size() >= 2) {
  #               uint16_t value = ((uint16_t)data[0] << 8) | data[1];
  #               modbus_value_target->publish_state(value);
  #             }
  #           };
  #         auto read_registry_command =
  #           esphome::modbus_controller::ModbusCommandItem::create_read_command(
  #             controller,
  #             esphome::modbus::ModbusRegisterType::HOLDING,
  #             reg,
  #             1,
  #             handler
  #           );
  #         controller->queue_command(read_registry_command);

sensor:
  # Sensore per mostrare il risultato della lettura
  # - platform: template
  #   name: "Valore registro Modbus"
  #   id: modbus_value
  #   unit_of_measurement: ""
  #   update_interval: never

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t01_temp_in
    name: "T01 Temperatura acqua in ingresso"
    register_type: holding
    address: 100
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t02_temp_out
    name: "T02 Temperatura acqua in uscita"
    register_type: holding
    address: 101
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t03_temp_suction
    name: "T03 Temperatura aspirazione compressore"
    register_type: holding
    address: 102
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t04_temp_discharge
    name: "T04 Temperatura scarico compressore"
    register_type: holding
    address: 103
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t05_temp_outdoor
    name: "T05 Temperatura aria esterna"
    register_type: holding
    address: 104
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t06_temp_dhw
    name: "T06 Temperatura sonda sanitaria"
    register_type: holding
    address: 105
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t07_temp_remote
    name: "T07 Temperatura sonda remota impianto"
    register_type: holding
    address: 106
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t08_temp_aux
    name: "T08 Temperatura ambiente aux"
    register_type: holding
    address: 107
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Pressioni: tipicamente non negative -> U_WORD + scala 0.1
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t09_press_low
    name: "T09 Pressione di bassa"
    register_type: holding
    address: 108
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t10_press_high
    name: "T10 Pressione di alta"
    register_type: holding
    address: 109
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Portata: non negativa -> U_WORD + scala 0.1 (se l'unità è l/min in decimi)
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t11_flow
    name: "T11 Portata acqua"
    register_type: holding
    address: 110
    value_type: U_WORD
    unit_of_measurement: "l/min"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Registers below come from the official map ("Modbus variables", i-32V5 controller manual).
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: machine_mode_raw
    internal: true
    register_type: holding
    address: 200
    value_type: U_WORD
    on_value:
      then:
        - text_sensor.template.publish:
            id: machine_mode
            state: !lambda |-
              switch ((int) x) {
                case 0: return std::string("Stand-by");
                case 1: return std::string("Raffrescamento");
                case 2: return std::string("Riscaldamento");
                case 4: return std::string("Solo sanitario");
                case 5: return std::string("Raffrescamento + sanitario");
                case 6: return std::string("Riscaldamento + sanitario");
                default: return "Sconosciuto (" + to_string((int) x) + ")";
              }

  # Saturation temperatures derived from the pressure transducers
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Temperatura evaporazione"
    register_type: holding
    address: 253
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Temperatura condensazione"
    register_type: holding
    address: 254
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Counters are spaced two registers apart (305, 307, 309) and 306 reads 0: a 32-bit value, low word first.
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Ore funzionamento compressore"
    register_type: holding
    address: 305
    value_type: U_DWORD_R
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Pressione di alta"
    register_type: holding
    address: 406
    value_type: S_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Pressione di bassa"
    register_type: holding
    address: 414
    value_type: S_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Ventilatore condensazione"
    register_type: holding
    address: 7000
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Circolatore"
    register_type: holding
    address: 7001
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Undocumented registers, identified by diffing scans with the compressor stopped and running.
  # 480 tracks the relay outputs (bit 6 = circulator, bits 2 and 8 follow the compressor); kept raw
  # until the remaining bits, such as the boiler call, are identified.
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: compressor_frequency
    name: "Frequenza compressore"
    register_type: holding
    address: 617
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Uscite digitali raw"
    entity_category: diagnostic
    register_type: holding
    address: 480
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    name: "Codice stato macchina"
    entity_category: diagnostic
    register_type: holding
    address: 490
    value_type: U_WORD
    accuracy_decimals: 0

  # Alarm bitmasks 950-956, decoded into codes by the "Allarmi" text sensor
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_950
    internal: true
    register_type: holding
    address: 950
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_951
    internal: true
    register_type: holding
    address: 951
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_952
    internal: true
    register_type: holding
    address: 952
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_953
    internal: true
    register_type: holding
    address: 953
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_954
    internal: true
    register_type: holding
    address: 954
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_955
    internal: true
    register_type: holding
    address: 955
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: alarm_956
    internal: true
    register_type: holding
    address: 956
    value_type: U_WORD

text_sensor:
  - platform: template
    id: machine_mode
    name: "Modalita macchina"
    icon: mdi:heat-pump

  - platform: template
    id: alarm_codes
    name: "Allarmi"
    icon: mdi:alert
    update_interval: 15s
    lambda: |-
      // Codes per bit, as listed in the manual; empty entries are undocumented bits. 956 bit 12 (E060,
      // anti-legionella completed) is an outcome rather than a fault, so it is left out.
      static const char *const codes[7][16] = {
        {"E001","E002","E003","E004","E005","E006","E007","E008","E009","E010","","","E013","E014","","E016"},
        {"","E018","E019","E020","","","E023","E024","","E026","","E041","E042","E050","E101","E102"},
        {"E611","E621","E631","E641","E651","E661","E671","E681","E691","E701","E711","E612","E622","E632","E642","E652"},
        {"E662","E672","E682","E692","E702","E712","E613","E623","E633","E643","E653","E663","E673","E683","E693","E703"},
        {"E713","E801","E802","E803","E851","E852","E853","E861","E862","E863","E871","E872","E873","E881","E882","E883"},
        {"E891","E892","E893","E901","E902","E903","E911","E912","E913","E921","E922","E923","E931","E932","E933","E941"},
        {"E942","E943","E951","E952","E953","E961","E962","E963","E971","E972","E973","E029","","E061","",""},
      };
      const sensor::Sensor *regs[7] = {id(alarm_950), id(alarm_951), id(alarm_952), id(alarm_953),
                                       id(alarm_954), id(alarm_955), id(alarm_956)};
      std::string out;
      for (int r = 0; r < 7; r++) {
        if (!regs[r]->has_state()) return {};
        uint16_t mask = (uint16_t) regs[r]->state;
        for (int b = 0; b < 16; b++) {
          if (!(mask & (1u << b))) continue;
          if (!out.empty()) out += ", ";
          if (codes[r][b][0]) out += codes[r][b];
          else out += "bit " + to_string(950 + r) + "." + to_string(b);
        }
      }
      return out.empty() ? std::string("Nessuno") : out;

# Input per scegliere il registro da leggere
number:
  - platform: template
    id: scan_from
    name: "Modbus scan from"
    entity_category: config
    disabled_by_default: true
    mode: box
    min_value: 0
    max_value: 65535
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    id: scan_to
    name: "Modbus scan to"
    entity_category: config
    disabled_by_default: true
    mode: box
    min_value: 0
    max_value: 65535
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1100

  # - platform: template
  #   name: "Registro Modbus da leggere"
  #   id: modbus_register_number
  #   mode: BOX
  #   optimistic: true
  #   min_value: 1
  #   max_value: 9999
  #   step: 1
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r08
    name: "r08 fascia solo cal"
    register_type: holding
    address: 1507
    value_type: S_WORD
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r22
    name: "r22 fascia solo pdc"
    register_type: holding
    address: 1521
    value_type: S_WORD
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r28
    name: "r28 METTI = R08"
    register_type: holding
    address: 1527
    value_type: S_WORD
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r10
    name: "r10 caldaia supporto heat"
    register_type: holding
    address: 1509
    value_type: U_WORD
    # min_value: 0
    # max_value: 1
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r12
    name: "r12 ritardo r10"
    register_type: holding
    address: 1511
    value_type: U_WORD
    # min_value: 0
    # max_value: 60
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r15
    name: "r15 caldaia supporto sanitary"
    register_type: holding
    address: 1514
    value_type: U_WORD
    # min_value: 0
    # max_value: 1
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r16
    name: "r16 ritardo r15"
    register_type: holding
    address: 1515
    value_type: U_WORD
    # min_value: 0
    # max_value: 60
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
    id: r23
    name: "r23 caldaia a supporto heat(4) sanitary(6)"
    register_type: holding
    address: 1522
    value_type: U_WORD
    # min_value: 0
    # max_value: 6
    step: 1
    mode: BOX
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac_params
