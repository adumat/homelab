  #         controller->queue_command(read_registry_command);

sensor:
  # Sensore per mostrare il risultato della lettura
  # - platform: template
  #   name: "Valore registro Modbus"
  #   id: modbus_value
  #   unit_of_measurement: ""
  #   update_interval: never

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t01_temp_in
    name: "T01 Temperatura acqua in ingresso"
    register_type: holding
    address: 100
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t02_temp_out
    name: "T02 Temperatura acqua in uscita"
    register_type: holding
    address: 101
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t03_temp_suction
    name: "T03 Temperatura aspirazione compressore"
    register_type: holding
    address: 102
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t04_temp_discharge
    name: "T04 Temperatura scarico compressore"
    register_type: holding
    address: 103
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t05_temp_outdoor
    name: "T05 Temperatura aria esterna"
    register_type: holding
    address: 104
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t06_temp_dhw
    name: "T06 Temperatura sonda sanitaria"
    register_type: holding
    address: 105
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t07_temp_remote
    name: "T07 Temperatura sonda remota impianto"
    register_type: holding
    address: 106
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t08_temp_aux
    name: "T08 Temperatura ambiente/aux"
    register_type: holding
    address: 107
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Pressioni: tipicamente non negative -> U_WORD + scala 0.1
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t09_press_low
    name: "T09 Pressione di bassa"
    register_type: holding
    address: 108
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t10_press_high
    name: "T10 Pressione di alta"
    register_type: holding
    address: 109
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Portata: non negativa -> U_WORD + scala 0.1 (se l'unità è l/min in decimi)
  - platform: modbus_controller
    modbus_controller_id: modbus_hvac
    id: t11_flow
    name: "T11 Portata acqua"
    register_type: holding
    address: 110
    value_type: U_WORD
    unit_of_measurement: "l/min"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

# Input per scegliere il registro da leggere
number:
  # - platform: template
  #   name: "Registro Modbus da leggere"
  #   id: modbus_register_number
  #   mode: BOX
