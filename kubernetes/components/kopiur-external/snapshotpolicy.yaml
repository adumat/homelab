---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    # components/persistence set fsGroup alongside the two IDs. Dropping it went
    # unnoticed only because every app migrated so far runs as 1000; unifi-mongo
    # runs as 999 and its mover cannot read the volume without it.
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      # Always rather than OnRootMismatch, matching what components/persistence
      # did implicitly. Be aware it does NOT rescue a mover from unreadable
      # files: the staged clone is mounted read-only, so Kubernetes cannot chmod
      # it whatever this is set to. An app that writes root-owned 0600 files
      # needs KOPIUR_PUID/PGID "0" instead - see romm.
      fsGroupChangePolicy: Always
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  # Staging is the CSI clone kopiur snapshots from. Left unset it inherits the
  # SOURCE PVC's class, which is harmless on miroir-replicated but becomes a real cost
  # in phase 3: a miroir-replicated source would make every backup create a
  # DRBD-replicated staging volume too. Flip the default to miroir-local there.
  staging:
    storageClassName: "${KOPIUR_STAGING_STORAGECLASS:=miroir-replicated}"
  repository:
    kind: ClusterRepository
    name: nas
  # Mirrors the VolSync retention this replaces. Overridable because a source
  # that is already a rolling window - Prometheus, victoria-logs - gains nothing
  # from 24 hourly copies of itself.
  retention:
    # Snapshots run DAILY (`0 0 * * *`, staggered), so `keepHourly` does not mean 24
    # hours: kopia keeps the newest snapshot per bucket that HAS one, and with one a
    # day each day is its own hourly bucket. In practice this is ~24 dailies.
    keepHourly: ${KOPIUR_KEEP_HOURLY:=24}
    keepDaily: ${KOPIUR_KEEP_DAILY:=7}
    keepWeekly: ${KOPIUR_KEEP_WEEKLY:=5}
    # Added 2026-08-24. Without it the policy guarantees only ~5 weeks; the older
    # snapshots that exist today survive on kopia's own GFS tags, not on anything this
    # policy asks for. Six monthly anchors make a few months of history intentional
    # rather than incidental.
    #
    # Retention only ever keeps MORE, so this cannot delete anything. Cost is at most
    # +6 snapshots per source, and kopia dedupes at content level — these are
    # slow-changing config PVCs, so the marginal data is small.
    keepMonthly: ${KOPIUR_KEEP_MONTHLY:=6}
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:=${APP}}
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:=miroir-snap}"
