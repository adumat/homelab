---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  advanced:
    restoreToOriginalReplicaCount: true
  pollingInterval: 30
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${APP}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc.cluster.local:9090
        # Two independent conditions, ANDed by multiplication:
        #  1. elizabeth is reachable at all, and
        #  2. THIS app's own kernel mounts are not stale.
        #
        # Both come from nfs-stale-exporter, which probes from every node. It
        # replaced nfs-canary (a single replica that segfaulted 41 times in 22h)
        # on 2026-08-22.
        #
        # ⚠️ The two terms default in OPPOSITE directions, deliberately.
        # Reachability fails OPEN (`or vector(1)`): an absent series means
        # "unknown", and treating unknown as "server down" parks the apps,
        # unmounts their volumes, removes the series cluster-wide and nothing can
        # ever scale them back. Staleness fails CLOSED (`or vector(0)` = not
        # stale) because absence there means the pod is already gone, which is
        # exactly what recovery just did.
        #
        # max() not min() on reachability: one node failing to reach elizabeth is
        # a node fault, not a server outage, and must not park every app.
        # Unscoped because this cluster has a single NFS server.
        #
        # min_over_time is the grace period - stale for the whole 5m window
        # before anything acts, so NfsMountStale reaches a human first.
        query: >-
          (max(nfs_server_reachable) or vector(1))
          * on() (1 - (max(min_over_time(nfs:mount_stale:app{app="${APP}"}[5m])) or vector(0)))
        threshold: "1"
        ignoreNullValues: "0"
