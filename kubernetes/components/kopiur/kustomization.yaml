---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Backup via kopiur, the replacement being evaluated for components/persistence.
#
# Migrating an app from persistence to here means:
#   1. swap the component path in its ks.yaml
#   2. rename VOLSYNC_CAPACITY -> KOPIUR_CAPACITY (and the other VOLSYNC_* it sets)
#   3. delete and recreate the PVC, because dataSourceRef is immutable
#
# CRON_EXPRESSION keeps its name, so the schedule stagger carries over untouched.
resources:
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
  - ./pvc.yaml
  - ./restore.yaml
