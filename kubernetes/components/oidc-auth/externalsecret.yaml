---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ${APP}-oidc-secret
    # Each app has its own <app>-oidc Bitwarden item holding a matched
    # secret/digest pair, so plaintext and digest cannot drift apart. The
    # Bitwarden provider ignores remoteRef.property, so the item arrives as JSON
    # and the plaintext is extracted here.
    template:
      engineVersion: v2
      data:
        client-secret: '{{ (fromJson .raw).secret }}'
  data:
    - secretKey: raw
      remoteRef:
        key: ${APP}-oidc
