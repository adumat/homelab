---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  oidc:
    provider:
      # Authelia has a SINGLE issuer for all clients, unlike Authentik's
      # per-application /application/o/${APP}/ path. Resolved in-cluster via the
      # coredns rewrite of auth.${DOMAIN} to the external gateway.
      issuer: "https://auth.${DOMAIN}"
      backendRefs:
        - group: ""
          kind: Service
          name: authelia
          namespace: security
          port: 80
    clientID: ${APP}
    clientSecret:
      name: ${APP}-oidc-secret
    scopes:
      - openid
      - email
      - profile
      - offline_access
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
