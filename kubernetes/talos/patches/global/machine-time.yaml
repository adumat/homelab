machine:
  time:
    # Bypass glados (OPNsense) ntpd — its default config has
    # `restrict default kod limited` which rate-limits clients and
    # KOD-blacklists the cluster nodes when they all poll on boot.
    # Use Cloudflare time as primary (single high-quality source),
    # fall back to NIST and Google.
    servers:
      - time.cloudflare.com
      - time.nist.gov
      - time.google.com
