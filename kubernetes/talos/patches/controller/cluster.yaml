cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    admissionControl:
      $$patch: delete
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      feature-gates: MutatingAdmissionPolicy=true,ResourceHealthStatus=true
      runtime-config: admissionregistration.k8s.io/v1beta1=true
      # OIDC authentication via Authelia. Single issuer - no per-application path,
      # unlike Authentik's /application/o/headlamp/. Must stay identical to
      # OIDC_ISSUER_URL in headlamp's ExternalSecret or the ID token is rejected.
      #
      # The domain comes from AUTH_DOMAIN in the gitignored talenv.secrets.yaml:
      # this repo is public, and this line was previously the only place the base
      # domain was hardcoded in the tracked Talos tree.
      oidc-issuer-url: https://${AUTH_DOMAIN}
      oidc-client-id: headlamp
      oidc-username-claim: preferred_username
      oidc-groups-claim: groups
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
      # Reap finished pods. A ReplicaSet never deletes its own Failed/Succeeded
      # pods, and while a Pod object exists kubelet must keep its containers,
      # which pin their overlayfs snapshot AND the image they ran from - so
      # image GC cannot reclaim any of it. Three rolling-upgrade incidents have
      # tipped /var over this way; the last left 75 dead pods pinning 35.5 GB
      # against only 5.5 GB of live images.
      #
      # PodGC deletes oldest-first only once the count EXCEEDS this number, so
      # it has to sit below the garbage level to do anything: the default 12500
      # never fires on five nodes. 30 reaps a 75-pod pile down to 30 while
      # leaving CronJob history (3 CronJobs) and recent failures intact.
      terminated-pod-gc-threshold: "30"
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.1.10.0/24
  network:
    cni:
      name: none
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
