---
# Node inventory. Rendered into machine configs by machineconfig.yaml.j2 and
# also read by scripts/check-nodes.sh, check-tso.sh and power-nap-over.
clusterName: kubernetes

endpoint: https://k8s.clusterone.lan:6443
additionalApiServerCertSans: &sans
  - 127.0.0.1 # KubePrism
  - &vip "10.1.10.40" # Cluster LB
  - k8s.clusterone.lan

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# POSTed to factory.talos.dev by `just talos gen-schematic-id`; the returned ID
# names the installer image.
schematic:
  customization:
    extraKernelArgs:
      - -init_on_alloc # Less security, faster puter
      - -init_on_free # Less security, faster puter
      - -selinux # Less security, faster puter
      - apparmor=0 # Less security, faster puter
      - init_on_alloc=0 # Less security, faster puter
      - init_on_free=0 # Less security, faster puter
      - intel_iommu=on # PCI Passthrough
      - iommu=pt # PCI Passthrough
      - mitigations=off # Less security, faster puter
      - panic=10 # Reboot 10s after a panic instead of sitting dead forever
      - security=none # Less security, faster puter
      - talos.auditd.disabled=1 # Less security, faster puter
    systemExtensions:
      officialExtensions:
        - siderolabs/drbd # miroir replicated volumes
        - siderolabs/i915 # Intel iGPU
        - siderolabs/intel-ucode # Intel iGPU
        - siderolabs/iscsi-tools # longhorn iSCSI
        - siderolabs/mei # Intel iGPU
        - siderolabs/nfsrahead # NFS Performance
        - siderolabs/nut-client # UPS Shutdown
        - siderolabs/nvme-cli # longhorn NVMe
        - siderolabs/util-linux-tools # longhorn

nodes:
  - hostname: "bulbasaur"
    ipAddress: "10.1.10.10"
    installDiskSelector:
      model: "Samsung SSD 970 EVO Plus 500GB"
    machineSpec: &x64MachineSpec
      mode: metal
      arch: amd64
      secureboot: false
      useUKI: false
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "1c:69:7a:a5:93:fc"
          driver: e1000e
        dhcp: true
        mtu: 1500
        vip:
          ip: *vip
    volumes:
      # Was a shared `&volumes` anchor pinned at 50GiB, which is why /var could never be
      # sized per machine and filled three times. Now explicit per node.
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 200GiB
  - hostname: "charmander"
    ipAddress: "10.1.10.11"
    installDiskSelector:
      model: "WDC PC SN720 SDAPNTW-256G-1006"
    machineSpec: *x64MachineSpec
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "f8:b4:6a:a5:87:ed"
          driver: e1000e
        dhcp: true
        mtu: 1500
        vip:
          ip: *vip
    volumes:
      # charmander: sized for its own disk
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 100GiB
  - hostname: "magikarp"
    ipAddress: "10.1.10.21"
    installDiskSelector:
      model: "KINGSTON SA400S3"
    machineSpec: *x64MachineSpec
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e8:6a:64:a4:89:ca"
          driver: e1000e
        dhcp: true
        mtu: 1500
    volumes:
      # magikarp: sized for its own disk
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 90GiB
  - hostname: "squirtle"
    ipAddress: "10.1.10.12"  # moved from .22 so all control planes sit in .1x
    installDiskSelector:
      model: "SanDisk SD9TB8W2"
    machineSpec: *x64MachineSpec
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e8:6a:64:f6:ff:af"
          driver: e1000e
        dhcp: true
        mtu: 1500
        vip:
          ip: *vip
    volumes:
      # squirtle: sized for its own disk
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 200GiB
  - hostname: "snorlax"
    ipAddress: "10.1.10.23"
    installDiskSelector:
      model: "SanDisk SD9TB8W2"
    machineSpec: *x64MachineSpec
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e8:6a:64:76:2a:18"
          driver: e1000e
        dhcp: true
        mtu: 1500
    volumes:
      # snorlax: sized for its own disk
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 200GiB
