---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: konflate-secret
    template:
      data:
        # The App's Client ID, not its App ID. Both are on the same GitHub page
        # and only one of them works here.
        KONFLATE_APP_CLIENT_ID: '{{ .KONFLATE_APP_CLIENT_ID }}'
        KONFLATE_APP_PRIVATE_KEY: '{{ .KONFLATE_APP_PRIVATE_KEY }}'
        KONFLATE_WEBHOOK_SECRET: '{{ .KONFLATE_WEBHOOK_SECRET }}'
  # Two secrets: the App credentials are shared with the workflows, the webhook
  # secret is shared with GitHub and belongs to konflate alone.
  dataFrom:
    - extract:
        key: github-bot
    - extract:
        key: konflate
