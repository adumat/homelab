---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: headlamp-oidc
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: headlamp
        OIDC_CLIENT_SECRET: "{{ (fromJson .oidc_raw).secret }}"
        # Single issuer, no per-application path. Must stay identical to
        # oidc-issuer-url in the Talos controller patch, or kube-apiserver
        # rejects the ID token.
        OIDC_ISSUER_URL: "https://auth.${DOMAIN}"
        OIDC_SCOPES: "openid,profile,email,groups,offline_access"
        OIDC_CALLBACK_URL: "https://gitops.${DOMAIN}/oidc-callback"
  data:
    - secretKey: oidc_raw
      remoteRef:
        key: headlamp-oidc
