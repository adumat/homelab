---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: 0.43.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    # Headlamp reads its whole OIDC config from the headlamp-oidc secret as env
    # vars, which are only read at process start. Without this, rotating the
    # client secret or changing the scopes left the running pod on the old values
    # and the fix appeared not to work - that is exactly what happened while
    # debugging the Authelia cutover.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      watchPlugins: true
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          # Required for the chart to render -oidc-scopes at all. Its
          # externalSecret branch is gated on this flag:
          #   {{- if $oidc.externalSecret.hasScopes }}
          #   - "-oidc-scopes=$(OIDC_SCOPES)"
          # Without it OIDC_SCOPES sits in the secret and is never passed, so
          # Headlamp silently uses its default "openid profile email".
          hasScopes: true
        callbackURL: "https://gitops.${DOMAIN}/oidc-callback"
        # Without the groups scope, kube-apiserver authenticates the user as
        # https://<issuer>#matteo with no group memberships, so RBAC matches
        # nothing against oidc-headlamp-cluster-admin:
        #   nodes.metrics.k8s.io is forbidden: User "https://auth.../#matteo"
        #   cannot list resource "nodes" ... at the cluster scope
        # Authentik emitted groups regardless of scope, which hid this.
        # The value itself comes from OIDC_SCOPES in headlamp-oidc; this is only
        # the non-externalSecret path and is kept for clarity.
        scopes: "openid,profile,email,groups,offline_access"
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.5.0
          - name: keda
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
            version: 0.1.1-beta
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.0
          - name: rook-ceph
            source: https://artifacthub.io/packages/headlamp/headlamp-rook/headlamp-rook-plugin
            version: 0.2.6
          - name: envoy-gateway
            source: https://artifacthub.io/packages/headlamp/headlamp-envoy-gateway/envoy-gateway
            version: 0.3.0
          - name: external-secrets
            source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
            version: 0.1.0-beta7
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - gitops.${DOMAIN}
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Services
        gethomepage.dev/name: Headlamp
        gethomepage.dev/icon: headlamp.png
        gethomepage.dev/description: Kubernetes Dashboard
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
