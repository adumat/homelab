---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: &name CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-cloudflare-secret
            key: *name
      - name: &name CF_ZONE_ID
        valueFrom:
          secretKeyRef:
            name: *secret
            key: *name
    extraArgs:
      # v0.22.0 switched the default annotation prefix to the GA
      # `external-dns.kubernetes.io/` and removed the alpha fallback. Every
      # annotation in this repo still uses the alpha prefix, and k8s-gateway
      # (a separate project) hard-codes it, so renaming them is not an option.
      # Without this flag the `target` annotation on the envoy-external Gateway
      # is invisible: external-dns falls back to the Gateway's private LB IP
      # and publishes proxied A records, which Cloudflare rejects with 9003.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
      # Skip resources meant for k8s-gateway (private IPs, internal only).
      - --label-filter=external-dns.alpha.kubernetes.io/controller!=k8s-gateway
    triggerLoopOnEvent: true
    policy: sync
    sources:
      # - gateway-tcproute
      - gateway-tlsroute
      - gateway-httproute
      # - service
      - crd
    txtOwnerId: default
    txtPrefix: k8s.
    domainFilters: ["${DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
