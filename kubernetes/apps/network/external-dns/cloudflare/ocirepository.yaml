---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-dns-cloudflare
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # >= 1.22.0 depends on `--annotation-prefix` in the HelmRelease; with
    # `policy: sync`, losing that flag deletes every external DNS record.
    tag: 1.22.0
  url: oci://ghcr.io/home-operations/charts-mirror/external-dns
