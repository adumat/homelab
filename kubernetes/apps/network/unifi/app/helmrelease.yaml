---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi
  namespace: network
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
  values:
    controllers:
      unifi:
        enabled: true
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        labels: {}
        replicas: 1
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 1
          surge: 1
        initContainers:
          perm-fix:
            image:
              repository: busybox
              tag: latest
            command: ['sh', '-c', "chown -R 1000:568 /config && chmod -R 775 /config"]
            securityContext:
              runAsUser: 0
          wait-for-mongo:
            image:
              repository: busybox
              tag: latest
            command: ['sh', '-c', 'until nc -z unifi-mongo.network.svc.cluster.local 27017; do echo "waiting for mongo..."; sleep 2; done']
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/unifi-network-application
              tag: 10.1.85@sha256:05e8e7e5003263adc0e714c32ae5f9543279f324e54ff8750c4550924b25c79c
            env:
              TZ: "Europe/Rome"
              MEM_LIMIT: '2048'
              MEM_STARTUP: '1024'
              PGID: '1000'
              PUID: '1000'
              S6_READ_ONLY_ROOT: '1'
            envFrom:
              - secretRef:
                  name: unifi-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /setup/
                    port: 8080
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFileSystem: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
    service:
      unifi:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.1.44"
        ports:
          http:
            port: 8080
            protocol: HTTP
          stun:
            port: 3478
            protocol: UDP
          https:
            port: 8443
            protocol: HTTPS
          secure-redirect:
            port: 8843
            protocol: HTTPS
          http-redirect:
            port: 8880
            protocol: HTTP
          speedtest:
            port: 6789
            protocol: TCP
          unifi-disc:
            port: 10001
            protocol: UDP
          unifi-disc-12:
            port: 1900
            protocol: UDP
          syslog:
            protocol: UDP
            port: 5514
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      s6run:
        type: emptyDir
        globalMounts:
          - path: /run
