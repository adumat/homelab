---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: unifi-secret
    template:
      data:
        MONGO_AUTHSOURCE: 'admin'
        MONGO_DBNAME: 'unifi'
        MONGO_HOST: 'unifi-mongo.network.svc.cluster.local'
        MONGO_PASS: '{{ .MONGO_PASS | urlquery }}'
        MONGO_PASS_NOT_ENCODED: '{{ .MONGO_PASS }}'
        MONGO_PORT: "27017"
        MONGO_USER: '{{ .MONGO_USER }}'
  dataFrom:
    - extract:
        key: unifi-mongo-credentials-secret
