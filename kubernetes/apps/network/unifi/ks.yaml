---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi-mongo
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/network/unifi/mongo
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "999"
      KOPIUR_PGID: "999"
      CRON_EXPRESSION: '30 1 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
  # unifi must not start before mongo is serving, but `wait: true` CANNOT be used
  # to express that here. It health-checks the entire inventory, and kstatus
  # judges the kopiur Restore by observedGeneration - which its controller never
  # advances once the Restore is terminal. Every migrated app carries the same
  # gen=2 / obsGen=1 lag; `wait: false` merely hides it. A completed Restore is
  # therefore permanently 'InProgress' to kstatus and this gate deadlocked for
  # hours, blocking unifi entirely.
  #
  # healthCheckExprs does NOT fix it: kstatus applies the generation precondition
  # before evaluating the CEL, so the expression is never reached (measured -
  # the verdict was identical with the exprs live). Check the HelmRelease
  # explicitly instead: helm-controller waits for the workload, so HR Ready
  # already means mongo is serving. See AGENTS.md.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: unifi-mongo
      namespace: network
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/network/unifi/app
  dependsOn:
    - name: unifi-mongo
      namespace: network
    - name: external-secrets-store
      namespace: security
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      CRON_EXPRESSION: '25 1 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
