---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi-mongo
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/network/unifi/mongo
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "999"
      KOPIUR_PGID: "999"
      CRON_EXPRESSION: '30 1 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
  # unifi waits for a healthy mongo, so this stays true - but kstatus judges a
  # kopiur Restore by observedGeneration, and a Restore stops reconciling once it
  # reaches a terminal phase. Any later re-apply that bumps generation therefore
  # leaves it permanently 'InProgress' to kstatus and deadlocks this health check
  # (and every app gated behind it). Judge it by its phase instead. See AGENTS.md.
  healthCheckExprs:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      current: status.phase == 'Completed'
      failed: status.phase == 'Failed'
      inProgress: status.phase in ['Pending', 'Resolving', 'Restoring']
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/network/unifi/app
  dependsOn:
    - name: unifi-mongo
      namespace: network
    - name: external-secrets-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      CRON_EXPRESSION: '25 1 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
