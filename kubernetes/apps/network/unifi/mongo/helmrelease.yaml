---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      unifi-mongo:
        type: deployment
        annotations:
          reloader.stakater.com/auto: 'true'
        labels: {}
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/mongo
              tag: '8.3.2'
            envFrom:
              - secretRef:
                  name: unifi-mongo-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ['mongosh', '--eval', "db.runCommand('ping')"]
                  failureThreshold: 30
                  periodSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 27017
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
    defaultPodOptions:
      securityContext:
        # runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data/db
      tmp:
        type: emptyDir
      initdb-scripts:
        # https://github.com/linuxserver/docker-unifi-network-application?tab=readme-ov-file#setting-up-your-external-database
        type: configMap
        name: mongo-init-script
        # defaultMode: 0775
        advancedMounts:
          unifi-mongo:
            app:
              - path: /docker-entrypoint-initdb.d/init-mongo.sh
                subPath: mongo-init-script.sh
                readOnly: true
