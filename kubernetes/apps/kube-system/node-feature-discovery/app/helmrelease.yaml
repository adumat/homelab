---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    master:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 256Mi
    worker:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 128Mi
      config:
        core:
          labelSources:
            - "system"
            - "pci"
            - "usb"
    gc:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 256Mi
    prometheus:
      enable: true
