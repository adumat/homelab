---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  values:
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: 'true'
      # 0.10.x defaults to xpumd-based health monitoring, which requires the
      # XPUM Daemon to be deployed separately. We don't run xpumd, so disable
      # monitoring and use privileged mode for direct device discovery (the
      # 0.9.x behaviour).
      healthMonitoring:
        enabled: false
      privileged: true
