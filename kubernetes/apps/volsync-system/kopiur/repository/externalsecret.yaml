---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: kopiur-nas-secret
    template:
      data:
        KOPIA_PASSWORD: '{{ .KOPIA_PASSWORD }}'
  dataFrom:
    - extract:
        key: kopiur-nas
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: kopiur-garage-secret
    template:
      data:
        KOPIA_PASSWORD: '{{ .KOPIA_PASSWORD }}'
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: kopiur-garage
