---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-repo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: volsync-repo-secret
    template:
      data:
        KOPIA_PASSWORD: '{{ .KOPIA_PASSWORD }}'
  # The same Bitwarden item the 18 VolSync apps already read.
  dataFrom:
    - extract:
        key: volsync-secret
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas-volsync
spec:
  allowedNamespaces:
    all: true
  # VolSync's LIVE repository, holding the only backups for the 18 apps still on
  # it. Read-only on purpose, three ways over:
  #   mode: ReadOnly       - documented as "serves restores only"
  #   maintenance.enabled  - off, so kopiur never rewrites repository structures
  #   create.enabled       - off, so a wrong path/password fails instead of
  #                          silently initialising a second repository
  # Do not relax any of these. Existing backups are not replaceable.
  mode: ReadOnly
  maintenance:
    enabled: false
  create:
    enabled: false
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: elizabeth.lan
          path: /mnt/user/backups/volsync
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: volsync-repo-secret
      namespace: volsync-system
      key: KOPIA_PASSWORD
  # Matches what VolSync recorded: <app>@<namespace>, e.g. prowlarr@downloads.
  # The main repository uses namespace-app instead, which is why this needs its
  # own ClusterRepository rather than a second backend on the same one.
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  moverDefaults:
    cache:
      capacity: 1Gi
      mode: Ephemeral
      storageClassName: openebs-hostpath
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
