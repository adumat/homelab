---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopia
spec:
  components:
    - ../../../../components/nfs-scaler
    - ../../../../components/oidc-auth
  # No dependsOn volsync any more: this is a read-only browser for the retired
  # repository at /mnt/user/backups/volsync, and it never needed the operator -
  # the "volsync" hostname/username in its config JSON is kopia source metadata,
  # not a runtime dependency. It is how the cold fallback stays readable through
  # phase 3.
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: authelia
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/volsync-system/kopia/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: kopia
      OIDC_ROUTE: kopia
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: volsync-system
  wait: false
