---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  namespace: database
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 500s (8.3mins)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 500
          for: 5m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be -1 when it has not failed.
          expr: |-
            delta(cnpg_pg_stat_archiver_last_failed_time[5m]) > 0
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        # This alert existed and could NEVER fire. It compared against
        # cnpg_collector_last_successful_backup_timestamp, and that metric does
        # not exist - the barman-cloud plugin never emits it. A PromQL comparison
        # against an absent vector yields an EMPTY result, not an error and not
        # false, so the rule looked correct, stayed silent, and was never
        # suspected. immich-db's scheduled backup failed on 2026-08-19 23:57 UTC
        # and nothing alerted.
        #
        # Verified before and after by evaluating both expressions against the
        # live series: the old one returns 0 series, the new one returns
        # database/immich-db-1. Never trust an alert whose expression has not
        # been evaluated at least once against real data.
        - alert: DatabaseFailedBackup
          annotations:
            description: >-
              A backup of {{ $labels.pod }} failed at
              {{ $value | humanizeTimestamp }}
            summary: A CNPG backup failed within the last 24h
          expr: |-
            cnpg_collector_last_failed_backup_timestamp > 0
              and (time() - cnpg_collector_last_failed_backup_timestamp) < 86400
          for: 15m
          labels:
            severity: warning
        # --- continuous WAL archiving ---------------------------------------
        # Added 2026-08-21, modelled on kopiur's alerting (see kopiur.rules): the
        # useful shape is "protection has STOPPED", not "an operation failed".
        # These cover the continuous half of CNPG's protection. The base-backup
        # half still has no working alert - see the block below.
        #
        # Re-confirmed 2026-08-21 that the two success metrics stay 0 even AFTER
        # three backups completed against garage, so this is a plugin limitation
        # and not a transient:
        #   cnpg_collector_last_available_backup_timestamp  = 0
        #   cnpg_collector_first_recoverability_point       = 0
        #
        # `job` is the per-cluster label (database/cluster18, database/immich-db);
        # both clusters share namespace `database`, so grouping by namespace would
        # silently merge them.
        - alert: DatabaseWALArchiveBacklog
          annotations:
            description: >-
              {{ $labels.job }} has {{ $value }} WAL segments waiting to be archived.
              Archiving has stalled while the database keeps writing, so the PITR
              window is no longer advancing.
            summary: WAL segments are piling up unarchived.
          expr: |-
            max by (job) (cnpg_collector_pg_wal_archive_status{value="ready"}) > 5
          for: 30m
          labels:
            severity: critical
        - alert: DatabaseWALArchiveFailing
          annotations:
            description: >-
              {{ $labels.job }} recorded {{ $value }} WAL archive failures in the last
              hour.
            summary: WAL archiving is returning errors.
          expr: |-
            increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
          for: 15m
          labels:
            severity: warning
        # Deliberately NOT alerting on the age of cnpg_pg_stat_archiver_last_archived_time,
        # even though it is the most obvious analogue of KopiurBackupStale. Measured over
        # 24h, taking min by (job) so only the primary counts:
        #   database/cluster18   worst  9.5 min
        #   database/immich-db   worst  399.7 min  (6.7 HOURS)
        # immich is low-write, so a 16MB WAL segment can take hours to fill and a
        # long gap is entirely legitimate - nothing was written, so nothing was
        # lost. A threshold loose enough for immich (>7h) is too loose to detect
        # anything useful, and one tight enough to be useful would page on every
        # quiet night. The `ready` backlog above is the better signal because it
        # is independent of write volume: nothing to archive means ready=0 and
        # silence, while broken archiving grows without bound.
        # Also note the metric is stale BY DESIGN on a replica - only the primary
        # archives - and it reads 0 before the first archive ever runs, which
        # makes `time() - metric` return the current epoch (~56 years). Any future
        # rule here needs both a `> 0` guard and min-by-job aggregation.
        #
        # --- base backups: STILL NO WORKING ALERT ---------------------------
        # This remains a real gap. The `!= 0` guard below makes the rule
        # permanently inert - left commented rather than deleted so nobody
        # re-derives it and believes it works. A working check has to read the
        # Backup objects themselves, not metrics; tracked in the roadmap as a
        # kube-state-metrics customResourceState exporter over
        # postgresql.cnpg.io/Backup, which is what finally makes a
        # kopiur-equivalent "no successful backup in 48h" rule possible.
        # - alert: DatabaseNoBackup
        #   annotations:
        #     description: No database backup within the last 48 hours
        #     summary: Checks for recent database backups
        #   expr: |-
        #     (cnpg_collector_last_available_backup_timestamp != 0) and (time() - cnpg_collector_last_available_backup_timestamp > 172800)
