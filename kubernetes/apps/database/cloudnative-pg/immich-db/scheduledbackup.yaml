---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: &cluster immich-db
spec:
  # NOTE: CNPG schedules take SIX fields — the leading one is seconds.
  # 23:45, after cluster18 and ahead of the VolSync wave at 00:00, because
  # a ScheduledBackup does not retry: a backup that loses a race with the
  # other nightly jobs stays failed until the next day.
  schedule: "0 45 23 * * *"
  backupOwnerReference: self
  method: plugin
  cluster:
    name: *cluster
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
