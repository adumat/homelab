---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster18
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: 'enabled'
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-bookworm
  # imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  postgresql:
    parameters:
      timezone: 'Europe/Rome'

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  storage:
    storageClass: miroir-local
    size: 5Gi
  walStorage:
    storageClass: miroir-local
    size: 5Gi

  monitoring:
    enablePodMonitor: true

  # Declarative role for litellm. Every other app on this cluster creates its
  # role with an INIT_POSTGRES initContainer, but LiteLLMProxy has no
  # initContainers field, so the role has to come from here instead.
  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-secret
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-secret
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &barmanParameters
        # MinIO retired 2026-08-25: its ObjectStore is deleted and the container
        # is stopped on elizabeth. The phase 3 rebuild recovered this cluster
        # from garage for real on 2026-08-23, so the fallback was superseded by
        # evidence rather than by schedule.
        #
        # The raw bucket data is deliberately KEPT at /mnt/disk2/atlantic_minio
        # (~101 GB) and queued for deletion in phase 10. Recovering from it now
        # would mean starting MinIO again first - there is no live endpoint.
        #
        # The anchor is shared with externalClusters below, so this single line
        # moves both the backup target and the recovery source.
        barmanObjectName: garage-postgresql
        serverName: postgres18-0
  externalClusters:
    - name: source
      plugin:
        enabled: true
        name: barman-cloud.cloudnative-pg.io
        parameters: *barmanParameters
  bootstrap:
    recovery:
      source: source
