---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pgadmin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      pgadmin:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # libpq IGNORES a passfile that is group- or world-readable, and a
          # Kubernetes Secret volume is always owned by root:fsGroup - so mode
          # 0600 would be unreadable by pgadmin (uid 5050) and 0640 would be
          # rejected by libpq. Neither works mounted directly.
          #
          # This runs AS 5050, so the file it writes into the emptyDir is owned
          # by 5050 and can then be chmod 600. Credentials come from the CNPG
          # secrets that already exist in this namespace rather than a second
          # copy in Bitwarden.
          pgpass:
            image:
              repository: docker.io/dpage/pgadmin4
              tag: 9.15.0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                SU_USER=$(cat /creds/su/username); SU_PASS=$(cat /creds/su/password)
                IM_USER=$(cat /creds/immich/username); IM_PASS=$(cat /creds/immich/password)
                umask 077
                cat > /pgpass/pgpass <<EOF
                cluster18-rw.database.svc.cluster.local:5432:*:${SU_USER}:${SU_PASS}
                immich-db-rw.database.svc.cluster.local:5432:*:${SU_USER}:${SU_PASS}
                immich-db-rw.database.svc.cluster.local:5432:*:${IM_USER}:${IM_PASS}
                EOF
                chmod 600 /pgpass/pgpass
        containers:
          app:
            image:
              repository: docker.io/dpage/pgadmin4
              tag: 9.15.0
            env:
              TZ: Europe/Rome
              PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
              # 'internal' is kept deliberately. The OIDC identity is matteo's
              # LLDAP email, which does not match the internal pgadmin@ account
              # that owns the preconfigured servers from servers.json, so an
              # auto-created OIDC user starts empty. Removing 'internal' would
              # strand those servers behind an account you could no longer reach.
              PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2', 'internal']"
              PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "True"
            envFrom:
              - secretRef:
                  name: pgadmin-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: 80
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: pgadmin
        ports:
          http:
            port: &port 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Database
          gethomepage.dev/name: pgAdmin
          gethomepage.dev/icon: pgadmin.png
          gethomepage.dev/description: PostgreSQL Admin
        hostnames:
          - pgadmin.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        storageClass: miroir-replicated
        accessMode: ReadWriteOnce
        size: 5Gi
        # Closes phase 3's G1: without this a rebuilt cluster creates this volume
        # EMPTY and pgadmin starts on it reporting healthy, which G4 counts as a
        # bug. The Restore is created by components/kopiur-external.
        #
        # dataSourceRef is IMMUTABLE, so this cannot be patched onto a PVC that
        # already exists - Helm would fail the upgrade. The PVC was therefore
        # deleted and recreated once, restoring from the kopiur snapshot rather
        # than starting blank. Anyone adding this to another app-template chart
        # must do the same, with the HelmRelease suspended so Helm cannot recreate
        # the PVC without the field mid-way.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: pgadmin
        globalMounts:
          - path: /var/lib/pgadmin
      servers:
        type: configMap
        name: pgadmin-servers
        globalMounts:
          - path: /pgadmin4/servers.json
            subPath: servers.json
            readOnly: true
      # Written by the pgpass initContainer; servers.json points PassFile here.
      pgpass:
        type: emptyDir
        advancedMounts:
          pgadmin:
            pgpass:
              - path: /pgpass
            app:
              - path: /pgpass
                readOnly: true
      creds-su:
        type: secret
        name: cloudnative-pg-secret
        advancedMounts:
          pgadmin:
            pgpass:
              - path: /creds/su
                readOnly: true
      creds-immich:
        type: secret
        name: cloudnative-immich-user
        advancedMounts:
          pgadmin:
            pgpass:
              - path: /creds/immich
                readOnly: true
