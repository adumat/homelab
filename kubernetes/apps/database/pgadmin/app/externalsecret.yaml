---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: pgadmin-secret
    template:
      data:
        PGADMIN_DEFAULT_EMAIL: '{{ .email }}'
        PGADMIN_DEFAULT_PASSWORD: '{{ .password }}'
        # Native OAuth2 SSO against Authelia. This lives in the ExternalSecret
        # rather than the HelmRelease because it embeds the client secret, and
        # this repo is public.
        #
        # The value is evaluated by pgadmin as a PYTHON literal, so it must stay
        # a single-line list of dicts with single-quoted keys. Note it contains
        # no '{{' sequence, which would otherwise be eaten by this Go template.
        #
        # CHALLENGE_METHOD/RESPONSE_TYPE are set explicitly because the Authelia
        # client has require_pkce: true - without them the authorize call is
        # refused for a missing code_challenge.
        PGADMIN_CONFIG_OAUTH2_CONFIG: >-
          [{'OAUTH2_NAME': 'authelia',
          'OAUTH2_DISPLAY_NAME': 'Authelia',
          'OAUTH2_CLIENT_ID': 'pgadmin',
          'OAUTH2_CLIENT_SECRET': '{{ .secret }}',
          'OAUTH2_SERVER_METADATA_URL': 'https://auth.${DOMAIN}/.well-known/openid-configuration',
          'OAUTH2_API_BASE_URL': 'https://auth.${DOMAIN}/',
          'OAUTH2_AUTHORIZATION_URL': 'https://auth.${DOMAIN}/api/oidc/authorization',
          'OAUTH2_TOKEN_URL': 'https://auth.${DOMAIN}/api/oidc/token',
          'OAUTH2_USERINFO_ENDPOINT': 'https://auth.${DOMAIN}/api/oidc/userinfo',
          'OAUTH2_SCOPE': 'openid email profile',
          'OAUTH2_USERNAME_CLAIM': 'email',
          'OAUTH2_CHALLENGE_METHOD': 'S256',
          'OAUTH2_RESPONSE_TYPE': 'code',
          'OAUTH2_ICON': 'fa-shield-alt',
          'OAUTH2_BUTTON_COLOR': '#3f51b5'}]
  dataFrom:
    - extract:
        key: pgadmin-credentials
    - extract:
        key: pgadmin-oidc
