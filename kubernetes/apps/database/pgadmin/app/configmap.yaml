---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
data:
  # "Shared": true is what makes these visible to the OIDC user. pgAdmin keys
  # users by (username, auth_source), so signing in through Authelia creates a
  # SEPARATE account from the internal pgadmin@ one that owns these servers -
  # matteo.a91@ / oauth2 vs pgadmin@ / internal. A shared server is visible to
  # every authenticated user, so it survives that split and any future user.
  #
  # Only an Administrator may own a shared server (pgadmin/utils/__init__.py
  # refuses otherwise), which the internal pgadmin@ account is.
  #
  # NOTE: pgAdmin imports this only when its DB is fresh. After changing it,
  # re-import explicitly:
  #   kubectl exec -n database <pod> -- /venv/bin/python3 /pgadmin4/setup.py \
  #     load-servers /pgadmin4/servers.json --user <admin> --auth-source internal --replace
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "cluster18",
          "Group": "CloudNative-PG Clusters",
          "Host": "cluster18-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "General purpose PostgreSQL cluster",
          "Shared": true,
          "PassFile": "/pgpass/pgpass"
        },
        "2": {
          "Name": "immich-db (superuser)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "Immich PostgreSQL with VectorChord - Superuser access",
          "Shared": true,
          "PassFile": "/pgpass/pgpass"
        },
        "3": {
          "Name": "immich-db (app user)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "immich",
          "MaintenanceDB": "immich",
          "SSLMode": "prefer",
          "Comment": "Immich database - Application user access",
          "Shared": true,
          "PassFile": "/pgpass/pgpass"
        }
      }
    }
