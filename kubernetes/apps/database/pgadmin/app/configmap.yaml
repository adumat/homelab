---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
data:
  # These are imported PER USER and owned by the importing user. Do NOT mark them
  # "Shared": pgAdmin hands a non-owner a SharedServer copy instead, and that copy
  # is broken twice over here:
  #   1. its username comes from the owner's shared_username
  #      (servers/__init__.py ~460), which servers.json leaves unset - the
  #      symptom is "a username must be given"
  #   2. 'passfile' is in SENSITIVE_CONN_KEYS and is deliberately STRIPPED from
  #      the copy, so even with a username it would prompt for a password
  # Sharing and PassFile are therefore mutually exclusive for a non-owner.
  #
  # Each identity that needs these gets its own import instead. pgAdmin keys users
  # by (username, auth_source), so the Authelia login is a different account from
  # the internal pgadmin@ one:
  #   setup.py load-servers /pgadmin4/servers.json --user <email> \
  #     --auth-source oauth2 --replace
  #   setup.py load-servers /pgadmin4/servers.json --user <admin> \
  #     --auth-source internal --replace
  #
  # pgAdmin only auto-imports this when its DB is fresh, so re-run after editing.
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "cluster18",
          "Group": "CloudNative-PG Clusters",
          "Host": "cluster18-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "General purpose PostgreSQL cluster",
          "PassFile": "pgpass:/pgpass"
        },
        "2": {
          "Name": "immich-db (superuser)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "Immich PostgreSQL with VectorChord - Superuser access",
          "PassFile": "pgpass:/pgpass"
        },
        "3": {
          "Name": "immich-db (app user)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "immich",
          "MaintenanceDB": "immich",
          "SSLMode": "prefer",
          "Comment": "Immich database - Application user access",
          "PassFile": "pgpass:/pgpass"
        }
      }
    }
