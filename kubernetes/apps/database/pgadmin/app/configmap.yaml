---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "cluster18",
          "Group": "CloudNative-PG Clusters",
          "Host": "cluster18-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "General purpose PostgreSQL cluster"
        },
        "2": {
          "Name": "immich-db (superuser)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "postgres",
          "MaintenanceDB": "postgres",
          "SSLMode": "prefer",
          "Comment": "Immich PostgreSQL with VectorChord - Superuser access"
        },
        "3": {
          "Name": "immich-db (app user)",
          "Group": "CloudNative-PG Clusters",
          "Host": "immich-db-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "immich",
          "MaintenanceDB": "immich",
          "SSLMode": "prefer",
          "Comment": "Immich database - Application user access"
        }
      }
    }
