---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # kopiur-external, not kopiur: app-template's persistence creates the PVC and
  # dataSourceRef is immutable, so it cannot be adopted in place.
  components:
    - ../../../../components/kopiur-external
    - ../../../../components/oidc-auth
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: authelia
      namespace: security
    - name: cloudnative-pg-cluster
      namespace: database
    - name: cloudnative-immich-db
      namespace: database
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur-repository
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/database/pgadmin/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      OIDC_ROUTE: *app
      # 5050, verified not assumed: /var/lib/pgadmin is 5050:5050 with 10 files
      # at mode 0600. The default 1000 mover cannot read those, and a ROOT mover
      # would be no better - kopiur drops ALL capabilities, so uid 0 has no
      # CAP_DAC_OVERRIDE and only an owner match works. See AGENTS.md (romm).
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
      CRON_EXPRESSION: '35 1 * * *'
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: *namespace
  timeout: 5m
  # wait: true is NOT usable once kopiur-external is in the inventory: it adds a
  # Restore that stays Pending forever (nothing claims it), and kstatus judges it
  # by observedGeneration, so the health check could never pass and would gate
  # everything behind this ks. Check the HelmRelease explicitly instead.
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
