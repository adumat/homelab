---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
spec:
  # kopiur-external, not kopiur: the PVC is declared in app/pvc.yaml and already
  # exists, and dataSourceRef is immutable so it cannot be adopted in place.
  components:
    - ../../../../components/kopiur-external
  path: ./kubernetes/apps/database/mosquitto/app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: volsync-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: false
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: mosquitto
      # Default 1000 mover is correct and was verified, not assumed: all 284
      # files are 1000:1000 mode 0600, and lost+found is 2770 with group 1000
      # so gid 1000 can traverse it.
      CRON_EXPRESSION: '50 0 * * *'
  targetNamespace: database
