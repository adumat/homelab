---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mosquitto
  annotations:
    # Served by k8s-gateway only; keep external-dns-cloudflare from
    # trying to publish a private IP to Cloudflare.
    external-dns.alpha.kubernetes.io/controller: k8s-gateway
spec:
  endpoints:
    # k8s-gateway only serves A/AAAA from DNSEndpoint (CNAME unsupported).
    # envoy-internal LB IP is pinned via lbipam, so a direct A record is stable.
    - dnsName: "mqtt.${DOMAIN}"
      recordType: A
      targets: ["10.1.11.3"]
