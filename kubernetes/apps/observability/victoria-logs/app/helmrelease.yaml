---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    fullnameOverride: victoria-logs
    # 21d, measured 2026-08-21: 3.75GB total at 38.6 bytes/row compressed. Talos kernel and
    # service logs (added in phase 2.6) contribute ~7.7M rows/day, roughly doubling intake, so
    # 21d projects to ~12GB of the 21.5GB usable volume (~55%). Longer than the default on
    # purpose: the point of shipping these logs is post-incident forensics, and the fault this
    # phase was built for (kube-ceph-03 hanging) recurs on a longer cycle than 14d - a window
    # that cannot reach the previous occurrence cannot be used to compare against it.
    retentionPeriod: 21d
    server:
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Victoria Logs
          gethomepage.dev/icon: victoriametrics.png
          gethomepage.dev/description: Log Aggregation
        hostnames:
          - victoria-logs.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
