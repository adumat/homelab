---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - donkey.lan
        - elizabeth.lan
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - elizabeth.lan:2049
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vpn
spec:
  # Fails when gluetun has no VPN exit IP, i.e. the tunnel is not carrying
  # traffic. Catches an expired Mullvad subscription too: an out-of-credit
  # account has its WireGuard key rejected, and WireGuard is a silent protocol,
  # so the only visible effect is exactly this - no public IP, no error.
  #
  # Found the hard way on 2026-09-02: the tunnel had been dead for hours with
  # nothing alerting. qbittorrent was the only symptom, and only indirectly -
  # it OOMKilled every ~5h accumulating retry state against a network being
  # rebuilt every 6 seconds.
  module: vpn_publicip
  interval: 60s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://qbittorrent.downloads.svc.cluster.local:8000/v1/publicip/ip
