---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
          annotations:
            gethomepage.dev/enabled: 'true'
            gethomepage.dev/group: Observability
            gethomepage.dev/name: Alertmanager
            gethomepage.dev/icon: alertmanager.svg
            gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.${DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: miroir-replicated
              resources:
                requests:
                  storage: 1Gi
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    defaultRules:
      rules:
        kubeProxy: false
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 1m
          memory: 64Mi
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${DOMAIN}
        version: v2.55.1 # override 'unsupported Prometheus version' error
        image:
          registry: docker.io
          repository: prompp/prompp
          tag: 0.8.6
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # 30d, matching victoria-logs so metrics and logs cover the same window - correlating an
        # incident across the two is the whole point, and a shorter metrics window silently caps
        # how far back any comparison can reach.
        # Measured 2026-08-21: TSDB held exactly 14d (data at -14d, none at -15d), so TIME was
        # the binding constraint and retentionSize never engaged. 17.4GB/14d = 1.25GB/day, so
        # 30d lands at ~37GB of the 52.5GB volume (~71%). Compaction packs older blocks more
        # tightly than recent ones, so a linear projection over-estimates - 37GB is the
        # pessimistic figure.
        retention: 30d
        # 40GB, down from the original 50GB, which was 95% of the volume - not a guard rail but
        # the cliff edge, leaving nothing for WAL plus compaction (which needs room for the
        # blocks it is merging).
        # ⚠️ Prometheus parses these suffixes as BASE-2: "40GB" means 40 GiB. Confirmed by
        # /api/v1/status/runtimeinfo, which echoes the value back as "30d or 40GiB". So the real
        # figures are 42.9GB decimal = 82% of the 52.5GB volume, and 34.5 days of capacity at
        # the measured 1.25GB/day - a 15% growth buffer over the 30d target, which keeps TIME
        # the binding constraint rather than size silently trimming below 30d.
        # Do not "fix" this to 43GB reasoning in decimal units: that is 88% of the volume.
        # If series count ever grows enough to make 40GB bind, grow the PVC instead - Ceph has
        # ~2.6TiB free, and pushing the cap past ~85% trades a graceful retention trim for the
        # risk of filling the disk.
        retentionSize: 40GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: miroir-replicated
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # Exposes kube_pod_labels{label_app_kubernetes_io_name=...}, which is the
      # join key nfs-stale-exporter's recording rules use to map a mount's pod UID
      # to an application. Without it the join matches nothing and the rules return
      # empty - indistinguishable from a healthy cluster.
      metricLabelsAllowlist:
        - pods=[app.kubernetes.io/name]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      # Expose CNPG Backup objects as metrics. CNPG's own
      # cnpg_collector_last_available_backup_timestamp is pinned at 0 because the
      # barman-cloud plugin never populates it (re-confirmed 2026-08-21 after three
      # backups completed against garage), so the only trustworthy source for "when
      # did a backup last SUCCEED" is the Backup objects themselves. This is what
      # makes a kopiur-style "no successful backup in 48h" dead-man possible.
      rbac:
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            # `clusters` is required as well as `backups`. Granting only backups makes the
            # Cluster metrics silently absent - KSM logs "forbidden" and carries on serving
            # everything else, so /metrics looks healthy and only the missing series shows it.
            resources: ["backups", "clusters"]
            verbs: ["list", "watch"]
          - apiGroups: ["keda.sh"]
            resources: ["scaledobjects"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              # One series per ScaledObject, so an app that mounts NFS but has no
              # recovery configured can be found with `unless on (namespace, app)`.
              # This is what turns coverage drift from silent into loud: the
              # August 2026 incident hit metube and pyload-ng precisely because
              # they were NFS consumers nobody had opted into the scaler.
              - groupVersionKind:
                  group: keda.sh
                  version: v1alpha1
                  kind: ScaledObject
                metricNamePrefix: keda_scaledobject
                labelsFromPath:
                  namespace: [metadata, namespace]
                  scaledobject: [metadata, name]
                metrics:
                  # Gauge, not Info. `type: Info` registered the family but emitted
                  # zero samples here - /metrics showed only the HELP and TYPE
                  # lines, which any joining rule reads as "no ScaledObjects
                  # exist". metadata.generation is used purely because it is
                  # numeric and present on every object; the VALUE is meaningless,
                  # only the existence of the series matters.
                  - name: info
                    help: A KEDA ScaledObject exists for this workload
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, generation]
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Backup
                metricNamePrefix: cnpg_backup
                # Failed backups never set status.stoppedAt, so path resolution fails for
                # each of them on every scrape and floods the log with
                # "got nil while resolving path". They are correctly excluded from the
                # metric; only the logging is unwanted, so raise the verbosity needed to
                # print it rather than suppressing the metric or faking a zero.
                errorLogV: 10
                labelsFromPath:
                  namespace: [metadata, namespace]
                  backup: [metadata, name]
                  cluster: [spec, cluster, name]
                  phase: [status, phase]
                metrics:
                  - name: stopped_at_seconds
                    help: Unix time at which a CNPG backup finished, from status.stoppedAt
                    each:
                      type: Gauge
                      gauge:
                        # KSM parses the RFC3339 string into a Unix timestamp. Verified
                        # 2026-08-21 against the live endpoint (1.787300771e+09) rather
                        # than assumed - if it did not parse, the series would be silently
                        # absent and any rule on it inert.
                        path: [status, stoppedAt]
              # One series per Cluster, so a cluster with NO completed backup at all can be
              # detected with `unless on (cluster)`. Without this the staleness rule cannot
              # distinguish "backups stopped" from "the Backup objects were deleted", which
              # is the same blind spot that makes a self-clearing failure alert useless.
              # spec.instances is used simply because it always exists and is numeric.
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Cluster
                metricNamePrefix: cnpg_cluster
                labelsFromPath:
                  namespace: [metadata, namespace]
                  cluster: [metadata, name]
                metrics:
                  - name: instances
                    help: Configured instance count, one series per CNPG cluster
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, instances]
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count (count by (image) (time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30)) > 25
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      btrfs-rules:
        groups:
          - name: btrfs
            rules:
              - alert: BtrfsDeviceErrorsDetected
                annotations:
                  sumamry: BTRFS device {{$labels.device}} on {{$labels.kubernetes_node}}@{{$labels.instance}} detected an error of type {{$labels.type}}
                expr: node_btrfs_device_errors_total > 0
                labels:
                  severity: critical
              - alert: BtrfsDeviceAlmostFull
                annotations:
                  summary: BTRFS device {{$labels.device}}@{{$labels.instance}} has less than 1% of free space left
                expr: (node_btrfs_device_unused_bytes{job="node-exporter"} / node_btrfs_device_size_bytes{job="node-exporter"} * 100) < 1
                labels:
                  severity: critical
