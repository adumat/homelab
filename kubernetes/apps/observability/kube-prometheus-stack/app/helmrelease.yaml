---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
          annotations:
            gethomepage.dev/enabled: 'true'
            gethomepage.dev/group: Observability
            gethomepage.dev/name: Alertmanager
            gethomepage.dev/icon: alertmanager.svg
            gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.${DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    defaultRules:
      rules:
        kubeProxy: false
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 1m
          memory: 64Mi
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${DOMAIN}
        version: v2.55.1 # override 'unsupported Prometheus version' error
        image:
          registry: docker.io
          repository: prompp/prompp
          tag: 0.8.6
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # 30d, matching victoria-logs so metrics and logs cover the same window - correlating an
        # incident across the two is the whole point, and a shorter metrics window silently caps
        # how far back any comparison can reach.
        # Measured 2026-08-21: TSDB held exactly 14d (data at -14d, none at -15d), so TIME was
        # the binding constraint and retentionSize never engaged. 17.4GB/14d = 1.25GB/day, so
        # 30d lands at ~37GB of the 52.5GB volume (~71%). Compaction packs older blocks more
        # tightly than recent ones, so a linear projection over-estimates - 37GB is the
        # pessimistic figure.
        retention: 30d
        # 40GB, down from the original 50GB, which was 95% of the volume - not a guard rail but
        # the cliff edge, leaving nothing for WAL plus compaction (which needs room for the
        # blocks it is merging).
        # ⚠️ Prometheus parses these suffixes as BASE-2: "40GB" means 40 GiB. Confirmed by
        # /api/v1/status/runtimeinfo, which echoes the value back as "30d or 40GiB". So the real
        # figures are 42.9GB decimal = 82% of the 52.5GB volume, and 34.5 days of capacity at
        # the measured 1.25GB/day - a 15% growth buffer over the 30d target, which keeps TIME
        # the binding constraint rather than size silently trimming below 30d.
        # Do not "fix" this to 43GB reasoning in decimal units: that is 88% of the volume.
        # If series count ever grows enough to make 40GB bind, grow the PVC instead - Ceph has
        # ~2.6TiB free, and pushing the cap past ~85% trades a graceful retention trim for the
        # risk of filling the disk.
        retentionSize: 40GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      # Expose CNPG Backup objects as metrics. CNPG's own
      # cnpg_collector_last_available_backup_timestamp is pinned at 0 because the
      # barman-cloud plugin never populates it (re-confirmed 2026-08-21 after three
      # backups completed against garage), so the only trustworthy source for "when
      # did a backup last SUCCEED" is the Backup objects themselves. This is what
      # makes a kopiur-style "no successful backup in 48h" dead-man possible.
      rbac:
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["backups"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Backup
                metricNamePrefix: cnpg_backup
                labelsFromPath:
                  namespace: [metadata, namespace]
                  backup: [metadata, name]
                  cluster: [spec, cluster, name]
                  phase: [status, phase]
                metrics:
                  - name: stopped_at_seconds
                    help: Unix time at which a CNPG backup finished, from status.stoppedAt
                    each:
                      type: Gauge
                      gauge:
                        path: [status, stoppedAt]
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count (count by (image) (time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30)) > 25
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      btrfs-rules:
        groups:
          - name: btrfs
            rules:
              - alert: BtrfsDeviceErrorsDetected
                annotations:
                  sumamry: BTRFS device {{$labels.device}} on {{$labels.kubernetes_node}}@{{$labels.instance}} detected an error of type {{$labels.type}}
                expr: node_btrfs_device_errors_total > 0
                labels:
                  severity: critical
              - alert: BtrfsDeviceAlmostFull
                annotations:
                  summary: BTRFS device {{$labels.device}}@{{$labels.instance}} has less than 1% of free space left
                expr: (node_btrfs_device_unused_bytes{job="node-exporter"} / node_btrfs_device_size_bytes{job="node-exporter"} * 100) < 1
                labels:
                  severity: critical
