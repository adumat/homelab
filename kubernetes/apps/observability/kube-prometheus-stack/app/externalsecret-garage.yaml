---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-metrics
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: garage-metrics
    template:
      data:
        token: '{{ .GARAGE_METRICS_TOKEN }}'
  data:
    - secretKey: GARAGE_METRICS_TOKEN
      remoteRef:
        key: GARAGE_METRICS_TOKEN
