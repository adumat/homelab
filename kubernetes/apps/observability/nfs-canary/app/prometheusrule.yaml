---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nfs-canary
spec:
  groups:
    - name: nfs-canary.rules
      rules:
        - alert: NfsExportStale
          annotations:
            summary: >-
              NFS export {{ $labels.export }} is unhealthy
          expr: |
            nfs_canary_health == 0
          for: 1m
          labels:
            severity: critical
        - alert: NfsCanaryAbsent
          annotations:
            summary: >-
              NFS canary metrics are missing from Prometheus
          expr: |
            absent(nfs_canary_health_overall)
          for: 5m
          labels:
            severity: critical
