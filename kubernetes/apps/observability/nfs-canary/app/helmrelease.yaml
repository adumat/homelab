---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nfs-canary
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        containers:
          app:
            image:
              repository: ghcr.io/adumat/nfs-canary
              tag: latest
            env:
              NFS_SERVER: elizabeth.lan
              NFS_EXPORTS: /mnt/user/media,/mnt/user/recordings,/mnt/user/backups/volsync,/mnt/user/immich,/mnt/user/cloud
              EXPORT_LABELS: media,recordings,backups,immich,cloud
              MOUNT_PATHS: /mnt/media,/mnt/recordings,/mnt/backups,/mnt/immich,/mnt/cloud
              CHECK_INTERVAL: "15"
              LISTEN_PORT: "9999"
              PROBE_TIMEOUT: "5"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &port 9999
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          metrics:
            port: 9999
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            interval: 30s
            scrapeTimeout: 10s
            path: /metrics
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
