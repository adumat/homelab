---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nut-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      nut-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:9ae7f98b45ee1c55b093e762132e6f12de8eee9ac915dcd074a9c021d24e2a0f
            env:
              TZ: Europe/Rome
              NUT_EXPORTER_SERVER: nut-server-room.lan
            envFrom:
              - secretRef:
                  name: nut-exporter
            args:
              # export all variables
              - --nut.vars_enable=
              # The trailing `|!` branch is what makes ups.alarm observable. NUT alarm texts
              # are strings ("Battery voltage too low!", "Replace battery!") and the exporter
              # only turns a string into a gauge if it matches on_regex/off_regex - which is
              # why ups.alarm was silently absent while Unraid displayed it. Every NUT alarm
              # string ends in "!", and no other variable this UPS reports contains one, so
              # this coaxes alarms to 1 with no collateral. Verified 2026-08-21 that the flag
              # is plumbed through and that coercion works (see git history for the probe).
              # If a future alarm text somehow lacks "!", extend this pattern.
              - --nut.on_regex=^(enable|enabled|on|true|active|activated)$|!
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 200m
                memory: 100Mi
    service:
      app:
        ports:
          metrics:
            enabled: true
            port: 9199
            protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            # 30s, not 60s: several UPS status flags (RB, LB, OVER, FSD) are asserted
            # transiently and a 60s scrape can miss them entirely - which is exactly how
            # Unraid warned about this battery for months while Prometheus stayed silent.
            interval: 30s
            scrapeTimeout: 10s
            path: /ups_metrics
            params:
              ups: ["ups"]
