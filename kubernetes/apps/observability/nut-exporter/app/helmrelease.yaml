---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nut-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      nut-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.2.5@sha256:d541bc0b01b2670c239e8d0d72d9e54176e2d5b7c10b0ff16ccae273fc4392c8
            env:
              TZ: Europe/Rome
              NUT_EXPORTER_SERVER: nut-server-room.lan
            envFrom:
              - secretRef:
                  name: nut-exporter
            args:
              # export all variables
              - --nut.vars_enable=
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 200m
                memory: 100Mi
    service:
      app:
        ports:
          metrics:
            enabled: true
            port: 9199
            protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            interval: 60s
            scrapeTimeout: 10s
            path: /ups_metrics
            params:
              ups: ["ups"]
