---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Garage S3
    group: storage
    url: http://${SECRET_NAS_NAME}:3900
    interval: 1m
    conditions:
      # [CONNECTED] first, and it is the one that matters. With only
      # "[STATUS] < 500" this endpoint reported success while failing to connect
      # at all: a failed dial yields status 0, and 0 < 500 is true. Gatus logged
      # success alongside "dial tcp :3900: connect: connection refused".
      - "[CONNECTED] == true"
      # garage answers 403 to an unauthenticated S3 root, which is a live
      # listener. This catches a 5xx once it is genuinely reachable.
      - "[STATUS] < 500"
    # Required, and easy to miss: endpoints defined in THIS file inherit nothing.
    # The 37 auto-discovered endpoints get their alerts from the parent Gateway
    # annotations on envoy-internal/envoy-external, but a static endpoint here
    # has no parent - so without this block it would show red on the dashboard
    # and notify nobody.
    alerts:
      - type: pushover

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/6348767
  link: https://status.${DOMAIN}
  buttons:
    - name: Github
      link: https://github.com/adumat
    - name: Homelab
      link: https://github.com/adumat/homelab

web:
  port: ${GATUS_WEB_PORT}

alerting:
  pushover:
    title: Gatus
    application-token: ${PUSHOVER_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    priority: 1
    default-alert:
      description: status failed
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
