---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      gatus:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostUsers: false
        initContainers:
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.5.2@sha256:5fd095a25fa17a6f0f0d4280516d3d5dfd73c878dd5a6ad155c10bff7c1ba94d
            args:
              - --auto-httproute
              - --enable-httproute
              - --enable-service
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            restartPolicy: Always
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
            env:
              GATUS_CONFIG_PATH: /config
              GATUS_DELAY_START_SECONDS: 5
              GATUS_WEB_PORT: &port 80
              TZ: Europe/Rome
              # Gatus expands ${...} inside its config at RUNTIME, from its own
              # environment - Flux never does it, because the configMapGenerator
              # in kustomization.yaml carries
              # `kustomize.toolkit.fluxcd.io/substitute: disabled`.
              #
              # These two were missing from the container, so every ${DOMAIN} and
              # ${SECRET_NAS_NAME} in config.yaml expanded to an EMPTY STRING.
              # Endpoints then dialled hosts like "http://:3900", failed to
              # connect, and a `[STATUS] < 500` condition read the resulting 0 as
              # 0 < 500 = true - so those checks reported healthy forever while
              # testing nothing at all.
              #
              # Substituted here by Flux, which is allowed: only the ConfigMap is
              # exempt, and ks.yaml already has substituteFrom cluster-secrets.
              DOMAIN: ${DOMAIN}
              SECRET_NAS_NAME: ${SECRET_NAS_NAME}
            # The `gatus` ExternalSecret has existed and synced correctly all
            # along, holding PUSHOVER_TOKEN and PUSHOVER_USER_KEY - but nothing
            # ever mounted it. So the alerting block rendered an empty token and
            # user key, and Gatus could never notify anyone. This is why Pushover
            # notifications have been silently missing.
            envFrom:
              - secretRef:
                  name: gatus
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { add: ["NET_RAW"], drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 256Mi
        statefulset:
          volumeClaimTemplates:
            - name: config
              storageClass: miroir-replicated
              accessMode: ReadWriteOnce
              size: 5Gi
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Gatus
          gethomepage.dev/icon: gatus.png
          gethomepage.dev/description: Uptime Monitoring
          gethomepage.dev/widget.type: gatus
          gethomepage.dev/widget.url: http://gatus.observability.svc.cluster.local:80
        hostnames:
          - status.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
    rbac:
      roles:
        gatus:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - services
              verbs:
                - get
                - watch
                - list
            - apiGroups:
                - gateway.networking.k8s.io
              resources:
                - gateways
                - httproutes
              verbs:
                - get
                - watch
                - list
      bindings:
        gatus:
          type: ClusterRoleBinding
          roleRef:
            identifier: gatus
          subjects:
            - identifier: gatus
    defaultPodOptions:
      # app-template v5 defaults automountServiceAccountToken to false; the
      # gatus-sidecar needs the SA token for in-cluster Kubernetes discovery.
      automountServiceAccountToken: true
      # The /config RBD PVC mounts as root:root; fsGroup makes it group-writable
      # so the non-root gatus-sidecar can write auto-discovered endpoint config.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      gatus: {}
    persistence:
      config-file:
        type: configMap
        name: gatus
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
