---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana
    template:
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ (fromJson .oidc_raw).secret }}'
        GF_SECURITY_ADMIN_PASSWORD: '{{ .GF_SECURITY_ADMIN_PASSWORD }}'
  # Client credential now comes from grafana's own per-app item rather than the
  # IdP's secret. Nothing here references anything named after the IdP.
  data:
    - secretKey: oidc_raw
      remoteRef:
        key: grafana-oidc
  dataFrom:
    - extract:
        key: grafana-secret
