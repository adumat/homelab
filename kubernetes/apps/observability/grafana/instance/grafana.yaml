---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: 'false'
      check_for_plugin_updates: 'false'
      feedback_links_enabled: 'false'
      reporting_enabled: 'false'
    auth:
      disable_login_form: 'false'
      # Grafana identifies OAuth users by the provider's sub, which changed with
      # the IdP. It refuses to fall back to matching on email unless this is
      # enabled, so it could neither find the existing account nor create a new
      # one alongside it, reporting "Failed to create user: user not found".
      # Authelia was delivering email, preferred_username and groups correctly -
      # its userinfo request succeeded - so this is purely Grafana's own guard.
      oauth_allow_insecure_email_lookup: 'true'
    auth.anonymous:
      enabled: 'false'
    auth.basic:
      enabled: 'false'
    auth.generic_oauth:
      enabled: 'true'
      name: 'Authelia'
      client_id: 'grafana'
      client_secret: '$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}'
      scopes: 'openid profile email groups offline_access'
      use_refresh_token: 'true'
      # Authelia endpoints. role_attribute_path below is unchanged: the groups
      # claim keeps the same shape and still contains 'admins'.
      auth_url: 'https://auth.${DOMAIN}/api/oidc/authorization'
      token_url: 'https://auth.${DOMAIN}/api/oidc/token'
      api_url: 'https://auth.${DOMAIN}/api/oidc/userinfo'
      role_attribute_path: "contains(groups, 'admins') && 'Admin' || 'Viewer'"
      # Explicit JMESPath rather than relying on Grafana probing claim names.
      # Grafana failed with "unable to create user: user not found", which is what
      # it reports when it cannot resolve an email/login for the account. Authelia
      # names the username claim preferred_username, which Grafana does not
      # necessarily try by default.
      login_attribute_path: 'preferred_username'
      email_attribute_path: 'email'
      name_attribute_path: 'name'
      allow_sign_up: 'true'
      use_pkce: 'true'
    log:
      mode: console
    metrics:
      enabled: 'true'
    news:
      news_feed_enabled: 'false'
    plugins:
      plugin_admin_enabled: 'false'
    security:
      angular_support_enabled: 'true'
    server:
      enable_gzip: 'true'
      root_url: https://grafana.${DOMAIN}
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ['ALL'] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
