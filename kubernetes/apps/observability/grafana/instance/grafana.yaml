---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: 'false'
      check_for_plugin_updates: 'false'
      feedback_links_enabled: 'false'
      reporting_enabled: 'false'
    auth:
      disable_login_form: 'false'
      # Grafana identifies OAuth users by the provider's sub, which changed with
      # the IdP. It refuses to fall back to matching on email unless this is
      # enabled, so it could neither find the existing account nor create a new
      # one alongside it, reporting "Failed to create user: user not found".
      # Authelia was delivering email, preferred_username and groups correctly -
      # its userinfo request succeeded - so this is purely Grafana's own guard.
      oauth_allow_insecure_email_lookup: 'true'
    auth.anonymous:
      enabled: 'false'
    auth.basic:
      # MUST stay enabled: grafana-operator's own API client authenticates with
      # HTTP basic as the admin user. Disabling it (3aa90b5, "in favor of OAuth")
      # locked the operator out, so the Grafana CR sat at stageStatus: failed and
      # every GrafanaDashboard reported "None of the available Grafana instances
      # matched the selector" - all 63 of them frozen from 2026-02-17 to
      # 2026-08-29, silently, because the restored PVC kept serving the old copies.
      # Human logins are unaffected either way: they go through OAuth.
      enabled: 'true'
    auth.generic_oauth:
      enabled: 'true'
      name: 'Authelia'
      client_id: 'grafana'
      client_secret: '$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}'
      scopes: 'openid profile email groups offline_access'
      use_refresh_token: 'true'
      # Authelia endpoints. role_attribute_path below is unchanged: the groups
      # claim keeps the same shape and still contains 'admins'.
      auth_url: 'https://auth.${DOMAIN}/api/oidc/authorization'
      token_url: 'https://auth.${DOMAIN}/api/oidc/token'
      api_url: 'https://auth.${DOMAIN}/api/oidc/userinfo'
      role_attribute_path: "contains(groups, 'admins') && 'Admin' || 'Viewer'"
      # Explicit JMESPath rather than relying on Grafana probing claim names.
      # Grafana failed with "unable to create user: user not found", which is what
      # it reports when it cannot resolve an email/login for the account. Authelia
      # names the username claim preferred_username, which Grafana does not
      # necessarily try by default.
      login_attribute_path: 'preferred_username'
      email_attribute_path: 'email'
      name_attribute_path: 'name'
      allow_sign_up: 'true'
      use_pkce: 'true'
    log:
      mode: console
    metrics:
      enabled: 'true'
    news:
      news_feed_enabled: 'false'
    plugins:
      plugin_admin_enabled: 'false'
    security:
      angular_support_enabled: 'true'
    server:
      enable_gzip: 'true'
      root_url: https://grafana.${DOMAIN}
  deployment:
    # Grafana takes the OIDC client secret from the grafana secret as an env var,
    # read only at process start. Without this, a rotated secret left the running
    # pod authenticating with the old one - which is what made the cutover
    # failures look like config problems when the config was already correct.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                # GF_SECURITY_ADMIN_PASSWORD is deliberately NOT set here. The
                # operator injects both admin env vars from the grafana-admin-credentials
                # secret it generates and authenticates with. Overriding only the
                # password from Bitwarden left the two halves pointing at different
                # values, so the operator's basic auth could never succeed.
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ['ALL'] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: miroir-replicated
      # Closes the last of phase 3's G1. Without this a rebuilt cluster creates
      # grafana-pvc EMPTY and grafana starts on it reporting healthy, losing
      # grafana.db - users, preferences, annotations, starred dashboards. The
      # dashboards themselves are GrafanaDashboard CRs and survive regardless.
      #
      # The Restore comes from components/kopiur-external and is named after APP
      # (`grafana`), not after the PVC (`grafana-pvc`).
      #
      # ⚠️ dataSourceRef is IMMUTABLE, so this cannot be patched onto an existing
      # PVC - the operator reports "spec is immutable after creation" and enters a
      # reconcile error loop. It was applied by deleting and recreating the volume,
      # and the ordering matters: the operator recreates a deleted PVC within
      # seconds, so the field must already be in this CR before the delete, and
      # grafana must be stopped via `deployment.spec.replicas: 0` here (scaling
      # the Deployment by hand is reverted, and deleting a mounted PVC arms the
      # finalizer delete).
      dataSourceRef:
        apiGroup: kopiur.home-operations.com
        kind: Restore
        name: grafana
  disableDefaultSecurityContext: All
