---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mylar3
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mylar3:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              # Upstream moved to MylarComics/mylar3 in March 2026 and this image
              # tracks it. The abandoned mylar3/mylar3 repo stops at v0.8.3, so
              # judging the project by that one concludes it is dead.
              repository: ghcr.io/linuxserver/mylar3
              tag: v0.11.0-ls269@sha256:4509578980ad28cd3e8875bb8d8b579a1e2e216c0c6909810be8cbb34badd121
            env:
              TZ: Europe/Rome
              PUID: "1000"
              PGID: "1000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8090
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # The LinuxServer image runs s6 as root and drops to PUID/PGID, so
        # runAsUser is deliberately unset - only fsGroup, matching pyload-ng.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Mylar3
          gethomepage.dev/icon: mylar.png
          gethomepage.dev/description: Comics Downloads
        hostnames:
          - mylar3.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
      media:
        # The WHOLE share, not just Comic/: hardlinking out of torrent/complete
        # is only possible when both paths sit in one mount, and Unraid's shfs
        # cannot hardlink across separate user shares.
        type: nfs
        server: elizabeth.lan
        path: /mnt/user/media
        globalMounts:
          - path: /media
