---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kapowarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: longhorn
      namespace: storage
  values:
    controllers:
      kapowarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mrcas/kapowarr
              tag: v1.2.0@sha256:484f7decc7cc7af77542aba5516f48a62b17f72116ac7309d1709b72bb7d0ba2
            env:
              TZ: Europe/Rome
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 500M
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 5656
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Kapowarr
          gethomepage.dev/icon: kapowarr.png
          gethomepage.dev/description: Comic Downloads
          gethomepage.dev/widget.type: kapowarr
          gethomepage.dev/widget.url: https://kapowarr.${DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_KAPOWARR_TOKEN}}` }}"
        hostnames:
          - kapowarr.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/db
      media:
        type: persistentVolumeClaim
        existingClaim: nas-downloads-media
        globalMounts:
          - path: /media
