---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: radarr-secret
    template:
      data:
        INIT_POSTGRES_DBNAME: 'radarr radarr_log'
        INIT_POSTGRES_HOST: 'cluster18-rw.database.svc.cluster.local'
        INIT_POSTGRES_PASS: '{{ .RADARR__POSTGRES__PASSWORD }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_USER: '{{ .RADARR__POSTGRES__USER }}'
        RADARR__API__KEY: '{{ .RADARR__API__KEY }}'
        RADARR__AUTH__APIKEY: '{{ .RADARR__AUTH__APIKEY }}'
        RADARR__POSTGRES__HOST: 'cluster18-rw.database.svc.cluster.local'
        RADARR__POSTGRES__LOGDB: 'radarr_log'
        RADARR__POSTGRES__MAINDB: 'radarr'
        RADARR__POSTGRES__PASSWORD: '{{ .RADARR__POSTGRES__PASSWORD }}'
        RADARR__POSTGRES__PORT: "5432"
        RADARR__POSTGRES__USER: '{{ .RADARR__POSTGRES__USER }}'
  dataFrom:
    - extract:
        key: radarr-secret
    - extract:
        key: postgres-superuser-secret
