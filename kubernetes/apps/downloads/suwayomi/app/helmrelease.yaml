---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app suwayomi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      suwayomi:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/suwayomi/suwayomi-server
              tag: v2.3.2243@sha256:e59f212ccf91b26de8676a063a2db90256c148c6261535c7c477d47a43d9751b
            env:
              TZ: Europe/Rome
              BIND_IP: 0.0.0.0
              BIND_PORT: &port 4567
              # Produces CBZ plus a ComicInfo.xml on the ComicRack/Komga spec,
              # which is what makes the output readable by Komga untouched.
              DOWNLOAD_AS_CBZ: "true"
              # Auth delegated to the gateway, matching prowlarr's
              # PROWLARR__AUTH__METHOD: External. The oidc-auth SecurityPolicy is
              # the real control.
              AUTH_MODE: none
              # ⚠️ Suwayomi ships with NO extension repository, and without one
              # the source list is empty - there is nothing to install and no
              # error explaining why. Tachiyomi's official repo shut down, so a
              # third-party one is required; Keiyoushi is the de-facto successor.
              #
              # index.pb, not index.min.json: the latter is now a 765-byte
              # version-gate stub holding two dummy "Update to Mihon" entries.
              # keiyoushi's own repo.json names index.pb as `index_v2`.
              EXTENSION_STORES: '["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]'
              # flaresolverr already runs in this namespace.
              FLARESOLVERR_ENABLED: "true"
              FLARESOLVERR_URL: http://flaresolverr.downloads.svc.cluster.local:8191
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  # JVM plus a first-run extension index fetch.
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1500Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Suwayomi
          gethomepage.dev/icon: suwayomi.png
          gethomepage.dev/description: Manga Downloads
        hostnames:
          - suwayomi.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk
      # server.downloadsPath has NO environment variable: the image seeds
      # server.conf from the jar and sed-patches only the mapped settings, and
      # that file lives on the PVC where git cannot see it. So the manga share is
      # mounted directly ONTO the default downloads directory
      # (<rootDir>/downloads) instead. Suwayomi downloads directly and needs no
      # hardlinks, so it has no reason to see the whole media share.
      downloads:
        type: nfs
        server: elizabeth.lan
        path: /mnt/user/media/Manga
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk/downloads
