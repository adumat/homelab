---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: sonarr-secret
    template:
      data:
        INIT_POSTGRES_DBNAME: 'sonarr sonarr_log'
        INIT_POSTGRES_HOST: 'cluster18-rw.database.svc.cluster.local'
        INIT_POSTGRES_PASS: '{{ .SONARR__POSTGRES__PASSWORD }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_USER: '{{ .SONARR__POSTGRES__USER }}'
        SONARR__API__KEY: '{{ .SONARR__API__KEY }}'
        SONARR__AUTH__APIKEY: '{{ .SONARR__AUTH__APIKEY }}'
        SONARR__POSTGRES__HOST: 'cluster18-rw.database.svc.cluster.local'
        SONARR__POSTGRES__LOGDB: 'sonarr_log'
        SONARR__POSTGRES__MAINDB: 'sonarr'
        SONARR__POSTGRES__PASSWORD: '{{ .SONARR__POSTGRES__PASSWORD }}'
        SONARR__POSTGRES__PORT: "5432"
        SONARR__POSTGRES__USER: '{{ .SONARR__POSTGRES__USER }}'
  dataFrom:
    - extract:
        key: sonarr-secret
    - extract:
        key: postgres-superuser-secret
