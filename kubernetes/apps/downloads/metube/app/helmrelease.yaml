---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app metube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      metube:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/alexta69/metube
              tag: "2026.08.28"
            env:
              DOWNLOAD_DIR: "/downloads"
              # DOWNLOAD_MODE: concurrent # defaults to limited
              DOWNLOAD_MODE: limited
              MAX_CONCURRENT_DOWNLOADS: 5 #only used with limited, default to 3
              STATE_DIR: "/config"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # ⚠️ TEMPORARY - remove once bulbasaur's DRBD wedge is cleared.
      # `drbdsetup primary` for this volume HANGS on bulbasaur: the CSI fails
      # the mount with "device /dev/drbd1007 not writable (is the volume in use
      # on another node?)" and the pod sits in ContainerCreating forever, while
      # the volume itself is perfectly healthy - 3 replicas UpToDate and
      # connected, quorum:yes, loop device and backing file writable,
      # auto-promote identical to the nodes where it mounts first try.
      # Same family as the teardown wedge in upstream miroir #262
      # (LINBIT drbd#137), which only a node reboot clears - and bulbasaur was
      # rebooted for exactly that on 2026-09-01, so it has re-wedged.
      # Cordoning does not survive rescheduling; this does.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["bulbasaur"]
      securityContext:
        # runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8081
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Metube
          gethomepage.dev/icon: metube.png
          gethomepage.dev/description: YouTube Downloads
        hostnames:
          - metube.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
      downloads:
        existingClaim: metube-media
        globalMounts:
          - path: /downloads
            subPath: downloads
      cache:
        type: emptyDir
        globalMounts:
          - path: /.cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
