---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: autobrr-secret
    template:
      data:
        AUTOBRR__DATABASE_TYPE: 'postgres'
        AUTOBRR__POSTGRES_DATABASE: 'autobrr'
        AUTOBRR__POSTGRES_HOST: 'cluster17-rw.databases.svc.cluster.local'
        AUTOBRR__POSTGRES_PASS: '{{ .AUTOBRR__POSTGRES_PASS }}'
        AUTOBRR__POSTGRES_PORT: "5432"
        AUTOBRR__POSTGRES_USER: '{{ .AUTOBRR__POSTGRES_USER }}'
        AUTOBRR__SESSION_SECRET: '{{ .AUTOBRR__SESSION_SECRET }}'
        INIT_POSTGRES_DBNAME: 'autobrr'
        INIT_POSTGRES_HOST: 'cluster17-rw.databases.svc.cluster.local'
        INIT_POSTGRES_PASS: '{{ .AUTOBRR__POSTGRES_PASS }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_USER: '{{ .AUTOBRR__POSTGRES_USER }}'
  dataFrom:
    - extract:
        key: autobrr-secret
    - extract:
        key: postgres-superuser-secret
