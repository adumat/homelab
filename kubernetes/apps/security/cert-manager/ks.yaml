---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cert-manager
  namespace: &namespace security
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/security/cert-manager/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: *namespace
    - apiVersion: &apiVersion cert-manager.io/v1
      kind: &kind ClusterIssuer
      name: cluster-selfsigned-issuer
    - apiVersion: *apiVersion
      kind: *kind
      name: cluster-signed-issuer
  healthCheckExprs:
    - apiVersion: *apiVersion
      kind: *kind
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: &namespace security
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: cert-manager-issuers
  interval: 1h
  path: ./kubernetes/apps/security/cert-manager/issuers
  dependsOn:
    - name: cert-manager
      namespace: security
    - name: external-secrets-store
      namespace: security
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: &apiVersion cert-manager.io/v1
      kind: &kind ClusterIssuer
      name: letsencrypt-production
  healthCheckExprs:
    - apiVersion: *apiVersion
      kind: *kind
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
