---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      # Use external PostgreSQL and Redis
      deployPostgres: false
      deployRedis: false

      # Environment variables from secret
      envFrom:
        - secretRef:
            name: authentik-secret

      # Additional environment variables
      env:
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_REDIS__PORT
          value: "6379"

      # Volume for media storage and blueprints
      volumes:
        - name: blueprints
          configMap:
            name: authentik-blueprints

      volumeMounts:
        - name: blueprints
          mountPath: /blueprints/custom

    # Server deployment
    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

      # Init container to create PostgreSQL database
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18
          envFrom:
            - secretRef:
                name: authentik-secret

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    # Worker deployment
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
