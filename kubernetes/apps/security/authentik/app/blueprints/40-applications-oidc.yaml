---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# OIDC application providers
version: 1
entries:
  # ========== Custom Scope Mappings ==========

  # Override default email scope to use email_verified from user attributes
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-email
    attrs:
      name: "authentik default OAuth Mapping: OpenID 'email'"
      scope_name: email
      description: "Access to your email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", False)
        }

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-groups
    attrs:
      name: "OAuth2 Scope: groups"
      scope_name: groups
      description: "Access to your group memberships"
      expression: |
        # Map Authentik groups to OCIS-compatible role names
        ocis_role_map = {
            "admins": "ocisAdmin",
            "users": "ocisUser",
            "external_users": "ocisGuest",
        }
        groups = []
        for group in request.user.ak_groups.all():
            groups.append(group.name)
            if group.name in ocis_role_map:
                groups.append(ocis_role_map[group.name])
        return {"groups": groups}

  # Duplicate of the groups mapping but bound to the "profile" scope.
  # Mobile/desktop apps don't request the non-standard "groups" scope,
  # so we embed groups into "profile" which they always request.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-ocis-groups-via-profile
    attrs:
      name: "OCIS: groups via profile scope"
      scope_name: profile
      description: "Include OCIS group roles when profile scope is requested"
      expression: |
        ocis_role_map = {
            "admins": "ocisAdmin",
            "users": "ocisUser",
            "external_users": "ocisGuest",
        }
        groups = []
        for group in request.user.ak_groups.all():
            groups.append(group.name)
            if group.name in ocis_role_map:
                groups.append(ocis_role_map[group.name])
        return {"groups": groups}

  # ========== OCIS (ownCloud Infinite Scale) ==========
  # Public client - no client secret required
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: ocis-oauth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: ocis
      redirect_uris:
        - url: "https://files.${DOMAIN}/"
          matching_mode: "strict"
        - url: "https://files.${DOMAIN}/oidc-callback.html"
          matching_mode: "strict"
        - url: "https://files.${DOMAIN}/oidc-silent-redirect.html"
          matching_mode: "strict"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "offline_access"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-ocis-groups-via-profile"]]

  - model: authentik_core.application
    identifiers:
      name: "OCIS (File Sharing)"
    attrs:
      slug: ocis
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ocis-oauth]]
      policy_engine_mode: all

