---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# OIDC application providers
version: 1
entries:
  # ========== Custom Scope Mappings ==========
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-groups
    attrs:
      name: "OAuth2 Scope: groups"
      scope_name: groups
      description: "Access to your group memberships"
      expression: |
        # Map Authentik groups to OCIS-compatible role names
        ocis_role_map = {
            "admins": "ocisAdmin",
            "users": "ocisUser",
            "external_users": "ocisGuest",
        }
        groups = []
        for group in request.user.ak_groups.all():
            groups.append(group.name)
            if group.name in ocis_role_map:
                groups.append(ocis_role_map[group.name])
        return {"groups": groups}

  # ========== OCIS (ownCloud Infinite Scale) ==========
  # Public client - no client secret required
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: ocis-oauth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: ocis
      redirect_uris:
        - url: "https://files.${DOMAIN}/"
          matching_mode: "strict"
        - url: "https://files.${DOMAIN}/oidc-callback.html"
          matching_mode: "strict"
        - url: "https://files.${DOMAIN}/oidc-silent-redirect.html"
          matching_mode: "strict"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "offline_access"]]

  - model: authentik_core.application
    identifiers:
      name: "OCIS (File Sharing)"
    attrs:
      slug: ocis
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ocis-oauth]]
      policy_engine_mode: all

  # ========== Grafana ==========
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: grafana-oauth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
      redirect_uris:
        - url: "https://grafana.${DOMAIN}/login/generic_oauth"
          matching_mode: "strict"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]

  - model: authentik_core.application
    identifiers:
      name: "Grafana (Monitoring)"
    attrs:
      slug: grafana
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-oauth]]
      policy_engine_mode: all

  # ========== Paperless ==========
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: paperless-oauth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: paperless
      client_secret: !Env PAPERLESS_OAUTH_CLIENT_SECRET
      redirect_uris:
        - url: "https://paperless.${DOMAIN}/accounts/oidc/authentik/login/callback/"
          matching_mode: "strict"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]

  - model: authentik_core.application
    identifiers:
      name: "Paperless (Documents)"
    attrs:
      slug: paperless
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, paperless-oauth]]
      policy_engine_mode: all

  # ========== Karakeep ==========
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: karakeep-oauth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: karakeep
      client_secret: !Env KARAKEEP_OAUTH_CLIENT_SECRET
      redirect_uris:
        - url: "https://karakeep.${DOMAIN}/api/auth/callback/custom"
          matching_mode: "strict"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]

  - model: authentik_core.application
    identifiers:
      name: "Karakeep (Karaoke)"
    attrs:
      slug: karakeep
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, karakeep-oauth]]
      policy_engine_mode: all
