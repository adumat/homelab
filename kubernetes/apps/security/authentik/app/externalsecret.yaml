---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-secret
    template:
      engineVersion: v2
      data:
        # PostgreSQL init variables
        INIT_POSTGRES_DBNAME: "authentik"
        INIT_POSTGRES_HOST: "cluster18-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .AUTHENTIK_POSTGRESQL__USER }}"
        INIT_POSTGRES_PASS: "{{ .AUTHENTIK_POSTGRESQL__PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .INIT_POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .INIT_POSTGRES_SUPER_PASS }}"

        # Authentik core secrets
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"

        # PostgreSQL connection
        AUTHENTIK_POSTGRESQL__USER: "{{ .AUTHENTIK_POSTGRESQL__USER }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_POSTGRESQL__PASSWORD }}"
        AUTHENTIK_POSTGRESQL__HOST: "cluster18-rw.database.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"

        # Redis connection
        AUTHENTIK_REDIS__HOST: "dragonfly.database.svc.cluster.local"
        AUTHENTIK_REDIS__DB: "3"

        # OIDC client secrets (for blueprints)
        GRAFANA_OAUTH_CLIENT_SECRET: "{{ .GRAFANA_OAUTH_CLIENT_SECRET }}"
        PAPERLESS_OAUTH_CLIENT_SECRET: "{{ .PAPERLESS_OAUTH_CLIENT_SECRET }}"
        KARAKEEP_OAUTH_CLIENT_SECRET: "{{ .KARAKEEP_OAUTH_CLIENT_SECRET }}"

        # OIDC client secrets for downloads apps (Envoy Gateway OIDC)
        SONARR_OIDC_CLIENT_SECRET: "{{ .sonarr }}"
        RADARR_OIDC_CLIENT_SECRET: "{{ .radarr }}"
        PROWLARR_OIDC_CLIENT_SECRET: "{{ .prowlarr }}"
        READARR_OIDC_CLIENT_SECRET: "{{ .readarr }}"
        QBITTORRENT_OIDC_CLIENT_SECRET: "{{ .qbittorrent }}"
        METUBE_OIDC_CLIENT_SECRET: "{{ .metube }}"
        PYLOAD_NG_OIDC_CLIENT_SECRET: "{{ index . \"pyload-ng\" }}"
        FLUX_OPERATOR_OIDC_CLIENT_SECRET: "{{ .fluxoperator }}"
  dataFrom:
    - extract:
        key: authentik-secret
    - extract:
        key: postgres-superuser-secret
    - extract:
        key: oidc-client-secrets
