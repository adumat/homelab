---
# Without this, the SecurityPolicy created by components/oidc-auth in each app's
# namespace cannot reference the authelia Service here, and every Envoy-OIDC app
# fails with an unaccepted SecurityPolicy. Cross-namespace backendRefs require an
# explicit grant from the target namespace.
#
# Mirrors the grant Authentik had. The namespace list is deliberately broader than
# today's consumers (downloads and home) so Phase 2 apps in media, services,
# observability and flux-system need no change here.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authelia-ext-auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: downloads
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: services
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: default
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
  to:
    - group: ""
      kind: Service
      name: authelia
