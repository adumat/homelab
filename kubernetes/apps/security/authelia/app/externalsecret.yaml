---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authelia-secret
    template:
      engineVersion: v2
      data:
        # PostgreSQL init variables
        INIT_POSTGRES_DBNAME: "authelia"
        INIT_POSTGRES_HOST: "cluster18-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .INIT_POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .INIT_POSTGRES_SUPER_PASS }}"

        # Read as files by the config template filter, so each key below becomes
        # /secrets/authelia/<KEY>. Authelia holds NO user data - users live in
        # LLDAP, and LDAP_BIND_PASSWORD is how it reads them.
        IDENTITY_VALIDATION_JWT_SECRET: "{{ .IDENTITY_VALIDATION_JWT_SECRET }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
        STORAGE_ENCRYPTION_KEY: "{{ .STORAGE_ENCRYPTION_KEY }}"
        OIDC_HMAC_SECRET: "{{ .OIDC_HMAC_SECRET }}"
        OIDC_ISSUER_PRIVATE_KEY: "{{ .OIDC_ISSUER_PRIVATE_KEY }}"
        LDAP_BIND_PASSWORD: "{{ .LDAP_BIND_PASSWORD }}"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: authelia-secret
    - extract:
        key: postgres-superuser-secret
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-digests
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authelia-oidc-digests
    creationPolicy: Owner
    # The Bitwarden provider IGNORES remoteRef.property, so each item arrives as
    # the whole {"secret":...,"digest":...} JSON blob. The digest is extracted
    # here instead - otherwise Authelia receives JSON as a client secret, treats
    # it as a deprecated plaintext value, and client authentication fails.
    template:
      engineVersion: v2
      data:
        grafana: '{{ (fromJson .grafana_raw).digest }}'
        paperless: '{{ (fromJson .paperless_raw).digest }}'
        romm: '{{ (fromJson .romm_raw).digest }}'
        headlamp: '{{ (fromJson .headlamp_raw).digest }}'
        sonarr: '{{ (fromJson .sonarr_raw).digest }}'
        radarr: '{{ (fromJson .radarr_raw).digest }}'
        prowlarr: '{{ (fromJson .prowlarr_raw).digest }}'
        qbittorrent: '{{ (fromJson .qbittorrent_raw).digest }}'
        metube: '{{ (fromJson .metube_raw).digest }}'
        pyload-ng: '{{ (fromJson .pyload_ng_raw).digest }}'
        peekaboo: '{{ (fromJson .peekaboo_raw).digest }}'
        ocis-ios: '{{ (fromJson .ocis_ios_raw).digest }}'
        ocis-android: '{{ (fromJson .ocis_android_raw).digest }}'
        ocis-desktop: '{{ (fromJson .ocis_desktop_raw).digest }}'
        # Phase 2 Plan A. NOTE the naming split: secretKey uses underscores,
        # the map key uses hyphens. '.it-tools_raw' is not a valid Go template
        # field reference, so a hyphenated secretKey fails at render time.
        kopia: '{{ (fromJson .kopia_raw).digest }}'
        it-tools: '{{ (fromJson .it_tools_raw).digest }}'
        esp-home: '{{ (fromJson .esp_home_raw).digest }}'
        victoria-logs: '{{ (fromJson .victoria_logs_raw).digest }}'
        alertmanager: '{{ (fromJson .alertmanager_raw).digest }}'
        prometheus: '{{ (fromJson .prometheus_raw).digest }}'
        rook-ceph-dashboard: '{{ (fromJson .rook_ceph_dashboard_raw).digest }}'
        home-assistant-code: '{{ (fromJson .home_assistant_code_raw).digest }}'
  data:
    - secretKey: grafana_raw
      remoteRef: { key: grafana-oidc }
    - secretKey: paperless_raw
      remoteRef: { key: paperless-oidc }
    - secretKey: romm_raw
      remoteRef: { key: romm-oidc }
    - secretKey: headlamp_raw
      remoteRef: { key: headlamp-oidc }
    - secretKey: sonarr_raw
      remoteRef: { key: sonarr-oidc }
    - secretKey: radarr_raw
      remoteRef: { key: radarr-oidc }
    - secretKey: prowlarr_raw
      remoteRef: { key: prowlarr-oidc }
    - secretKey: qbittorrent_raw
      remoteRef: { key: qbittorrent-oidc }
    - secretKey: metube_raw
      remoteRef: { key: metube-oidc }
    - secretKey: pyload_ng_raw
      remoteRef: { key: pyload-ng-oidc }
    - secretKey: peekaboo_raw
      remoteRef: { key: peekaboo-oidc }
    - secretKey: ocis_ios_raw
      remoteRef: { key: ocis-ios-oidc }
    - secretKey: ocis_android_raw
      remoteRef: { key: ocis-android-oidc }
    - secretKey: ocis_desktop_raw
      remoteRef: { key: ocis-desktop-oidc }
    - secretKey: kopia_raw
      remoteRef: { key: kopia-oidc }
    - secretKey: it_tools_raw
      remoteRef: { key: it-tools-oidc }
    - secretKey: esp_home_raw
      remoteRef: { key: esp-home-oidc }
    - secretKey: victoria_logs_raw
      remoteRef: { key: victoria-logs-oidc }
    - secretKey: alertmanager_raw
      remoteRef: { key: alertmanager-oidc }
    - secretKey: prometheus_raw
      remoteRef: { key: prometheus-oidc }
    - secretKey: rook_ceph_dashboard_raw
      remoteRef: { key: rook-ceph-dashboard-oidc }
    - secretKey: home_assistant_code_raw
      remoteRef: { key: home-assistant-code-oidc }
