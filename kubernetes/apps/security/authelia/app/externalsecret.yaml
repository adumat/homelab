---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authelia-secret
    template:
      engineVersion: v2
      data:
        # PostgreSQL init variables
        INIT_POSTGRES_DBNAME: "authelia"
        INIT_POSTGRES_HOST: "cluster18-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .INIT_POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .INIT_POSTGRES_SUPER_PASS }}"

        # Read as files by the config template filter, so each key below becomes
        # /secrets/authelia/<KEY>. Authelia holds NO user data - users live in
        # LLDAP, and LDAP_BIND_PASSWORD is how it reads them.
        IDENTITY_VALIDATION_JWT_SECRET: "{{ .IDENTITY_VALIDATION_JWT_SECRET }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
        STORAGE_ENCRYPTION_KEY: "{{ .STORAGE_ENCRYPTION_KEY }}"
        OIDC_HMAC_SECRET: "{{ .OIDC_HMAC_SECRET }}"
        OIDC_ISSUER_PRIVATE_KEY: "{{ .OIDC_ISSUER_PRIVATE_KEY }}"
        LDAP_BIND_PASSWORD: "{{ .LDAP_BIND_PASSWORD }}"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: authelia-secret
    - extract:
        key: postgres-superuser-secret
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-digests
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authelia-oidc-digests
    creationPolicy: Owner
  # Explicit entries rather than dataFrom/extract: all 15 per-app items carry a
  # key literally named "digest", so extract would collide and silently keep
  # only the last one. This is also self-documenting at the call site.
  data:
    - secretKey: grafana
      remoteRef: { key: grafana-oidc, property: digest }
    - secretKey: paperless
      remoteRef: { key: paperless-oidc, property: digest }
    - secretKey: karakeep
      remoteRef: { key: karakeep-oidc, property: digest }
    - secretKey: romm
      remoteRef: { key: romm-oidc, property: digest }
    - secretKey: headlamp
      remoteRef: { key: headlamp-oidc, property: digest }
    - secretKey: sonarr
      remoteRef: { key: sonarr-oidc, property: digest }
    - secretKey: radarr
      remoteRef: { key: radarr-oidc, property: digest }
    - secretKey: prowlarr
      remoteRef: { key: prowlarr-oidc, property: digest }
    - secretKey: qbittorrent
      remoteRef: { key: qbittorrent-oidc, property: digest }
    - secretKey: metube
      remoteRef: { key: metube-oidc, property: digest }
    - secretKey: pyload-ng
      remoteRef: { key: pyload-ng-oidc, property: digest }
    - secretKey: peekaboo
      remoteRef: { key: peekaboo-oidc, property: digest }
    - secretKey: ocis-ios
      remoteRef: { key: ocis-ios-oidc, property: digest }
    - secretKey: ocis-android
      remoteRef: { key: ocis-android-oidc, property: digest }
    - secretKey: ocis-desktop
      remoteRef: { key: ocis-desktop-oidc, property: digest }
