---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
spec:
  # REHEARSAL: auth2 on the internal gateway while Authentik keeps serving
  # auth.${DOMAIN}. At cutover this becomes auth.${DOMAIN} on envoy-external,
  # and session.cookies[].authelia_url in resources/configuration.yaml must
  # change with it - the two are a matched pair.
  hostnames:
    - auth2.${DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: authelia
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
