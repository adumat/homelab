---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/name: Authelia
    gethomepage.dev/icon: authelia.png
    gethomepage.dev/description: Identity Provider
    # No widget: Homepage has no Authelia widget type, unlike Authentik's.
spec:
  # The login page must be public. Paired with
  # session.cookies[].authelia_url in resources/configuration.yaml - change both
  # together or the portal redirects to the wrong host.
  hostnames:
    - auth.${DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: authelia
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
