      - client_id: 'pgadmin'
        client_name: 'pgAdmin'
        client_secret: '{{ secret "/secrets/oidc/pgadmin" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        # No 'envoy_session' lifespan: that profile exists to outlive Envoy's
        # 168h refresh cookie, and pgadmin is not an Envoy client - it keeps its
        # own Flask session. The 1h30m default is correct here.
        redirect_uris:
          - 'https://pgadmin.${DOMAIN}/oauth2/authorize'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
