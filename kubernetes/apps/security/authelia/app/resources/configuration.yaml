      # with an invalid_redirect_uri that looks like a pgadmin bug.
      #
      # pgadmin keeps 'internal' in AUTHENTICATION_SOURCES as a fallback: the
      # OIDC identity is matteo's LLDAP email, which does NOT match the internal
      # pgadmin@ account that owns the preconfigured servers, so auto-created
