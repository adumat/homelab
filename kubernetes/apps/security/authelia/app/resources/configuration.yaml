      # WHY it is protected at all: status.${DOMAIN} is on the EXTERNAL gateway
      # and gatus ships with security: null. Its public API was serving 46
      # auto-discovered endpoints - including an 'internal' group naming lldap,
      # headlamp, pgadmin and 24 more - plus SECRET_NAS_NAME, which is a SOPS
      # secret everywhere else in this repo. That is a public map of the
      # homelab, so the leak is the reason, not "it is an ops tool".
      #
      # Accepted trade-off: gatus also monitors authelia, so if authelia is down
      # the page that would say so is unreachable. Break-glass is Pushover,
