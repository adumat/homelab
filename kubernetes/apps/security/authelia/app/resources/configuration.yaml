---
# Authelia configuration.
#
# Two substitution mechanisms operate on this file at different times and do not
# collide: Flux replaces ${DOMAIN} when applying the ConfigMap, then Authelia's
# template filter (X_AUTHELIA_CONFIG_FILTERS=template) resolves the secret
# function calls below, reading each value from a mounted file at startup.
#
# CAUTION: the template filter processes this ENTIRE FILE, comments included.
# Never write example Go-template syntax in a comment here - it will be
# executed, and a bad call makes the whole config fail to render, producing a
# misleading cascade of "option is required" errors for unrelated sections.
theme: auto

server:
  address: 'tcp://0.0.0.0:9091'
  endpoints:
    # ⚠️ Authelia's rate limiter is anchored to the REMOTE IP, and that
    # assumption breaks completely behind Envoy Gateway: every token request in
    # the cluster arrives from one of the two envoy-internal pod IPs, so all 17
    # OIDC apps and every device share a single bucket per replica. The
    # defaults (30/1m, 40/2m, 50/10m, 100/1h) are sized for one user per IP.
    #
    # Diagnosed 2026-08-24: 794 token requests over ~7h from 10.42.0.70 and
    # 10.42.1.14 - 620 rejected 429, 162 rejected 400, only 12 succeeded.
    # Authelia logged "Rate Limit Exceeded" on bucket 4 with a delay of ~967s.
    # The user-visible symptom is NOT a slow app: a fresh login completes at the
    # portal, Envoy calls /oauth2/callback, and the code exchange is refused
    # with 429, so the session is never established and the login prompt
    # returns. It looks like "it asks me to approve every time".
    #
    # Raised ~10x rather than disabled: the limit still caps a genuine
    # brute-force against the token endpoint, and these are confidential
    # clients with 72-char secrets plus PKCE. userinfo is raised for the same
    # topology reason before it bites too.
    # Raised ~20x more (2026-08-26): the 10x values still saturated. A dead
    # refresh-token replay (Envoy session whose cookie holds a token Authelia
    # rotated/expired) pecks /api/oidc/token at up to ~1080/hr, which alone
    # exceeds the old 1000/hr 1-hour bucket -> the limiter fills -> refresh
    # failures return 429 instead of `invalid_grant`, so Envoy treats them as
    # transient and never clears the dead session, and EVERY OIDC app 429s
    # (the limiter is keyed by the shared envoy-internal pod IP). The ceiling
    # must sit above any realistic replay so `invalid_grant` always gets
    # through (Envoy can then self-clear) and one broken session can't down all
    # apps. Still capped (not disabled): confidential clients, 72-char secrets,
    # PKCE. Durable cure for token *death* (refresh rotation grace) is separate.
    rate_limits:
      openid_connect_token:
        enable: true
        buckets:
          - period: '1 minute'
            requests: 6000
          - period: '2 minutes'
            requests: 8000
          - period: '10 minutes'
            requests: 10000
          - period: '1 hour'
            requests: 20000
      openid_connect_userinfo:
        enable: true
        buckets:
          - period: '1 minute'
            requests: 6000
          - period: '2 minutes'
            requests: 8000
          - period: '10 minutes'
            requests: 10000
          - period: '1 hour'
            requests: 20000

log:
  level: 'info'
  format: 'json'

telemetry:
  metrics:
    enabled: true
    address: 'tcp://0.0.0.0:9959'

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/secrets/authelia/IDENTITY_VALIDATION_JWT_SECRET" }}'

# Users live in LLDAP, not here. The bind account belongs to
# lldap_password_manager rather than lldap_strict_readonly, which is what makes
# password_change and password_reset work - the self-service capability that
# justified adding LLDAP. With only strict_readonly, logins succeed but reset
# fails silently and nobody can onboard.
authentication_backend:
  refresh_interval: '1m'
  password_reset:
    disable: false
  password_change:
    disable: false
  ldap:
    # Built-in preset: users_filter, groups_filter and attribute mappings all
    # come from it. Overriding them by hand is how you get "user not found"
    # against a directory that is perfectly healthy.
    implementation: 'lldap'
    address: 'ldap://lldap.security.svc.cluster.local:3890'
    base_dn: 'dc=homelab,dc=internal'
    user: 'uid=authelia,ou=people,dc=homelab,dc=internal'
    password: '{{ secret "/secrets/authelia/LDAP_BIND_PASSWORD" }}'

webauthn:
  disable: false
  # Passkey as a first factor.
  enable_passkey_login: true
  # Lets a passkey that reports successful user verification satisfy a
  # two_factor policy. Without this, Authelia counts ANY passkey as a single
  # factor, so the two_factor admin policy below would reject a passkey-only
  # sign-in and force password+TOTP - refusing the strongest credential exactly
  # where it matters most (headlamp maps admins to cluster-admin).
  #
  # Security is not weakened by trusting the passkey here: Authelia checks the
  # actual UV result, so a passkey used WITHOUT user verification still counts
  # as one factor and falls back to a TOTP prompt. user_verification is left at
  # its 'preferred' default for that reason - the fallback is graceful, and
  # requiring UV would break authenticators that cannot perform it.
  #
  # UPSTREAM WARNS THIS IS UNSUPPORTED AND WILL BE REPLACED by per-method
  # policies in access control (~4.41, the AMR work), and that the option will
  # then cause a STARTUP FAILURE. That is why the deployment uses RollingUpdate
  # rather than app-template's default Recreate: a config Authelia refuses now
  # leaves the old pod serving instead of taking every OIDC app down. When AMR
  # lands, delete this option and express it as a per-method policy instead.
  experimental_enable_passkey_uv_two_factors: true
  display_name: 'Homelab'
  timeout: '60 seconds'

totp:
  disable: false
  issuer: '${DOMAIN}'

session:
  secret: '{{ secret "/secrets/authelia/SESSION_SECRET" }}'
  expiration: '12 hours'
  inactivity: '2 hours'
  remember_me: '1 month'
  cookies:
    # Bare ${DOMAIN}, not auth.${DOMAIN}, so the cookie is valid across all
    # subdomains.
    - domain: '${DOMAIN}'
      # Paired with hostnames in httproute.yaml - change both together.
      authelia_url: 'https://auth.${DOMAIN}'
      default_redirection_url: 'https://home.${DOMAIN}'
  redis:
    host: 'dragonfly.database.svc.cluster.local'
    port: 6379
    # Authentik holds db 3; 4 is unused. Distinct indexes are required for the
    # parallel-run rehearsal.
    database_index: 4

storage:
  encryption_key: '{{ secret "/secrets/authelia/STORAGE_ENCRYPTION_KEY" }}'
  postgres:
    address: 'tcp://cluster18-rw.database.svc.cluster.local:5432'
    database: 'authelia'
    schema: 'public'
    username: '{{ secret "/secrets/authelia/POSTGRES_USER" }}'
    password: '{{ secret "/secrets/authelia/POSTGRES_PASSWORD" }}'

# sender MUST use @${DOMAIN}: the maddy relay rejects any other envelope-from
# with "554 local policy". Password reset is the onboarding path, so a broken
# notifier means nobody can onboard.
notifier:
  disable_startup_check: false
  smtp:
    address: 'smtp://smtp-relay.services.svc.cluster.local:25'
    sender: 'Authelia <authelia@${DOMAIN}>'
    disable_require_tls: true

# Authelia checks time sync against an external NTP server at startup by
# default, which needs outbound UDP/123 and makes startup depend on internet
# egress. Talos already synchronises time at the node level, so the pod inherits
# correct time and this check adds a failure mode for no benefit. Left enabled it
# aborts startup with only an opaque "Errors occurred performing startup checks".
ntp:
  disable_startup_check: true

access_control:
  default_policy: 'one_factor'
  rules:
    # WORKAROUND for authelia/authelia#9664: Authelia hides credential enrolment
    # (passkeys, TOTP) entirely unless at least one access_control rule requires
    # two_factor, showing "There are no protected applications that require a
    # second factor method". Without a rule here, no passkey can ever be
    # registered - a chicken-and-egg, since one_factor was chosen precisely so a
    # passkey can satisfy login on its own.
    #
    # THIS RULE IS INERT IN PRACTICE. Nothing in this deployment uses Authelia's
    # forward-auth: every app authenticates via OIDC, which consults
    # identity_providers.oidc.authorization_policies instead of these rules. So
    # this does NOT currently protect lldap - that host is reachable only on the
    # internal gateway, which is its actual control. It is pointed at lldap
    # because that is the most sensitive surface, so if it is ever placed behind
    # forward-auth the policy is already the right one.
    #
    # Still needed even though the OIDC admin policy is now two_factor: #9664 is
    # specifically about access_control rules, so the enrolment UI keys off this
    # rule, not off authorization_policies. Revisit when AMR lands (~4.41).
    - domain: 'lldap.${DOMAIN}'
      policy: 'two_factor'

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/secrets/authelia/OIDC_HMAC_SECRET" }}'
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: |
          {{ secret "/secrets/authelia/OIDC_ISSUER_PRIVATE_KEY" | mindent 10 "|" | msquote }}

    # Authelia's default refresh_token lifespan is 1h30m, which is why a
    # long-running page gets bounced back to the login screen. peekaboo is a baby
    # monitor left open for hours, so it gets a profile with a long refresh token;
    # the access and ID tokens stay short-lived, and Envoy silently exchanges the
    # refresh token in the background.
    lifespans:
      custom:
        long_session:
          access_token: '1 hour'
          id_token: '1 hour'
          authorize_code: '1 minute'
          refresh_token: '3 months'
        # ⚠️ INVARIANT: this refresh_token MUST exceed
        # components/oidc-auth's defaultRefreshTokenTTL (168h / 1 week).
        #
        # Envoy keeps its refresh cookie for that TTL and replays it until it
        # expires. With Authelia's DEFAULT 1h30m lifespan the token dies first,
        # and Envoy then retries the refresh in a loop instead of restarting the
        # login flow. Those retries trip Authelia's per-IP rate limiter on
        # /api/oidc/token, which breaks FRESH logins for every app behind the
        # same Envoy replica - the failure looks like one app's login being
        # broken while the gateway still returns a correct 302.
        #
        # Diagnosed 2026-08-24: an expired token from 10:37:32 was replayed for
        # hours, backoff reached ~500s, and kapowarr could not complete a login.
        # Restarting envoy-internal does NOT fix it: the state is the client's
        # cookie, so a fresh replica replays the same token.
        #
        # 2 weeks, not long_session's 3 months: it clears 168h with margin
        # without handing admin-tier tools a quarter-long refresh token.
        envoy_session:
          access_token: '1 hour'
          id_token: '1 hour'
          authorize_code: '1 minute'
          refresh_token: '2 weeks'

    # OCIS web is a browser SPA: it is a public PKCE client, so the token exchange
    # happens in JavaScript from https://files.${DOMAIN} against this issuer -
    # cross-origin. Authelia adds CORS headers to NO OIDC endpoint by default, so
    # the preflight for POST /api/oidc/token came back with
    # access-control-allow-methods but no access-control-allow-origin and the
    # browser refused to send the request. The SPA then sat on "Logging you in"
    # forever, and Authelia logged nothing at all because the request never
    # arrived. Discovery worked throughout - that endpoint sends
    # access-control-allow-origin: * unconditionally - which is what made this
    # look like an OCIS bug.
    #
    # Authentik sent permissive CORS headers, so this was invisible before.
    #
    # Origins are listed explicitly rather than using
    # allowed_origins_from_client_redirect_uris, which would also admit the
    # http://127.0.0.1/ and http://localhost/ URIs of the OCIS desktop client.
    cors:
      endpoints:
        - 'authorization'
        - 'token'
        - 'revocation'
        - 'introspection'
        - 'userinfo'
      allowed_origins:
        - 'https://files.${DOMAIN}'

    # Three tiers, three policies, covering every app across both phases. New
    # apps pick a policy; no new groups are ever needed.
    authorization_policies:
      # two_factor, unlike the other two tiers: this gate covers headlamp, which
      # maps admins to cluster-admin, so a single factor reaching it was too
      # weak. Paired with experimental_enable_passkey_uv_two_factors above, a
      # user-verified passkey satisfies this on its own - the prompt only appears
      # on the password path, which then also needs TOTP. Enrol both a passkey
      # and TOTP before joining admins, or you will lock yourself out of this
      # tier.
      admin:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: ['group:admins']
      household:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: ['group:users']
      # Must admit BOTH tiers. Matching only external_users would deny matteo
      # and elisa, since neither is a guest. Named for the resource set shared
      # with guests, not for the audience.
      shared:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: ['group:users', 'group:external_users']

    claims_policies:
      # kube-apiserver validates the ID token and CANNOT call userinfo, so groups
      # must be forced into the ID token for Headlamp. Authelia warns this is an
      # escape hatch; here there is genuinely no other delivery path.
      headlamp:
        id_token: ['groups', 'email', 'preferred_username']
        # Also in the access token: an RFC9068 JWT access token otherwise carries
        # only sub/aud/iss/scope/client_id, so anything reading identity from it
        # sees no groups and kube-apiserver matches nothing against the
        # oidc-headlamp-cluster-admin binding - authenticated but no permissions.
        access_token: ['groups', 'email', 'preferred_username']

      # Authelia deliberately keeps ID tokens minimal, putting most claims only at
      # userinfo. Several apps read identity straight from the ID token and fail
      # outright without these:
      #   romm     -> {"detail":"Email is missing from token."}
      #   grafana  -> "Failed to create user: user not found", because Authelia
      #               issues OPAQUE access tokens (authelia_at_...) so Grafana
      #               cannot parse claims out of them either
      # Authentik included these by default, which is why nothing surfaced before.
      standard:
        id_token: ['email', 'email_verified', 'alt_emails', 'groups', 'preferred_username', 'name']
        # Grafana reads identity from the ACCESS token. Making it a JWT was only
        # half the fix: an RFC9068 access token carries sub/aud/iss/scope but no
        # email or username, so Grafana found neither and reported
        # "Failed to create user: user not found" - it cannot create an account
        # with no login and no email.
        access_token: ['email', 'email_verified', 'alt_emails', 'groups', 'preferred_username', 'name']

    clients:
      # ---------- Envoy Gateway SecurityPolicy apps ----------
      - client_id: 'sonarr'
        client_name: 'Sonarr'
        client_secret: '{{ secret "/secrets/oidc/sonarr" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://sonarr.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      - client_id: 'radarr'
        client_name: 'Radarr'
        client_secret: '{{ secret "/secrets/oidc/radarr" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://radarr.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      - client_id: 'prowlarr'
        client_name: 'Prowlarr'
        client_secret: '{{ secret "/secrets/oidc/prowlarr" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://prowlarr.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      - client_id: 'qbittorrent'
        client_name: 'qBittorrent'
        client_secret: '{{ secret "/secrets/oidc/qbittorrent" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://qb.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      - client_id: 'pyload-ng'
        client_name: 'pyLoad-NG'
        client_secret: '{{ secret "/secrets/oidc/pyload-ng" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://pyload.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # metube is household: grabbing a video is useful to a household member,
      # unlike the indexer/torrent stack.
      - client_id: 'metube'
        client_name: 'MeTube'
        client_secret: '{{ secret "/secrets/oidc/metube" }}'
        public: false
        authorization_policy: 'household'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://metube.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # peekaboo is a baby monitor: the page is left open for hours and must not
      # bounce to a login screen mid-watch. It gets the long_session profile (3
      # month refresh token) and Envoy refreshes in the background, so the access
      # and ID tokens stay short-lived. Losing this session is not a security
      # event worth a re-login, and household is the least sensitive tier.
      - client_id: 'peekaboo'
        client_name: 'Peekaboo'
        client_secret: '{{ secret "/secrets/oidc/peekaboo" }}'
        public: false
        authorization_policy: 'household'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'long_session'
        redirect_uris:
          - 'https://peekaboo.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # ---------- Phase 2 Plan A: internal admin apps ----------
      - client_id: 'kopia'
        client_name: 'Kopia'
        client_secret: '{{ secret "/secrets/oidc/kopia" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://kopia.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # it-tools is household, not admin: it is a bag of offline utilities
      # (hashing, base64, cron parsing) with access to nothing.
      - client_id: 'it-tools'
        client_name: 'IT Tools'
        client_secret: '{{ secret "/secrets/oidc/it-tools" }}'
        public: false
        authorization_policy: 'household'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://it-tools.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # n8n's own SSO is an enterprise feature, so the community edition is
      # protected at the gateway by the oidc-auth component like it-tools.
      # 'admin' rather than 'household': a workflow engine holds credentials for
      # everything it automates and can execute arbitrary code.
      - client_id: 'n8n'
        client_name: 'n8n'
        client_secret: '{{ secret "/secrets/oidc/n8n" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://n8n.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # client_id is esp-home (the app and route name); the host is esphome.
      - client_id: 'esp-home'
        client_name: 'ESPHome'
        client_secret: '{{ secret "/secrets/oidc/esp-home" }}'
        public: false
        authorization_policy: 'admin'
        require_pkce: true
        pkce_challenge_method: 'S256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        lifespan: 'envoy_session'
        redirect_uris:
          - 'https://esphome.${DOMAIN}/oauth2/callback'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        userinfo_signed_response_alg: 'none'
