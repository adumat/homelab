      # ---------- Native OIDC apps ----------
      - client_id: 'grafana'
        client_name: 'Grafana'
        client_secret: '{{ secret "/secrets/oidc/grafana" }}'
        public: false
        authorization_policy: 'admin'
        claims_policy: 'standard'
        # Grafana reads claims from the ACCESS token, not the ID token, so the
        # claims policy above was never enough:
        #   "Error retrieving access token payload ... token is not in JWT format:
        #    authelia_at_..."   then   "unable to create user: user not found"
        # Authelia issues opaque access tokens by default; RS256 makes them JWTs
        # per RFC9068 so Grafana can actually read them.
        access_token_signed_response_alg: 'RS256'
        # Without refresh_token in grant_types Authelia issues no refresh token,
        # which Grafana warns about ("No refresh token available with
        # use_refresh_token enabled") even though offline_access is requested.
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://grafana.${DOMAIN}/login/generic_oauth'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      - client_id: 'headlamp'
        client_name: 'Headlamp'
        client_secret: '{{ secret "/secrets/oidc/headlamp" }}'
        public: false
        authorization_policy: 'admin'
        claims_policy: 'headlamp'
        # Headlamp sends its credentials in the POST body. Authelia defaults
        # confidential clients to client_secret_basic and rejects anything else:
        #   invalid_client ... "'token_endpoint_auth_method' method
        #   'client_secret_post', however the OAuth 2.0 client registration does
        #   not allow this method"
        token_endpoint_auth_method: 'client_secret_post'
        # Headlamp obtains an authorization code but then fails the exchange with
        # invalid_grant, which is what Authelia returns when the code_verifier does
        # not match the challenge. Its Go oauth2 client does not complete the PKCE
        # handshake. Confidential client with a 72-char secret sent via
        # client_secret_post, so the exchange remains authenticated.
        require_pkce: false
        # Headlamp authenticates but shows no permissions, which is what happens
        # when kube-apiserver accepts the token yet finds no groups to match
        # against the oidc-headlamp-cluster-admin binding. A JWT access token
        # carries the claims wherever Headlamp chooses to read them from, and
        # refresh_token stops the post-login refresh failing.
        access_token_signed_response_alg: 'RS256'
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        redirect_uris:
          - 'https://gitops.${DOMAIN}/oidc-callback'
        scopes: ['openid', 'email', 'profile', 'groups', 'offline_access']
        userinfo_signed_response_alg: 'none'
        # NOT 'implicit': Authelia forces explicit consent whenever a
        # refresh token will be granted, i.e. for any client requesting
        # offline_access, so implicit was silently ignored and every app
        # re-prompted on each login. pre-configured remembers it instead.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'

      # The /accounts/oidc/authentik/ path segment is django-allauth's provider
