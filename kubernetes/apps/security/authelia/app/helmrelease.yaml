---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      authelia:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: authelia-secret
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.20
            env:
              X_AUTHELIA_CONFIG: /config/configuration.yaml
              # Enables Go templating in the config file so {{ secret "..." }}
              # can read mounted files. Without this the placeholders are taken
              # literally and Authelia refuses to start.
              X_AUTHELIA_CONFIG_FILTERS: template
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /api/health, port: &port 9091 }
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests: { cpu: 25m, memory: 96Mi }
              limits: { memory: 256Mi }
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # readOnlyRootFilesystem is deliberately NOT set. Authelia fails
              # its startup checks with a read-only root, reporting only an
              # opaque "Errors occurred performing startup checks" with no
              # error-level log lines. Verified by bisection: capabilities drop
              # and allowPrivilegeEscalation:false are fine on their own, and the
              # read-only rootfs alone reproduces the failure. Mounting /tmp and
              # relocating HOME to writable space did not help, so the exact path
              # it writes was not isolated - relaxing this one control rather than
              # guessing at more mounts. Everything else stays: non-root uid 1000,
              # all capabilities dropped, no privilege escalation.
              #
              # Contrast with LLDAP, where a read-only rootfs WAS kept by
              # bypassing its entrypoint - that failure was a chown, and visible.
    defaultPodOptions:
      # MANDATORY, not an optimisation. Kubernetes injects legacy service-link
      # env vars for every Service in the namespace; because this Service is
      # named "authelia" they arrive prefixed AUTHELIA_, which is Authelia's own
      # configuration env-var prefix. AUTHELIA_PORT=tcp://10.x.x.x:80 is then
      # read as the deprecated 'port' setting and collides with server.address,
      # so Authelia refuses to start with "the deprecated keys and the new key
      # can't both be configured" - reported only as an opaque
      # "Errors occurred performing startup checks".
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: authelia
        ports:
          http:
            port: 80
            targetPort: *port
    persistence:
      config:
        type: configMap
        name: authelia-config
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
      # Mounted as a directory so each key becomes a file the template filter
      # can read via {{ secret "/secrets/authelia/<KEY>" }}.
      secrets:
        type: secret
        name: authelia-secret
        globalMounts:
          - path: /secrets/authelia
            readOnly: true
      digests:
        type: secret
        name: authelia-oidc-digests
        globalMounts:
          - path: /secrets/oidc
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
