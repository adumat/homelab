---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      authelia:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: authelia-secret
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.20
            env:
              X_AUTHELIA_CONFIG: /config/configuration.yaml
              # Enables Go templating in the config file so {{ secret "..." }}
              # can read mounted files. Without this the placeholders are taken
              # literally and Authelia refuses to start.
              X_AUTHELIA_CONFIG_FILTERS: template
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /api/health, port: &port 9091 }
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests: { cpu: 25m, memory: 96Mi }
              limits: { memory: 256Mi }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: authelia
        ports:
          http:
            port: 80
            targetPort: *port
    persistence:
      config:
        type: configMap
        name: authelia-config
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
      # Mounted as a directory so each key becomes a file the template filter
      # can read via {{ secret "/secrets/authelia/<KEY>" }}.
      secrets:
        type: secret
        name: authelia-secret
        globalMounts:
          - path: /secrets/authelia
            readOnly: true
      digests:
        type: secret
        name: authelia-oidc-digests
        globalMounts:
          - path: /secrets/oidc
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
