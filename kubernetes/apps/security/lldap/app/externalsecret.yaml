---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: lldap-secret
    template:
      engineVersion: v2
      data:
        # PostgreSQL init variables
        INIT_POSTGRES_DBNAME: "lldap"
        INIT_POSTGRES_HOST: "cluster18-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .INIT_POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .INIT_POSTGRES_SUPER_PASS }}"

        # LLDAP internals. LLDAP_KEY_SEED derives private key material and must
        # never change once users hold credentials.
        LLDAP_JWT_SECRET: "{{ .LLDAP_JWT_SECRET }}"
        LLDAP_KEY_SEED: "{{ .LLDAP_KEY_SEED }}"
        LLDAP_LDAP_USER_PASS: "{{ .LLDAP_ADMIN_PASSWORD }}"
        LLDAP_DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@cluster18-rw.database.svc.cluster.local:5432/lldap"

        # Consumed by the bootstrap Job to authenticate against LLDAP.
        LLDAP_ADMIN_PASSWORD: "{{ .LLDAP_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: lldap-secret
    - extract:
        key: postgres-superuser-secret
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-bootstrap-users
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: lldap-bootstrap-users
    template:
      engineVersion: v2
      data:
        # Usernames, display names and group membership live in git and are
        # reviewable in a diff. Only email addresses come from Bitwarden,
        # because they are PII and this repo is public.
        #
        # NOTE: no "password" or "password_file" key anywhere below. When both
        # are absent, bootstrap.sh performs no password operation at all, so
        # re-running it never clobbers a credential a user set themselves.
        # That is what lets git own structure while LLDAP owns credentials.
        matteo.json: |
          {
            "id": "matteo",
            "email": "{{ .MATTEO_EMAIL }}",
            "displayName": "Matteo",
            "groups": ["admins", "users", "lldap_admin"]
          }
        elisa.json: |
          {
            "id": "elisa",
            "email": "{{ .ELISA_EMAIL }}",
            "displayName": "Elisa",
            "groups": ["users"]
          }
        giorgio.json: |
          {
            "id": "giorgio",
            "email": "{{ .GIORGIO_EMAIL }}",
            "displayName": "Giorgio",
            "groups": ["external_users"]
          }
        # Authelia's bind account. lldap_password_manager (not
        # lldap_strict_readonly) is what enables password change and reset.
        authelia.json: |
          {
            "id": "authelia",
            "email": "authelia@${DOMAIN}",
            "displayName": "Authelia Bind User",
            "groups": ["lldap_password_manager"]
          }
  dataFrom:
    - extract:
        key: lldap-users
