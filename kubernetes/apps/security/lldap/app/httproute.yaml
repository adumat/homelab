---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/name: LLDAP
    gethomepage.dev/icon: ldap.png
    gethomepage.dev/description: User Directory
spec:
  # Internal gateway only: this UI can change anyone's password.
  hostnames:
    - lldap.${DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: lldap
          port: 17170
      matches:
        - path:
            type: PathPrefix
            value: /
