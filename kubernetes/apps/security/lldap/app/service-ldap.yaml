---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/service-v1.json
# A hand-written Service rather than a second entry in app-template's `service:`
# block. Adding a second service there renames the primary one from `lldap` to
# `lldap-app`, which silently breaks every consumer of
# lldap.security.svc.cluster.local — Authelia's LDAP bind and this chart's own
# bootstrap CronJob. Declaring it here keeps app-template with exactly one
# service, so that name is stable.
#
# Publishes 3890 ONLY. The app service also carries 17170, the admin web UI,
# whose only protection is Authelia in front of the HTTPRoute; a LAN address on
# that port would bypass authentication entirely.
apiVersion: v1
kind: Service
metadata:
  name: lldap-ldap
  annotations:
    lbipam.cilium.io/ips: "10.1.11.7"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/controller: lldap
    app.kubernetes.io/instance: lldap
    app.kubernetes.io/name: lldap
  ports:
    - name: ldap
      port: 3890
      targetPort: 3890
      protocol: TCP
