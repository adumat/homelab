---
# Talos materialises a Secret of the same name holding the talosconfig, and
# rotates it itself: no hand-generated credential, no Bitwarden entry.
#
# os:operator, not os:reader: the latter cannot `image pull`, it returns
# PermissionDenied. Both this role and this namespace must appear in the
# allow-lists in talos/patches/controller/talos-api-access.yaml, otherwise no
# Secret is ever minted and the only sign is status.failureReason on this object.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: homelab-runner-talos
spec:
  roles:
    - os:operator
