---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: miroir
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Pinned by hand to the last 0.11.x, NOT the newest. Renovate only ever
    # offers the latest, and that is 0.12.0 - BREAKING (CSI spec v1.13.0,
    # VolumeHealth, k8s v0.37.0), PR #498. This takes 0.11.23's "never let
    # staging reformat a device that carries a filesystem" (upstream #445,
    # closing "Miroir formats volumes unexpectedly" #444) plus 0.11.24's
    # teardown-deadlock fixes, without the breaking change.
    tag: 0.11.24
  url: oci://ghcr.io/home-operations/charts/miroir
