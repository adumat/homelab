---
title: HVAC
views:
  - title: HVAC
    path: hvac
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status
            icon: mdi:heat-pump
            badges:
              - type: entity
                entity: binary_sensor.hvac_controller_status
                show_state: true
          - type: tile
            entity: binary_sensor.hvac_controller_compressore_in_funzione
            name: Compressor
            color: orange
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_frequenza_compressore
            name: Frequency
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_chiamata_caldaia_da_confermare
            name: Boiler Call (unconfirmed)
            icon: mdi:water-boiler
            color: deep-orange
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_riscaldamento_impianto
            name: Plant Heating
            icon: mdi:radiator
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_sanitario_in_corso
            name: Hot Water Cycle
            icon: mdi:water-thermometer
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_valvola_sanitario
            name: DHW Valve
            icon: mdi:valve
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_modalita_macchina
            name: Machine Mode
            grid_options:
              columns: 12
          - type: tile
            entity: binary_sensor.hvac_controller_allarme_attivo
            name: Alarm
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_allarmi
            name: Alarm Codes
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_sbrinamento_in_corso
            name: Defrost
            color: cyan
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_antilegionella_in_corso
            name: Anti-Legionella
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_ore_funzionamento_compressore
            name: Compressor Hours
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Controls
            icon: mdi:tune-variant
          - type: tile
            entity: select.hvac_controller_pdc_modalita_stagione
            name: Season Mode
            features:
              - type: select-options
          - type: tile
            entity: switch.hvac_controller_command_heatcool
            name: Heat/Cool Demand
            color: red
            features:
              - type: toggle
          - type: tile
            entity: input_number.hvac_run_time
            name: Auto Off After
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 6
          - type: tile
            entity: timer.hvac_auto_off
            name: Auto Off In
            color: deep-orange
            grid_options:
              columns: 6
          - type: tile
            entity: switch.hvac_controller_pump_gf
            name: Pump GF
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: switch.hvac_controller_pump_1f
            name: Pump 1F
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: switch.hvac_controller_pump_radiator
            name: Radiator
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: switch.hvac_controller_fancoil_gf
            name: Fancoil GF
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: switch.hvac_controller_fancoil_1f
            name: Fancoil 1F
            color: amber
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Temperatures
            icon: mdi:thermometer
          - type: tile
            entity: sensor.hvac_controller_t05_temperatura_aria_esterna
            name: Outdoor
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_t06_temperatura_sonda_sanitaria
            name: Hot Water
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_t01_temperatura_acqua_in_ingresso
            name: Water In (T01)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_t02_temperatura_acqua_in_uscita
            name: Water Out (T02)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_t07_temperatura_sonda_remota_impianto
            name: System Probe (T07)
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.hvac_controller_t03_temperatura_aspirazione_compressore
            name: Suction (T03)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_t04_temperatura_scarico_compressore
            name: Discharge (T04)
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Refrigerant Circuit
            icon: mdi:snowflake-thermometer
          - type: tile
            entity: sensor.hvac_controller_pressione_di_alta
            name: High Pressure
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_pressione_di_bassa
            name: Low Pressure
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_temperatura_condensazione
            name: Condensing
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_temperatura_evaporazione
            name: Evaporating
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_ventilatore_condensazione
            name: Fan
            features:
              - type: bar-gauge
                min: 0
                max: 100
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_circolatore
            name: Circulator
            features:
              - type: bar-gauge
                min: 0
                max: 100
            grid_options:
              columns: 6

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-line
          - type: history-graph
            title: Water Circuit (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.hvac_controller_t01_temperatura_acqua_in_ingresso
                name: Water In
              - entity: sensor.hvac_controller_t02_temperatura_acqua_in_uscita
                name: Water Out
              - entity: sensor.hvac_controller_t07_temperatura_sonda_remota_impianto
                name: System Probe
              - entity: sensor.hvac_controller_t06_temperatura_sonda_sanitaria
                name: Hot Water
              - entity: sensor.hvac_controller_t05_temperatura_aria_esterna
                name: Outdoor
            grid_options:
              columns: full
          - type: history-graph
            title: Generators (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.hvac_controller_frequenza_compressore
                name: Frequency
              - entity: switch.hvac_controller_command_heatcool
                name: Heat/Cool Demand
              - entity: binary_sensor.hvac_controller_compressore_in_funzione
                name: Compressor
              - entity: binary_sensor.hvac_controller_chiamata_caldaia_da_confermare
                name: Boiler Call
              - entity: binary_sensor.hvac_controller_riscaldamento_impianto
                name: Plant Heating
              - entity: binary_sensor.hvac_controller_sanitario_in_corso
                name: Hot Water Cycle
              - entity: binary_sensor.hvac_controller_sbrinamento_in_corso
                name: Defrost
            grid_options:
              columns: full
          - type: statistics-graph
            title: Temperatures (7 days)
            days_to_show: 7
            chart_type: line
            stat_types:
              - mean
              - min
              - max
            entities:
              - entity: sensor.hvac_controller_t05_temperatura_aria_esterna
                name: Outdoor
              - entity: sensor.hvac_controller_t01_temperatura_acqua_in_ingresso
                name: Water In
              - entity: sensor.hvac_controller_t02_temperatura_acqua_in_uscita
                name: Water Out
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Targets
            icon: mdi:target
          - type: tile
            entity: number.hvac_controller_heat_temperature_target
            name: Heat
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.hvac_controller_cool_temperature_target
            name: Cool
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.hvac_controller_sanitary_temperature_target
            name: Hot Water
            features:
              - type: numeric-input
                style: buttons
          - type: heading
            heading: Computed
            heading_style: subtitle
          - type: tile
            entity: sensor.pdc_r22_target
            name: R22
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.pdc_r28_target
            name: R28
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.pdc_r37_target
            name: R37
            grid_options:
              columns: 4

      - type: grid
        cards:
          - type: heading
            heading: Boiler Parameters
            icon: mdi:water-boiler
          - type: entities
            entities:
              - entity: number.hvac_controller_r08_fascia_solo_cal
                name: R08 Boiler-Only Band
              - entity: number.hvac_controller_r10_caldaia_supporto_heat
                name: R10 Boiler Support (Heat)
              - entity: number.hvac_controller_r12_ritardo_r10
                name: R12 Delay R10
              - entity: number.hvac_controller_r15_caldaia_supporto_sanitary
                name: R15 Boiler Support (Hot Water)
              - entity: number.hvac_controller_r16_ritardo_r15
                name: R16 Delay R15
              - entity: number.hvac_controller_r22_fascia_solo_pdc
                name: R22 Heat-Pump-Only Band
              - entity: number.hvac_controller_r23_caldaia_a_supporto_heat_4_sanitary_6
                name: R23 Boiler Support Mode
              - entity: number.hvac_controller_r28_metti_r08
                name: R28 = R08
              - entity: number.hvac_controller_r37
                name: R37

      - type: grid
        cards:
          - type: heading
            heading: Schedule
            icon: mdi:calendar-clock
          - type: entities
            show_header_toggle: false
            entities:
              - entity: automation.on_2_30
                name: "On @ 2:30"
              - entity: automation.off_heat_03_30
                name: "Off @ 3:30"
              - entity: automation.heat_on_4_30
                name: "Heat On @ 4:30"
              - entity: automation.off_6_30
                name: "Off @ 7:00"
              - entity: automation.off_00
                name: "Off @ 0:00"

      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            icon: mdi:stethoscope
          - type: tile
            entity: sensor.hvac_controller_codice_stato_macchina
            name: State Code
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hvac_controller_uscite_digitali_raw
            name: Digital Outputs
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_sbrinamento_richiesto
            name: Defrost Requested
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_antilegionella_fallita
            name: Anti-Legionella Failed
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.hvac_controller_secondo_setpoint_attivo
            name: Second Setpoint
            grid_options:
              columns: 12
          - type: history-graph
            title: Outputs vs State (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.hvac_controller_uscite_digitali_raw
                name: Digital Outputs
              - entity: sensor.hvac_controller_codice_stato_macchina
                name: State Code
          - type: tile
            entity: button.hvac_controller_restart
            name: Restart
            grid_options:
              columns: 6
          - type: tile
            entity: button.hvac_controller_safe_mode
            name: Safe Mode
            grid_options:
              columns: 6
