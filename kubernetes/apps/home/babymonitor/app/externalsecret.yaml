---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: babymonitor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: babymonitor-secret
    template:
      data:
        icecast.xml: |
          <icecast>
            <limits>
              <clients>20</clients>
              <sources>4</sources>
              <queue-size>65536</queue-size>
              <burst-size>16384</burst-size>
            </limits>
            <authentication>
              <source-password>{{ .ICECAST_SOURCE_PASSWORD }}</source-password>
              <admin-user>admin</admin-user>
              <admin-password>{{ .ICECAST_ADMIN_PASSWORD }}</admin-password>
            </authentication>
            <hostname>monitor.${DOMAIN}</hostname>
            <listen-socket><port>8000</port></listen-socket>
            <fileserve>0</fileserve>
            <paths>
              <logdir>/tmp</logdir>
              <webroot>/usr/share/icecast/web</webroot>
              <adminroot>/usr/share/icecast/admin</adminroot>
            </paths>
            <logging>
              <loglevel>2</loglevel>
              <logsize>1024</logsize>
            </logging>
          </icecast>
        ICECAST_SOURCE_PASSWORD: '{{ .ICECAST_SOURCE_PASSWORD }}'
  dataFrom:
    - extract:
        key: babymonitor-secret
