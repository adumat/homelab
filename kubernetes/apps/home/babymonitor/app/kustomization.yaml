---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: babymonitor-nginx
    files:
      - nginx.conf=./resources/nginx.conf
  - name: babymonitor-pwa
    files:
      - index.html=./resources/pwa/index.html
  - name: babymonitor-ffmpeg
    files:
      - ffmpeg-supervise.sh=./resources/ffmpeg-supervise.sh
generatorOptions:
  disableNameSuffixHash: true
