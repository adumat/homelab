---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app babymonitor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      babymonitor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          web:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.27-alpine
            command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: &webport 8080 }
                  periodSeconds: 10
              readiness: *probes
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http: { port: *webport }
    route:
      app:
        hostnames: ["monitor.${DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{ identifier: app, port: *webport }]
    persistence:
      nginx-conf:
        type: configMap
        name: babymonitor-nginx
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      www:
        type: configMap
        name: babymonitor-pwa
        advancedMounts:
          babymonitor:
            web:
              - path: /www
      nginx-cache:
        type: emptyDir
        advancedMounts:
          babymonitor:
            web:
              - path: /tmp
