---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app babymonitor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      babymonitor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          web:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.27-alpine
            command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: &webport 8080 }
                  periodSeconds: 10
              readiness: *probes
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          icecast:
            image:
              repository: docker.io/libretime/icecast
              tag: latest
            # NOTE: this image's binary is `icecast` (not `icecast2`) at /usr/bin/icecast
            command: ["icecast", "-c", "/etc/icecast.xml"]
            probes:
              liveness: &icy
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8000 }
                  periodSeconds: 15
              readiness: *icy
            resources:
              requests: { cpu: 25m, memory: 32Mi }
              limits: { memory: 128Mi }
            securityContext: *sec
          ffmpeg:
            image:
              repository: docker.io/jrottenberg/ffmpeg
              tag: 7.1-alpine
            command: ["/bin/sh", "/scripts/ffmpeg-supervise.sh"]
            env:
              ICECAST_SOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: babymonitor-secret
                    key: ICECAST_SOURCE_PASSWORD
            resources:
              requests: { cpu: 200m, memory: 64Mi }
              limits: { memory: 256Mi }
            securityContext: *sec
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http: { port: *webport }
    route:
      app:
        hostnames: ["monitor.${DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{ identifier: app, port: *webport }]
    persistence:
      nginx-conf:
        type: configMap
        name: babymonitor-nginx
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      www:
        type: configMap
        name: babymonitor-pwa
        advancedMounts:
          babymonitor:
            web:
              - path: /www
      nginx-cache:
        type: emptyDir
        advancedMounts:
          babymonitor:
            web:
              - path: /tmp
      icecast-conf:
        type: secret
        name: babymonitor-secret
        advancedMounts:
          babymonitor:
            icecast:
              - path: /etc/icecast.xml
                subPath: icecast.xml
                readOnly: true
      icecast-tmp:
        type: emptyDir
        advancedMounts:
          babymonitor:
            icecast:
              - path: /tmp
      ffmpeg-script:
        type: configMap
        name: babymonitor-ffmpeg
        advancedMounts:
          babymonitor:
            ffmpeg:
              - path: /scripts
