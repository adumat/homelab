<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <!-- iOS home-screen install -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby Monitor">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Baby Monitor</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee;
           display:flex; flex-direction:column; min-height:100dvh; }
    header { padding:12px 16px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
    header .ver { font-size:12px; font-weight:400; color:#7a7a7a; }
    #video { flex:1; display:grid; gap:8px; padding:0 12px; grid-auto-rows:1fr; }
    #video.side { grid-template-columns:1fr 1fr; }
    #video:empty { display:none; }
    .lbtn { margin-left:8px; border:0; background:#2a2a2a; color:#eee; border-radius:8px; padding:3px 10px; font-size:14px; }
    .tile { position:relative; overflow:hidden; background:#000; border-radius:12px; aspect-ratio:16/9; touch-action:none; }
    .tile iframe { display:block; width:100%; height:100%; border:0;
      transform-origin:center center;
      transform: scale(var(--z,1)) translate(var(--x,0%), var(--y,0%)); }
    .tile .drag { position:absolute; inset:0; z-index:1; }
    .zctl { position:absolute; top:6px; right:6px; display:flex; gap:5px; z-index:2; }
    .zbtn { width:36px; height:36px; border:0; border-radius:9px; background:rgba(0,0,0,.55);
            color:#fff; font-size:18px; line-height:1; }
    .tile .label { position:absolute; left:8px; top:8px; font-size:12px; color:#fff;
      background:rgba(0,0,0,.45); padding:2px 8px; border-radius:8px; z-index:2; }
    .controls { display:flex; gap:10px; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
    button.sbtn { flex:1; padding:20px 0; font-size:18px; border:0; border-radius:14px; background:#2a2a2a; color:#eee; }
    button.sbtn.active { background:#2f7d32; color:#fff; }
    #status { padding:0 16px 8px; font-size:13px; color:#9a9a9a; }
  </style>
</head>
<body>
  <header>
    <span>Baby Monitor <button id="layout" class="lbtn" hidden>⬌</button></span>
    <span class="ver" id="ver"></span>
  </header>
  <div id="video"></div>
  <div id="status">In pausa</div>
  <div class="controls">
    <button class="sbtn" data-stream="both">Entrambe</button>
    <button class="sbtn" data-stream="sofia">Sofia</button>
    <button class="sbtn" data-stream="nicolo">Nicolò</button>
  </div>
  <audio id="au" preload="none"></audio>
  <script src="/version.js"></script>
  <script src="/app.js"></script>
</body>
</html>
