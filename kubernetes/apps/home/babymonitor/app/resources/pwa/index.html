<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Baby Monitor</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee;
           display:flex; flex-direction:column; min-height:100dvh; }
    header { padding:12px 16px; font-weight:600; }
    #video { flex:1; display:grid; gap:8px; padding:0 12px; grid-auto-rows:1fr; }
    #video:empty { display:none; }
    #video iframe, #video video { width:100%; height:100%; background:#000; border-radius:12px; border:0; }
    .controls { display:flex; gap:10px; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
    button { flex:1; padding:20px 0; font-size:18px; border:0; border-radius:14px;
             background:#2a2a2a; color:#eee; }
    button.active { background:#2f7d32; color:#fff; }
    #status { padding:0 16px 8px; font-size:13px; color:#9a9a9a; }
  </style>
</head>
<body>
  <header>Baby Monitor</header>
  <div id="video"></div>
  <div id="status">In pausa</div>
  <div class="controls">
    <button data-stream="both">Entrambe</button>
    <button data-stream="sofia">Sofia</button>
    <button data-stream="nicolo">Nicolò</button>
  </div>
  <audio id="au" preload="none"></audio>
  <script src="/app.js"></script>
</body>
</html>
