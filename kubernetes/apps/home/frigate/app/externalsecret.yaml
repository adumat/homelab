---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: frigate-secrets
    template:
      data:
        FRIGATE_MQTT_USER: '{{ .username }}'
        FRIGATE_MQTT_PASSWORD: '{{ .password }}'
  dataFrom:
    - extract:
        key: mqtt-frigate-secret
