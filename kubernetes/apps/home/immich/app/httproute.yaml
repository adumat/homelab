---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app_name immich-server
  labels:
    k8s-app: *app_name
    app.kubernetes.io/part-of: immich
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Home
    gethomepage.dev/name: Immich
    gethomepage.dev/icon: immich.png
    gethomepage.dev/description: Photo Library
    gethomepage.dev/widget.type: immich
    gethomepage.dev/widget.url: http://immich-server.home.svc.cluster.local:2283
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
    gethomepage.dev/widget.version: "2"
spec:
  hostnames:
    - photos.${DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: *app_name
          port: 2283
      timeouts:
        request: 0s # websocket, never time out
        backendRequest: 0s # websocket, never time out
      matches:
        - path:
            type: PathPrefix
            value: /
