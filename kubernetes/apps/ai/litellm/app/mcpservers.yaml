---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: ha-mcp
spec:
  # litellm hard-rejects '-' in an mcp_servers key ("Server name cannot contain
  # '-'") and exits at startup, so the registered key cannot be the resource
  # name. Kubernetes in turn forbids '_' in a name, so the two can never match:
  # alias is the only way to satisfy both.
  alias: ha_mcp
  # spec.workload, not spec.url: the operator runs the server itself as a
  # Deployment + Service and derives the URL into status.resolvedURL - here
  # http://ha-mcp.ai.svc.cluster.local:8086/mcp. That is the reason this phase
  # uses the operator - no hand-written HelmRelease, Service and HTTPRoute per
  # MCP server. A validating webhook rejects setting both url and workload.
  #
  # Replaces the `uvx mcp-proxy` bridge in the gitignored .mcp.json, which is
  # currently BROKEN: uvx is not on the laptop's PATH.
  workload:
    image: ghcr.io/homeassistant-ai/ha-mcp:4.22.1
    # The image CMD is `fastmcp run fastmcp.json`, which is STDIO mode - it
    # never opens a port. `ha-mcp-web` is the HTTP entrypoint (pyproject
    # [project.scripts]); it binds MCP_HOST=0.0.0.0 on MCP_PORT=8086 and serves
    # MCP_SECRET_PATH=/mcp, which is exactly the operator's derived-url shape.
    command: ["ha-mcp-web"]
    port: 8086
    env:
      # ha-mcp reads HOMEASSISTANT_URL / HOMEASSISTANT_TOKEN, not HA_*.
      - name: HOMEASSISTANT_URL
        value: "http://home-assistant.home.svc.cluster.local:8123"
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: mcp-secrets
            key: HA_TOKEN
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  # See the note on ha-mcp: litellm rejects '-' in the mcp_servers key.
  alias: grafana_mcp
  workload:
    # Docker Hub, NOT ghcr. ghcr.io/grafana/mcp-grafana is a 404 - the only
    # component here not on ghcr, so a cold pull hits Docker Hub rate limits.
    # Spegel and the image-pull workflow mitigate it.
    image: docker.io/grafana/mcp-grafana:1.3.0
    port: 8000
    args:
      # Default transport is stdio and default --address is localhost:8000,
      # so without these the container never serves anything reachable.
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      # v1.3.0 rejects any Host header outside the allowlist with 403, and the
      # allowlist defaults to the loopback variants of --address. The proxy
      # calls the derived Service URL, so that Host has to be allowed.
      - --allowed-hosts
      - grafana-mcp.ai.svc.cluster.local:8000
    env:
      - name: GRAFANA_URL
        value: "http://grafana-service.observability.svc.cluster.local:3000"
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: mcp-secrets
            key: GRAFANA_TOKEN
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: n8n-mcp
spec:
  # See the note on ha-mcp: litellm rejects '-' in the mcp_servers key.
  alias: n8n_mcp
  # n8n-mcp requires a bearer token of its own in http mode - it exits at
  # startup without one. This is NOT n8n's API key; the two are unrelated
  # secrets and both are needed for the full tool set.
  authType: bearer_token
  authTokenRef:
    name: mcp-secrets
    key: N8N_MCP_AUTH_TOKEN
  workload:
    image: ghcr.io/czlonkowski/n8n-mcp:2.77.0
    port: 3000
    env:
      # Default is stdio, which never opens a port.
      - name: MCP_MODE
        value: http
      - name: PORT
        value: "3000"
      - name: AUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: mcp-secrets
            key: N8N_MCP_AUTH_TOKEN
      # Anonymous usage telemetry is ON by default upstream.
      - name: N8N_MCP_TELEMETRY_DISABLED
        value: "true"
      - name: LOG_LEVEL
        value: warn
      # These two add the workflow-MANAGEMENT tools on top of the documentation
      # ones. The internal Service, deliberately: the public host is behind the
      # Authelia SecurityPolicy, which would answer the API with a 302 to the
      # login page rather than JSON.
      - name: N8N_API_URL
        value: "http://n8n.services.svc.cluster.local:5678"
      # Without this every management call fails "SSRF protection: Private IP
      # addresses not allowed" - a ClusterIP is by definition private. It fails
      # in a way that is easy to miss: tools/list still advertises all 28 tools
      # because the count comes from config, and only an actual call errors.
      # Upstream labels permissive "NOT for production", but their threat model
      # is multi-tenant SaaS where a caller supplies the n8n URL; here the URL
      # is fixed above and this server is never exposed outside the cluster.
      # Cloud-metadata endpoints stay blocked in every mode.
      - name: WEBHOOK_SECURITY_MODE
        value: permissive
      # Minted by hand from n8n's UI - there is no API to create an API key, and
      # an owner account has to exist first, so this cannot be provisioned
      # declaratively before n8n's first login.
      - name: N8N_API_KEY
        valueFrom:
          secretKeyRef:
            name: mcp-secrets
            key: N8N_API_KEY
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
