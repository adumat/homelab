---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: mcp-secrets
    template:
      data:
        # Home Assistant long-lived token. Only mintable from the HA profile
        # page - there is no API for it - so a rebuild needs it re-issued.
        HA_TOKEN: '{{ .HA_TOKEN }}'
        # Grafana service account "mcp", role Viewer. Held here rather than in a
        # GrafanaServiceAccount CR because that CR resolves spec.instanceName
        # only within its OWN namespace, so its token Secret would land in
        # observability while this workload runs in ai, with no cross-namespace
        # path to it. Re-mint after a rebuild:
        #   POST /api/serviceaccounts        {"name":"mcp","role":"Viewer"}
        #   POST /api/serviceaccounts/:id/tokens {"name":"mcp"}
        # as admin from grafana-admin-credentials. Requires auth.basic enabled -
        # see the comment on that setting in the Grafana CR.
        GRAFANA_TOKEN: '{{ .GRAFANA_TOKEN }}'
        # n8n-mcp REFUSES to start in http mode without AUTH_TOKEN, and it is
        # the server's own bearer token, unrelated to n8n's API key. Generated
        # here; the gateway presents it via the CR's authTokenRef.
        N8N_MCP_AUTH_TOKEN: '{{ .N8N_MCP_AUTH_TOKEN }}'
        # n8n's own API key, minted from Settings -> n8n API. Unlocks n8n-mcp's
        # workflow-management tools. Lives here rather than in n8n-secret
        # because n8n-mcp is its only consumer, which keeps this a single
        # extract. It is a JWT bound to the n8n instance, so a rebuilt n8n
        # invalidates it and it has to be re-minted.
        N8N_API_KEY: '{{ .N8N_API_KEY }}'
  dataFrom:
    - extract:
        key: mcp-secret
