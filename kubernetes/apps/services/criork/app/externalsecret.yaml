---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: criork
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: criork-secret
    template:
      data:
        CRIORK_ACCESS_CODE: '{{ .CRIORK_ACCESS_CODE }}'
        # The password sits unquoted in a connection string: it must not contain `;`,
        # `=` or quotes. A hex string is safe.
        CRIORK_DATABASE_URL: 'Host=cluster18-rw.database.svc.cluster.local;Database=criork;Username=criork;Password={{ .CRIORK_DB_PASSWORD }}'
        CRIORK_LLM_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: criork-secret
    - extract:
        key: criork-litellm
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: criork-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: criork-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}"}}}'
  dataFrom:
    - extract:
        key: criork-secret
