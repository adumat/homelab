---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: criork
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: criork-secret
    template:
      data:
        CRIORK_ACCESS_CODE: '{{ .CRIORK_ACCESS_CODE }}'
        # The password is hex, so it needs no quoting in the connection string.
        CRIORK_DATABASE_URL: 'Host=cluster18-rw.database.svc.cluster.local;Port=5432;Database=criork;Username={{ .CRIORK_DBUSER }};Password={{ .CRIORK_DBPASS }}'
        CRIORK_LLM_API_KEY: '{{ .LITELLM_API_KEY }}'
        INIT_POSTGRES_DBNAME: criork
        INIT_POSTGRES_HOST: cluster18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: '{{ .CRIORK_DBUSER }}'
        INIT_POSTGRES_PASS: '{{ .CRIORK_DBPASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
  dataFrom:
    - extract:
        key: criork-secret
    - extract:
        key: postgres-superuser-secret
    # The key minted by the LiteLLMVirtualKey `criork` in the ai namespace, copied by
    # hand: there is no cross-namespace secret path. Rotating it means copying again.
    - extract:
        key: criork-litellm
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: criork-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    # The image is private: it carries the cases, answers included.
    name: criork-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    # A read:packages token of the adumat account, kept generic for any private image.
    - extract:
        key: adumat-ghcr
