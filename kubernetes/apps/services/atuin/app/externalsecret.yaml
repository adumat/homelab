---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: atuin-secrets
    template:
      data:
        ATUIN_DB_PASSWORD: '{{ .ATUIN_DB_PASSWORD }}'
        ATUIN_DB_USERNAME: '{{ .ATUIN_DB_USERNAME }}'
        # URI built in-repo (host defined here, creds from Bitwarden) so it can't drift stale.
        # Password is alphanumeric, so no URL-encoding needed.
        ATUIN_DB_URI: 'postgresql://{{ .ATUIN_DB_USERNAME }}:{{ .ATUIN_DB_PASSWORD }}@cluster18-rw.database.svc.cluster.local:5432/atuin'
        INIT_POSTGRES_DBNAME: 'atuin'
        INIT_POSTGRES_HOST: 'cluster18-rw.database.svc.cluster.local'
        INIT_POSTGRES_PASS: '{{ .ATUIN_DB_PASSWORD }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_USER: '{{ .ATUIN_DB_USERNAME }}'
  dataFrom:
    - extract:
        key: atuin-secret
    - extract:
        key: postgres-superuser-secret
