---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: karakeep-secrets
    template:
      data:
        MEILI_ADDR: 'http://karakeep-meilisearch.services.svc.cluster.local:7700'
        MEILI_MASTER_KEY: '{{ .MEILI_MASTER_KEY }}'
        NEXTAUTH_SECRET: '{{ .NEXTAUTH_SECRET }}'
        NEXTAUTH_URL: 'https://karakeep.${DOMAIN}'
        OAUTH_CLIENT_ID: 'karakeep'
        OAUTH_CLIENT_SECRET: '{{ .KARAKEEP_OAUTH_CLIENT_SECRET }}'
        OAUTH_WELLKNOWN_URL: 'https://auth.${DOMAIN}/application/o/karakeep/.well-known/openid-configuration'
        OAUTH_PROVIDER_NAME: 'Authentik'
        OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: 'true'
        OPENAI_API_KEY: '{{ .OPENAI_API_KEY }}'
  dataFrom:
    - extract:
        key: karakeep-secret
    - extract:
        key: authentik-secret
