---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  labels:
    app.kubernetes.io/name: homepage
data:
  bookmarks.yaml: |
    - Communicate:
        - Discord:
            - icon: discord.png
              href: "https://discord.com/app"
    - Media:
        - YouTube:
            - icon: youtube.png
              href: "https://youtube.com/feed/subscriptions"
        - Spotify:
            - icon: spotify.png
              href: "http://open.spotify.com"
        - Reddit:
            - icon: reddit.png
              href: "https://reddit.com"
    - Dev:
        - kubesearch:
            - icon: kubernetes-dashboard.png
              href: "https://kubesearch.dev/"
        - GitHub:
            - icon: github.png
              href: "https://github.com/adumat/homelab"
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
  services.yaml: |
    - Network:
      - Cloudflared:
          href: https://dash.cloudflare.com/
          icon: cloudflare-zero-trust.png
          description: Cloudflare Tunnel
          widget:
            type: cloudflared
            accountid: {{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID}}
            tunnelid: {{HOMEPAGE_VAR_CLOUDFLARED_TUNNELID}}
            key: {{HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN}}
      - Unifi:
          href: https://192.168.1.44:8443
          icon: unifi.png
          description: Network Controller
          widget:
            type: unifi
            url: https://192.168.1.44:8443
            username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
            password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
      - AdGuard:
          href: http://donkey.lan:8080
          icon: adguard-home.png
          description: DNS Filtering
          widget:
            type: adguard
            url: http://donkey.lan:8080
            username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
    - Infrastructure:
      - Unraid:
          href: http://elizabeth.lan
          icon: unraid.png
          description: NAS Storage
          widget:
            type: unraid
            url: http://elizabeth.lan
            key: {{HOMEPAGE_VAR_UNRAID_APIKEY}}
    - Observability:
      - Prometheus:
          href: https://prometheus.${DOMAIN}
          icon: prometheus.png
          description: Metrics Collection
      - Ceph Health:
          icon: mdi-database
          description: Storage Cluster
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: ceph_health_status
            label: Ceph Status
            format:
              type: text
              options:
                map:
                  0: Healthy
                  1: Warning
                  2: Error
      - Active Alerts:
          icon: mdi-alert
          description: Firing Alerts
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: count(ALERTS{alertstate="firing"}) OR vector(0)
            label: Firing Alerts
            format:
              type: number

  settings.yaml: |
    title: Dashboard
    favicon: https://w7.pngwing.com/pngs/848/762/png-transparent-computer-icons-home-house-home-angle-building-rectangle-thumbnail.png
    useEqualHeights: true
    theme: dark
    background:
      image: https://i.imgur.com/oFw7T7g.jpeg
      opacity: 20
    color: slate
    headerStyle: clean
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
    layout:
      Network:
        style: row
        columns: 3
        icon: mdi-network
      Infrastructure:
        style: row
        columns: 2
        icon: mdi-server
      Home:
        style: row
        columns: 4
        icon: mdi-home-analytics
      Media:
        style: row
        columns: 4
        icon: mdi-television-play
      Downloads:
        style: row
        columns: 5
        icon: mdi-download-circle
      Services:
        style: row
        columns: 5
        icon: mdi-tools
      Observability:
        style: row
        columns: 5
        icon: mdi-chart-line
      Database:
        style: row
        columns: 2
        icon: mdi-database
  widgets.yaml: |
    - logo:
        icon: https://sundayguardianlive.com/wp-content/uploads/2020/07/Untitled-design-9.png
    - search:
        provider: [google]
        focus: false
        target: _blank
    - greeting:
        text_size: xl
        text: "Hey Matthew, how are you doing today?"
    - kubernetes:
        cluster:
            cpu: true
            memory: true
            show: true
            showLabel: true
        nodes:
            cpu: true
            memory: true
            show: true
            showLabel: true
    - openmeteo:
        label: Home
        latitude: {{HOMEPAGE_VAR_LATITUDE}}
        longitude: {{HOMEPAGE_VAR_LONGITUDE}}
        timezone: Europe/Rome
        units: metric
        cache: 5
        format:
            maximumFractionDigits: 1
