---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: smtp-relay-secrets
    template:
      data:
        SMTP_DOMAIN: '{{ .SMTP_DOMAIN }}'
        SMTP_RELAY_HOSTNAME: '{{ .SMTP_RELAY_HOSTNAME }}'
        SMTP_RELAY_PASSWORD: '{{ .SMTP_RELAY_PASSWORD }}'
        SMTP_RELAY_SERVER: '{{ .SMTP_RELAY_SERVER }}'
        SMTP_RELAY_USERNAME: '{{ .SMTP_RELAY_USERNAME }}'
  dataFrom:
    - extract:
        key: smtp-relay-secret
