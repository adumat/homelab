---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
  namespace: &namespace services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/oidc-auth
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/services/n8n/app
  dependsOn:
    - name: authelia
      namespace: security
    - name: external-secrets-store
      namespace: security
    - name: cloudnative-pg-cluster
      namespace: database
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substitute:
      APP: *app
      # Both are mandatory for oidc-auth. Flux substitutes an unset variable to
      # an empty string with no error, so omitting OIDC_ROUTE yields an invalid
      # SecurityPolicy that reports success.
      OIDC_ROUTE: *app
      # n8n stores workflows and execution history in Postgres; the PVC holds
      # only ~/.n8n (config, the instance id, and any binary-data spillover).
      KOPIUR_CAPACITY: 2Gi
      CRON_EXPRESSION: '0 4 * * *'
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
