---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: 'true'
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.37.4
            env:
              DB_TYPE: postgresdb
              DB_POSTGRESDB_HOST: cluster18-rw.database.svc.cluster.local
              DB_POSTGRESDB_PORT: '5432'
              DB_POSTGRESDB_DATABASE: n8n
              DB_POSTGRESDB_USER: n8n
              N8N_PORT: &port 5678
              N8N_PROTOCOL: https
              N8N_HOST: n8n.${DOMAIN}
              # n8n builds callback and webhook URLs from this. Left unset it
              # emits http://localhost:5678 links, which are useless to any
              # external service and to the editor behind the gateway.
              WEBHOOK_URL: https://n8n.${DOMAIN}/
              N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
              # Authentication is the oidc-auth SecurityPolicy at the gateway,
              # not n8n's own - SSO is an enterprise feature. n8n still keeps
              # its own local owner account behind that.
              N8N_DIAGNOSTICS_ENABLED: 'false'
              N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
              N8N_TEMPLATES_ENABLED: 'false'
              # Without this n8n logs a deprecation warning on every start and
              # will change the default in a future major.
              N8N_RUNNERS_ENABLED: 'true'
              # Execution history lives in Postgres; prune it or the table grows
              # without bound.
              EXECUTIONS_DATA_PRUNE: 'true'
              EXECUTIONS_DATA_MAX_AGE: '336'
              GENERIC_TIMEZONE: Europe/Rome
            envFrom:
              - secretRef:
                  name: n8n-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Services
          gethomepage.dev/name: n8n
          gethomepage.dev/icon: n8n.png
          gethomepage.dev/description: Workflow Automation
        hostnames:
          - n8n.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /home/node/.n8n
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
