---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: n8n-secret
    template:
      data:
        # ⚠️ n8n encrypts every stored credential with this. If it is lost or
        # changed, every credential in every workflow becomes unrecoverable -
        # n8n starts fine and only fails when a workflow tries to decrypt one.
        # Generated once and kept in Bitwarden, never derived inline.
        N8N_ENCRYPTION_KEY: '{{ .N8N_ENCRYPTION_KEY }}'
        DB_POSTGRESDB_PASSWORD: '{{ .N8N_DB_PASSWORD }}'
  dataFrom:
    - extract:
        key: n8n-secret
