---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperless-ai:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/clusterzx/paperless-ai
              tag: 3.0.9
            env:
              PAPERLESS_API_URL: http://paperless.services.svc.cluster.local:8000/api
              AI_PROVIDER: custom
              CUSTOM_BASE_URL: http://litellm.services.svc.cluster.local:4000/v1
              CUSTOM_MODEL: auto
              SCAN_INTERVAL: "30"
              PROCESS_PREDEFINED_DOCUMENTS: "yes"
              ADD_AI_PROCESSED_TAG: "true"
              AI_PROCESSED_TAG_NAME: "ai-processed"
              TAGS: "true"
              CORRESPONDENT: "true"
              DOCUMENT_TYPE: "true"
              TITLE: "true"
              PAPERLESS_AI_LANGUAGE: "Italian"
            envFrom:
              - secretRef:
                  name: paperless-ai-secrets
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
    service:
      app:
        ports:
          http:
            port: &port 3000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: Paperless AI
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/description: AI Document Cataloging
        hostnames:
          - paperless-ai.${DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
