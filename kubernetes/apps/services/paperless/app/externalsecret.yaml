---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: paperless-secrets
    template:
      data:
        INIT_POSTGRES_DBNAME: 'paperless'
        INIT_POSTGRES_HOST: 'cluster18-rw.database.svc.cluster.local'
        INIT_POSTGRES_PASS: '{{ .PAPERLESS_DBPASS }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .INIT_POSTGRES_SUPER_PASS }}'
        INIT_POSTGRES_SUPER_USER: '{{ .INIT_POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_USER: '{{ .PAPERLESS_DBUSER }}'
        PAPERLESS_ADMIN_PASSWORD: '{{ .PAPERLESS_ADMIN_PASSWORD }}'
        PAPERLESS_ADMIN_USER: '{{ .PAPERLESS_ADMIN_USER }}'
        PAPERLESS_ADMIN_MAIL: '{{ .PAPERLESS_ADMIN_MAIL }}'
        PAPERLESS_DBENGINE: 'postgresql'
        PAPERLESS_DBHOST: 'cluster18-rw.database.svc.cluster.local'
        PAPERLESS_DBNAME: 'paperless'
        PAPERLESS_DBPASS: '{{ .PAPERLESS_DBPASS }}'
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBUSER: '{{ .PAPERLESS_DBUSER }}'
        PAPERLESS_SECRET_KEY: '{{ .PAPERLESS_SECRET_KEY }}'
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "APPS": [
                {
                  "provider_id": "authentik",
                  "name": "Authelia",
                  "client_id": "paperless",
                  "secret": "{{ (fromJson .oidc_raw).secret }}",
                  "settings": {
                    "server_url": "https://auth.${DOMAIN}/.well-known/openid-configuration"
                  }
                }
              ],
              "OAUTH_PKCE_ENABLED": true
            }
          }
  # provider_id MUST remain "authentik": the callback path
  # /accounts/oidc/authentik/login/callback/ derives from it, and the existing
  # socialaccount_socialaccount rows carry provider='authentik'. It is
  # django-allauth's provider identifier, not a reference to the IdP. Only the
  # display name changes.
  data:
    - secretKey: oidc_raw
      remoteRef:
        key: paperless-oidc
  dataFrom:
    - extract:
        key: paperless-secret
    - extract:
        key: postgres-superuser-secret
