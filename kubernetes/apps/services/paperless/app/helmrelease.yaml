---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            supplementalGroups:
              - 65542
              - 568
              - 1000
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secrets
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.3
            env:
              # Configure application
              PAPERLESS_URL: https://paperless.${DOMAIN}
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: "Europe/Rome"
              PAPERLESS_WEBSERVER_WORKERS: "1"
              PAPERLESS_TASK_WORKERS: "1"
              # Configure Authentik OIDC auth
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_SOCIALACCOUNT_AUTO_SIGNUP: "true"
              PAPERLESS_SOCIALACCOUNT_EMAIL_AUTHENTICATION: "true"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
              PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /data/paperless/incoming
              PAPERLESS_DATA_DIR: /data/local/data
              PAPERLESS_EXPORT_DIR: /data/paperless/export
              PAPERLESS_MEDIA_ROOT: /data/local/media
              PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGES: ita eng
              PAPERLESS_OCR_LANGUAGE: ita
              PAPERLESS_DATE_ORDER: DMY
              # OOMKilled 2026-09-11 consuming large-format scans (a planimetria
              # held a 123-megapixel image). THREADS_PER_WORKER becomes ocrmypdf's
              # "jobs" and it defaults to 8 here, so with use_threads=True eight
              # pages are rasterised concurrently IN-PROCESS and peak memory is
              # multiplied by eight. Measured: 970Mi steady, 2219Mi ten minutes
              # into the batch, then past the 3Gi ceiling in under 30s. Eight
              # threads are pointless at cpu: 100m anyway.
              # Cost of 2: wall-clock on multi-page documents. No functional loss.
              PAPERLESS_THREADS_PER_WORKER: "2"
              # Bounds ImageMagick (barcode detection and thumbnails) so it spills
              # to disk instead of RAM. Unset means unlimited. Bytes, not a suffix.
              PAPERLESS_CONVERT_MEMORY_LIMIT: "268435456"
              # AI Classifier
              PAPERLESS_ENABLE_NLTK: "1"
              PAPERLESS_NUMBER_OF_SUGGESTED_DATES: "4"
              # LLM suggestions. The built-in classifier needs training data and has
              # almost none (22 documents), so it contributes nothing at the start of a
              # 600-sheet backlog; the LLM is what makes the cold start usable.
              # "openai-like" is the literal value - "openai" is not in the choice set
              # {ollama, openai-like}. ALLOW_INTERNAL_ENDPOINTS already defaults true,
              # so a cluster-internal endpoint needs no override.
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: http://main.ai.svc.cluster.local:4000
              PAPERLESS_AI_LLM_MODEL: auto
              PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: Italian
              # Without an embedding index the AI cannot see the existing taxonomy at
              # all: candidates come from a similarity search over already-archived
              # documents, and ai_classifier degrades SILENTLY to empty candidates on
              # retrieval failure. The model is then forced to invent new names, so it
              # proposed creating "Ricevuta" when that type already existed, plus an
              # English "Receipt" beside it. huggingface runs locally - litellm serves
              # no embedding model - so this costs nothing per document.
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: huggingface
              # Barcode separator sheets, so one ADF load can hold many documents.
              # Splitting fires only on an exact match of PATCHT, so the payment
              # barcodes on Italian bollette cannot trigger it.
              PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
              # optional integrations
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              # Configure redis integration
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local:6379
              # Configure user permissions
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  # allow up to 15m for the v3 first-boot data migrations
                  failureThreshold: 180
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                # 2Gi -> 3Gi for the local huggingface embedding model, loaded
                # in-process alongside the app.
                # 3Gi -> 4Gi after the 2026-09-11 OOM. Capping threads is the real
                # fix, but a SINGLE 123-megapixel page needs ~1Gi on its own
                # (123MP x 3B, x2-3 for working copies), so 2 threads on top of a
                # 970Mi baseline can still reach ~3Gi. The node absorbs this: it
                # sits at 37% working set, and retiring paperless-ai returned 2Gi
                # of limit budget in the same change.
                memory: 4Gi
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.36.0
            ports:
              - containerPort: 3000
            command:
              - 'gotenberg'
              - '--chromium-disable-javascript=true'
              - '--chromium-allow-list=file:///tmp/.*'
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 256Mi
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
            ports:
              - containerPort: 9998
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 256Mi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Paperless
          gethomepage.dev/icon: paperless.png
          gethomepage.dev/description: Document OCR Software
          gethomepage.dev/widget.type: paperlessngx
          gethomepage.dev/widget.url: http://paperless.services.svc.cluster.local:8000
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}` }}"
        hostnames:
          - paperless.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          paperless:
            app:
              - path: /data/local
      media:
        existingClaim: paperless-media
        globalMounts:
          - path: /data/paperless
            subPath: paperless
          - path: /data/ocis
            subPath: ocis
