---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: &namespace services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
    - ../../../../components/nfs-scaler
  interval: 1h
  path: "./kubernetes/apps/services/paperless/app"
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: authelia
      namespace: security
    - name: cloudnative-pg-cluster
      namespace: database
    - name: dragonfly-cluster
      namespace: database
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 15Gi
      CRON_EXPRESSION: '5 1 * * *'
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-ai
  namespace: &namespace services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # kopiur-external: app-template's persistence creates the PVC. This holds the
  # onboarding .env that only exists because the wizard was run by hand, so
  # losing it means running the wizard again.
  components:
    - ../../../../components/kopiur-external
  interval: 1h
  path: ./kubernetes/apps/services/paperless/ai
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: paperless
      namespace: services
    - name: litellm
      namespace: ai
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substitute:
      APP: *app
      # Default 1000 mover, deliberately NOT root. Everything in /app/data is
      # root-owned but mode 644/755, so gid 1000 reads it; the only blocker was
      # an empty ext4 lost+found at 0700 root:root, made 2770 group 1000 by hand
      # (the same shape mosquitto's has). A root mover would have needed
      # privileged-movers on THIS namespace - which also holds vaultwarden.
      CRON_EXPRESSION: '45 1 * * *'
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
