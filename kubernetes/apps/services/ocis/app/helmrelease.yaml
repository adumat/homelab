---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ocis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      ocis:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/owncloud/ocis
              tag: 8.0.4
            command:
              - /bin/sh
              - -c
            args:
              - |
                if [ ! -f /etc/ocis/ocis.yaml ]; then ocis init; else exit 0; fi
            env:
              OCIS_INSECURE: true
        containers:
          ocis:
            image:
              repository: docker.io/owncloud/ocis
              tag: 8.0.4
            env:
              OCIS_INSECURE: false
              OCIS_URL: https://files.${DOMAIN}
              OCIS_EXCLUDE_RUN_SERVICES: idp
              STORAGE_USERS_OCIS_ROOT: /data/ocis
              IDM_CREATE_DEMO_USERS: false

              PROXY_TLS: false
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml

              OCIS_GATEWAY_GRPC_ADDR: 0.0.0.0:9142
              OCIS_ENABLE_OCM: false

              PROXY_AUTOPROVISION_ACCOUNTS: true
              PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none # https://github.com/owncloud/ocis/issues/6479
              PROXY_OIDC_SKIP_USER_INFO: false # do NOT set this to true when having TOKEN_VERIFY_METHOD as none, or we have no security
              PROXY_OIDC_REWRITE_WELLKNOWN: true
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
              PROXY_USER_CS3_CLAIM: username
              PROXY_USER_OIDC_CLAIM: preferred_username
              OCIS_OIDC_ISSUER: https://auth.${DOMAIN}/application/o/ocis/
              WEB_OIDC_METADATA_URL: https://auth.${DOMAIN}/application/o/ocis/.well-known/openid-configuration
              # see https://doc.owncloud.com/ocis/next/deployment/services/s-list/proxy.html#automatic-role-assignments for group name info
              WEB_OIDC_CLIENT_ID: ocis
              WEB_OIDC_SCOPE: openid profile email groups offline_access

              SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: false
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: false
              GRAPH_USERNAME_MATCH: none

              NOTIFICATIONS_SMTP_PORT: 587

              # OCIS_LOG_COLOR: true
              # OCIS_LOG_LEVEL: info
              # OCIS_LOG_PRETTY: true
              TZ: Europe/Rome
            envFrom:
              - secretRef:
                  name: ocis-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 9200
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: ownCloud
          gethomepage.dev/icon: owncloud.png
          gethomepage.dev/description: File Sync & Share
        hostnames:
          - files.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: *app
        globalMounts:
          - path: /etc/ocis/csp.yaml
            subPath: csp.yaml
            readOnly: true
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/ocis
            subPath: data
          - path: /etc/ocis
            subPath: config
      media:
        existingClaim: ocis-media
        globalMounts:
          - path: /data/paperless
            subPath: paperless
          - path: /data/ocis
            subPath: ocis
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
