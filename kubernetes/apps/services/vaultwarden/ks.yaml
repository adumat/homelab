---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vaultwarden
  namespace: &namespace services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/services/vaultwarden/app
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: cloudnative-pg-cluster
      namespace: database
    - name: miroir-config
      namespace: miroir-system
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substitute:
      APP: *app
      # Must be stated: the live PVC is 1Gi and KOPIUR_CAPACITY defaults to 5Gi,
      # so leaving it unset silently grows the volume on migration.
      KOPIUR_CAPACITY: 1Gi
      CRON_EXPRESSION: '55 0 * * *'
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
