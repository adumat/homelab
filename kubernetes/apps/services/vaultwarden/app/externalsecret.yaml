---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden
    template:
      data:
        admin-token: '{{ index . "admin-token" }}'
        pg-password: '{{ index . "pg-password" }}'
        pg-uri: '{{ index . "pg-uri" }}'
        pg-user: '{{ index . "pg-user" }}'
        push-id: '{{ index . "push-id" }}'
        push-key: '{{ index . "push-key" }}'
        smtp-password: '{{ index . "smtp-password" }}'
        smtp-user: '{{ index . "smtp-user" }}'
  dataFrom:
    - extract:
        key: vaultwarden-secret
