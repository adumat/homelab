---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ippopeto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ippopeto-secret
    template:
      data:
        IPPO_ACCESS_CODE: '{{ .IPPO_ACCESS_CODE }}'
  dataFrom:
    - extract:
        key: ippopeto-secret
