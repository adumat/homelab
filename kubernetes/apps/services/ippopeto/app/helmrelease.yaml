---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ippopeto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      ippopeto:
        # rooms live in process memory, so two pods would split players between two games
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/adumat/ippopeto
              tag: "0.9.0"
            env:
              TZ: Europe/Rome
              # worst case 4 rooms x 12 clients x ~7 KB/s stays under the ~8 Mbit/s home uplink
              MAX_ROOMS: "4"
            envFrom:
              - secretRef:
                  name: ippopeto-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: &port 8080 }
                  periodSeconds: 10
              readiness: *probes
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { memory: 192Mi }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http: { port: *port }
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: Ippopeto
          gethomepage.dev/description: Party game
        hostnames: ["{{ .Release.Name }}.${DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{ identifier: app, port: *port }]
