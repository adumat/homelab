---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: jellyfin
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 44 # video
              - 109 # render
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.7@sha256:2b93aa3830dcd0aab7185c635e20edef1f8dc5d2e999768baf1724e88c078004
            env:
              TZ: Europe/Rome
              JELLYFIN_PublishedServerUrl: "https://jf.${DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_CACHE_DIR: "/cache"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
              claims:
                - name: gpu
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      echo "Waiting for system.xml to enable metrics..."
                      timeout=300 # 5 minutes timeout
                      interval=5  # Check every 5 seconds
                      elapsed=0
                      while [ ! -f /config/config/system.xml ]; do
                        if [ $elapsed -ge $timeout ]; then
                          echo "ERROR: Timed out waiting for /config/config/system.xml" >&2
                          exit 1
                        fi
                        sleep $interval
                        elapsed=$((elapsed + interval))
                      done
                      echo "Found /config/config/system.xml, enabling metrics..."
                      # Check if metrics are already enabled before running sed
                      if ! grep -q '<EnableMetrics>true</EnableMetrics>' /config/config/system.xml; then
                        sed 's,<EnableMetrics>false</EnableMetrics>,<EnableMetrics>true</EnableMetrics>,' -i /config/config/system.xml
                        if [ $? -eq 0 ]; then
                          echo "Metrics enabled successfully."
                        else
                          echo "ERROR: Failed to enable metrics in /config/config/system.xml" >&2
                          exit 1
                        fi
                      else
                        echo "Metrics already enabled."
                      fi
                      exit 0
    defaultPodOptions:
      securityContext:
        # runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109]
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/app: jellyfin
          gethomepage.dev/icon: jellyfin.png
          gethomepage.dev/description: Jellyfin media server
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: http://jellyfin.media.svc.cluster.local:8096
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}` }}"
        hostnames:
          - jf.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: jellyfin
      media:
        type: nfs
        server: elizabeth.lan
        path: /mnt/user/media
      cache:
        type: persistentVolumeClaim
        existingClaim: jellyfin-cache
      transcodes:
        type: persistentVolumeClaim
        existingClaim: jellyfin-transcode
      tmp:
        type: emptyDir
      hwa:
        type: hostPath
        hostPath: /dev/dri
        advancedMounts:
          jellyfin:
            app:
              - path: /dev/dri
