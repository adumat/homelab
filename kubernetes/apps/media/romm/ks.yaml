---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app romm
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/nfs-scaler
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/media/romm/app
  dependsOn:
    - name: external-secrets-store
      namespace: security
    - name: cloudnative-pg-cluster
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: volsync-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      # No KOPIUR_PUID/PGID override on purpose - the default 1000 is correct.
      # romm's CONTAINER runs as root, but every file on the volume is owned by
      # 1000:1000 (the app drops privileges; the 1000 group on the setgid dirs is
      # not fsGroup). 29 of them are mode 0600, and a mover as 1000 owns them.
      # An earlier "fix" set this to 0 and broke the backup for two days: kopiur's
      # mover drops ALL capabilities, so uid 0 has no CAP_DAC_OVERRIDE and loses
      # the owner match it needs. Measured: 0 -> PermissionDenied on those 29,
      # 1000 -> Succeeded, 212,918,436 bytes. See AGENTS.md.
      CRON_EXPRESSION: '40 0 * * *'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
