---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: romm-secrets
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 4.9.2@sha256:c81778afcafe7c865bdf156d1c62349aec3dfca3aca5ec0d6c2c2e8bfa9fb071
            env:
              TZ: Europe/Rome
              ROMM_DB_DRIVER: postgresql
              OIDC_ENABLED: 'true'
              OIDC_PROVIDER: authentik
              OIDC_REDIRECT_URI: 'https://romm.${DOMAIN}/api/oauth/openid'
              OIDC_SERVER_APPLICATION_URL: 'https://auth.${DOMAIN}/application/o/romm'
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Media
          gethomepage.dev/name: RomM
          gethomepage.dev/icon: romm.png
          gethomepage.dev/description: ROM Manager
        hostnames:
          - romm.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /romm/resources
            subPath: resources
          - path: /romm/assets
            subPath: assets
          - path: /romm/config
            subPath: config
      library:
        type: nfs
        server: elizabeth.lan
        path: /mnt/user/media/romm
        globalMounts:
          - path: /romm/library
