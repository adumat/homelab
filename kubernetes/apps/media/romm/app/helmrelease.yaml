---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 1h
  # A romm minor bump runs one-way Alembic migrations on first boot, which is why
  # the startup probe below allows 15m (failureThreshold 180 x periodSeconds 5).
  # The matching Helm timeout is no longer set here - it is the cluster-wide
  # default in kubernetes/flux/cluster/ks.yaml, which explains the deadlock this
  # pair exists to prevent.
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: romm-secrets
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.3.1@sha256:0d66b4ea152a237c7f24b95e87459f46d3c596a7c0b35a82f26bc971487278b3
            env:
              TZ: Europe/Rome
              ROMM_DB_DRIVER: postgresql
              OIDC_ENABLED: 'true'
              OIDC_PROVIDER: authelia
              OIDC_REDIRECT_URI: 'https://romm.${DOMAIN}/api/oauth/openid'
              OIDC_SERVER_APPLICATION_URL: 'https://auth.${DOMAIN}'
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 180
                  periodSeconds: 5
            # romm forks three uvicorn workers and sits near 1Gi at idle, so the
            # stock 1Gi limit is a ceiling it reaches rather than a bound it
            # respects - it OOM-killed roughly every 30 minutes at that value.
            # 2Gi is headroom over the observed floor, not a measured peak: the
            # true ceiling cannot be read while the limit truncates it.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Media
          gethomepage.dev/name: RomM
          gethomepage.dev/icon: romm.png
          gethomepage.dev/description: ROM Manager
        hostnames:
          - romm.${DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /romm/resources
            subPath: resources
          - path: /romm/assets
            subPath: assets
          - path: /romm/config
            subPath: config
      library:
        type: nfs
        server: elizabeth.lan
        path: /mnt/user/media/romm
        globalMounts:
          - path: /romm/library
