---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komga
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: komga-secrets
    # The whole application.yml is rendered here rather than split between a
    # ConfigMap and env vars. Komga reads /config/application.yml, and Spring's
    # relaxed binding makes the env-var spelling of client-id/client-secret
    # ambiguous (CLIENT_ID vs CLIENTID). Keeping the file whole keeps the
    # secret out of git without needing Flux's $${} escaping.
    template:
      engineVersion: v2
      data:
        application.yml: |
          komga:
            # Deliberately false. Komga links an OIDC identity to an existing
            # local account BY EMAIL; with creation enabled, a first OIDC login
            # before the local account exists makes a SECOND account instead and
            # read progress splits across the two.
            oauth2-account-creation: false
          spring:
            security:
              oauth2:
                client:
                  registration:
                    authelia:
                      client-id: 'komga'
                      client-secret: '{{ (fromJson .oidc_raw).secret }}'
                      client-name: 'Authelia'
                      scope: 'openid,profile,email'
                      authorization-grant-type: 'authorization_code'
                      redirect-uri: '{baseScheme}://{baseHost}{basePort}{basePath}/login/oauth2/code/authelia'
                  provider:
                    authelia:
                      issuer-uri: 'https://auth.${DOMAIN}'
                      user-name-attribute: 'preferred_username'
  data:
    - secretKey: oidc_raw
      remoteRef:
        key: komga-oidc
