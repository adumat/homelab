---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
  - repo: local
    hooks:
      - id: shellcheck
        name: Shellcheck
        entry: mise exec -- shellcheck
        args: [--severity=error]
        language: system
        types: [shell]
  - repo: local
    hooks:
      - id: tofu-fmt
        name: OpenTofu fmt
        files: ^infra/.*\.tf$
        entry: mise exec -- tofu fmt -diff -check
        language: system
        pass_filenames: false
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: kubeconform
        name: Kubeconform
        files: ^kubernetes/.*\.yaml$
        exclude: (kustomization\.yaml|secret\.sops\.yaml|talconfig\.yaml|talenv\.yaml|talos/patches/|/dashboards/|/resources/|/blueprints/|bootstrap/helmfile\.d/)
        entry: mise exec -- kubeconform
        args:
          - -strict
          - -ignore-missing-schemas
          - -schema-location
          - default
          - -schema-location
          - "https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          - -skip
          - Secret
          - -summary
        language: system
