[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
BOOTSTRAP_DIR = "{{config_root}}/kubernetes/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/kubernetes/talos"
TALOSCONFIG = "{{config_root}}/kubernetes/talos/clusterconfig/talosconfig"

[tools]
python = "3.14.7"
uv = "latest"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cloudflare/cloudflared" = "2026.8.3"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:kubernetes/kubectl" = "1.37.0"
"aqua:siderolabs/talos" = "1.13.7"
"aqua:yannh/kubeconform" = "0.8.0"
"pipx:makejinja" = "2.8.2"
helm-diff = { version = "3.15.12", bin = "diff", bin_path = "diff/bin", rename_exe = "helm-diff", exe = "diff" }
krew = "0.5.0"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.0"

"aqua:opentofu/opentofu" = "1.12.6"
"aqua:bitwarden/sdk-sm" = "2.1.0"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"aqua:charmbracelet/gum" = "2.0.0"
"npm:prettier" = "3.9.6"
"aqua:koalaman/shellcheck" = "0.11.0"
"pipx:pre-commit" = "4.6.2"


"aqua:cli/cli" = "2.100.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:go-task/task" = "3.53.1"
"github:home-operations/flate" = "0.6.5"
