[hooks]
postinstall = "ansible-galaxy collection install -r infrastructure/requirements.yaml --force >/dev/null 2>&1 || true"

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
BOOTSTRAP_DIR = "{{config_root}}/kubernetes/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/kubernetes/talos"
TALOSCONFIG = "{{config_root}}/kubernetes/talos/clusterconfig/talosconfig"

[tools]
python = "3.14.2"
uv = "latest"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:budimanjojo/talhelper" = "3.0.45"
"aqua:cilium/cilium-cli" = "0.18.9"
"aqua:cloudflare/cloudflared" = "2025.11.1"
"aqua:fluxcd/flux2" = "2.7.5"
"aqua:getsops/sops" = "3.11.0"
"aqua:helm/helm" = "3.19.4"
"aqua:helmfile/helmfile" = "1.2.3"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:mikefarah/yq" = "4.50.1"
"aqua:kubernetes/kubectl" = "1.35.0"
"aqua:siderolabs/talos" = "1.12.1"
"aqua:yannh/kubeconform" = "0.7.0"
"pipx:makejinja" = "2.8.2"
helm-diff = { version = "3.14.1", exe = "diff", rename_exe = "helm-diff" }
krew = "0.4.5"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.28.0"

"aqua:bitwarden/sdk-sm" = "1.0.0"
"aqua:mitsuhiko/minijinja" = "2.15.1"
"aqua:charmbracelet/gum" = "0.17.0"
"npm:prettier" = "3.7.4"
"aqua:koalaman/shellcheck" = "0.10.0"
"pipx:pre-commit" = "4.2.0"
"pipx:ansible-lint" = "25.12.2"
"pipx:ansible-core" = "2.19.0"


"aqua:cli/cli" = "2.83.2"
"aqua:cue-lang/cue" = "0.15.3"
"aqua:go-task/task" = "3.46.4"
"pipx:flux-local" = ["8.1.0"]
