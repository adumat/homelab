---
# Backup intent for every PVC in the cluster. Checked by `just backup-audit`.
#
# This file lists ONLY the exceptions - the volumes deliberately not backed up by
# kopiur, and why. "Protected" is never listed here: the audit derives it from the
# live SnapshotPolicy objects, so there is exactly one source of truth for what is
# backed up and this file cannot drift out of agreement with it.
#
# The rule the audit enforces: every live PVC is either named by a SnapshotPolicy
# or listed below. Anything else is a finding. That is the gap that let
# services/paperless-ai run for four months with no backup at all while looking
# perfectly healthy.
#
# Adding an app? Either give it components/kopiur (or kopiur-external), or add it
# here with a reason. Do not add it here to silence the audit.
version: 1

# Protected by something OTHER than kopiur. Not a gap.
external:
  - pvc: database/cluster18-1
    by: barman
  - pvc: database/cluster18-1-wal
    by: barman
  - pvc: database/cluster18-2
    by: barman
  - pvc: database/cluster18-2-wal
    by: barman
  - pvc: database/immich-db-1
    by: barman
  - pvc: database/immich-db-1-wal
    by: barman
  - pvc: database/immich-db-2
    by: barman
  - pvc: database/immich-db-2-wal
    by: barman
    # A filesystem snapshot of a live Postgres, with WAL on a SEPARATE PVC
    # snapshotted at a different instant, is inconsistent. barman is the only
    # correct mechanism for these - never move them to kopiur.
    reason: CNPG data and WAL; barman is the only consistent mechanism

  # 1Mi stubs with no StorageClass: these are NFS bind mounts, so the data is not
  # in the PVC at all - it lives on elizabeth and is covered by the array.
  # ⚠️ Parity is not a backup. Whether elizabeth's own shares are backed up
  # anywhere is a separate open question, tracked outside this file.
  - pvc: downloads/metube-media
    by: elizabeth-nfs
  - pvc: downloads/pyload-ng-media
    by: elizabeth-nfs
  - pvc: home/immich-photos
    by: elizabeth-nfs
  - pvc: services/ocis-media
    by: elizabeth-nfs
  - pvc: services/paperless-media
    by: elizabeth-nfs

# Deliberately NOT backed up. Every entry needs a reason that says why losing it
# is acceptable, not merely what it is.
disposable:
  # Observability history - decided 2026-08-20 on the numbers, not by default.
  # prometheus alone is 16GB in use against a 7.0GB TOTAL repository, and its
  # content self-expires at 14d retention, so a restore would recover metrics
  # that are already partly stale. victoria-logs is the same argument at 14d.
  # alertmanager is only 40KB, but its real state is silences - and those are
  # declared in git under silence-operator/silences, so they are reconstructible.
  - pvc: observability/prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
    reason: 16GB of metrics that expire at 14d; costs more than the whole repository
  - pvc: observability/server-volume-victoria-logs-server-0
    reason: logs expire at 14d retention
  - pvc: observability/alertmanager-kube-prometheus-stack-db-alertmanager-kube-prometheus-stack-0
    reason: only real state is silences, and those are declared in git
  - pvc: observability/config-gatus-0
    reason: config comes from git; the volume holds only probe history

  # Caches: regenerated by the app on first use.
  - pvc: flux-system/konflate-cache
    reason: rebuildable cache
  - pvc: home/esp-home-cache
    reason: rebuildable cache (build artifacts)
  - pvc: home/home-assistant-cache
    reason: rebuildable cache
  - pvc: home/immich-ml-cache
    reason: rebuildable cache (downloaded ML models)
  - pvc: media/jellyfin-cache
    reason: rebuildable cache (artwork, metadata images)
  - pvc: media/jellyseerr-cache
    reason: rebuildable cache
  - pvc: media/jellyfin-transcode
    reason: transcode scratch, empty between sessions

  # Ceph mon stores. A mon is rebuilt from its peers, and phase 3 removes Ceph
  # entirely in favour of miroir - so backing these up would preserve state that
  # is deliberately being retired.
  - pvc: rook-ceph/rook-ceph-mon-a
    reason: mon store rebuilds from peers; Ceph is retired in phase 3
  - pvc: rook-ceph/rook-ceph-mon-b
    reason: mon store rebuilds from peers; Ceph is retired in phase 3
  - pvc: rook-ceph/rook-ceph-mon-d
    reason: mon store rebuilds from peers; Ceph is retired in phase 3

# Short-lived by intent. The audit reports these as a reminder, not a failure -
# an entry that has outlived its purpose should be deleted, not re-justified.
temporary:
  - pvc: downloads/prowlarr-rescue
    reason: pre-migration rescue copy from 2026-08-12; delete after phase 3
    delete_after: phase-3
